name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package + CI extras
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[ci]"
          pip install "ruff==0.16.3"

      - name: Lint (ruff)
        shell: bash
        run: ruff check src/ tests/

      - name: Run script tests
        shell: bash
        run: |
          set -euo pipefail
          python tests/test_knowledge.py
          python tests/test_hunt_parser.py
          python tests/test_integration.py
          python tests/test_detection.py
          python tests/test_ti.py
          python tests/test_ingest.py
          python tests/functional_audit.py
          python tests/test_portal.py

      - name: Run pytest
        shell: bash
        run: python -m pytest -q --tb=short

  frontend:
    name: Frontend & Style Budget
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Typecheck & lint
        working-directory: frontend
        run: npm run lint

      - name: Run Vitest suite
        working-directory: frontend
        run: npm test

      - name: Build production bundle
        working-directory: frontend
        run: npm run build

      - name: Check frontend style budget
        run: python scripts/frontend_style_budget.py
