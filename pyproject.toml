[project]
name = "dfir-nexus"
version = "0.1.0"
description = "Unified DFIR investigation platform — AI-assisted, MCP-powered, human-in-the-loop"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
    { name = "Unallocated Inc" },
    { name = "DFIR-Nexus contributors" },
]

dependencies = [
    "mcp>=1.26",
    "typer>=0.15",
    "pyyaml>=6.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
http = [
    "starlette>=0.40",
    "uvicorn>=0.30",
]
rag = [
    "chromadb>=0.5",
    "sentence-transformers>=3.0",
]
triage = [
    "orjson>=3.0",
    "zstandard>=0.20",
]
opensearch = [
    "opensearch-py>=2.0",
]
opencti = [
    "pycti>=6.0",
]
encrypt = [
    "cryptography>=42.0",
]
all = [
    "dfir-nexus[http]",
    "dfir-nexus[rag]",
    "dfir-nexus[triage]",
    "dfir-nexus[opensearch]",
    "dfir-nexus[opencti]",
    "dfir-nexus[encrypt]",
]

[project.urls]
homepage = "https://github.com/Unallocated/DFIR-Nexus"
documentation = "https://github.com/Unallocated/DFIR-Nexus/tree/main/Docs"

[project.scripts]
nexus = "nexus.cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nexus"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501", "E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
