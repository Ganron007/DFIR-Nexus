[project]
name = "dfir-nexus"
version = "0.9.0b0"
description = "Unified DFIR investigation platform — AI-assisted, MCP-powered, human-in-the-loop"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
    { name = "Unallocated Inc" },
    { name = "DFIR-Nexus contributors" },
]

dependencies = [
    # mcp 2.0 on PyPI removed mcp.server.fastmcp (breaking). Stay on official 1.x SDK.
    "mcp>=1.26,<2",
    "typer>=0.15",
    "pyyaml>=6.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
http = [
    "starlette>=0.40",
    "uvicorn>=0.30",
]
rag = [
    "chromadb>=0.5",
    "sentence-transformers>=3.0",
    # Security pin (PYSEC-2026-3545/46/47) — aiohttp arrives via chromadb.
    "aiohttp>=3.14.3",
]
triage = [
    "orjson>=3.0",
    "zstandard>=0.20",
]
opencti = [
    # >=7.260807.0 relaxes the setuptools pin so the PYSEC-2026-3447 fix applies.
    "pycti>=7.260807.0",
]
encrypt = [
    # Security pin (PYSEC-2026-3552).
    "cryptography>=50.0.0",
]
detection = [
    "pysigma>=0.11",
    "pysigma-backend-elasticsearch>=1.0",
    "pysigma-backend-splunk>=1.0",
]
dfir = [
    # Host-artifact parsers used by the ingest importers (EVTX, registry,
    # LNK). Importers degrade gracefully when these are absent.
    # NOTE: PyPI `lnkfile` has a broken sdist (build fails); pylnk3 is the
    # maintained pure-Python LNK parser. `prefetch-parser` is excluded
    # because it compiles libscca from source (no Windows wheels) — install
    # it manually where a C toolchain is available.
    "python-evtx>=0.7",
    "python-registry>=1.3",
    "regipy>=2.0",
    "pylnk3>=0.4",
]
pipeline = [
    "langgraph>=0.2",
    "langchain-anthropic>=0.1",
    "langchain-openai>=0.1",
    "langchain-mcp-adapters>=0.0.1",
    # Security pin (PYSEC-2026-3545/46/47) — aiohttp arrives via langchain.
    "aiohttp>=3.14.3",
]
collect = [
    # Password SSH (key auth uses the system ssh/scp binaries — no extra).
    "paramiko>=3.4",
    # WinRM from Linux, or pywinrm Session on Windows.
    "pywinrm>=0.5",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]
# Lean install for GitHub Actions — skips heavy RAG (torch/chroma) and OpenCTI.
ci = [
    "dfir-nexus[http]",
    "dfir-nexus[triage]",
    "dfir-nexus[encrypt]",
    "dfir-nexus[detection]",
    "dfir-nexus[pipeline]",
    "dfir-nexus[dev]",
]
all = [
    "dfir-nexus[http]",
    "dfir-nexus[rag]",
    "dfir-nexus[triage]",
    "dfir-nexus[opencti]",
    "dfir-nexus[encrypt]",
    "dfir-nexus[detection]",
    "dfir-nexus[dfir]",
    "dfir-nexus[pipeline]",
    "dfir-nexus[collect]",
    "dfir-nexus[dev]",
]

[project.urls]
homepage = "https://github.com/Unallocated/DFIR-Nexus"
documentation = "https://github.com/Unallocated/DFIR-Nexus/tree/main/Docs"

[project.scripts]
nexus = "nexus.cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nexus"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501", "E402"]

[tool.ruff.lint.per-file-ignores]
# Typer declares options/arguments as function-parameter defaults — B008 is
# the framework's idiom, not a bug.
"src/nexus/cli/*.py" = ["B008"]
# Step-by-step audit script imports modules at the point of use, on purpose.
"tests/functional_audit.py" = ["I001", "E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# Default pytest discovery: every tests/test_*.py runs in the full suite.
# (A previous explicit allowlist silently excluded 28 test files — including
# the Mode 1/2/3, portal, RAG and Phase 4 API suites — from full runs.)
python_files = ["test_*.py"]
