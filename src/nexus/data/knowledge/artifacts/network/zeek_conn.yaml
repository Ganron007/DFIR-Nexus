name: Zeek Connection & Protocol Logs
description: "Zeek network security monitor structured telemetry (conn.log, dns.log, http.log, ssl.log, smb.log)"
platform: network

locations:
  - path: "extractions/network/conn.log (or conn.log, dns.log, http.log, ssl.log)"
    os_versions: ["Cross-platform"]
    notes: "Generated by Zeek from registered PCAP captures or ingested directly."

proves:
  - "Exact 5-tuple metadata, byte/packet counts, connection state, JA3/SNI/TLS certificates, and DNS query/response pairs"
  - "Beaconing regularity, internal lateral SMB/WinRM connections, and byte asymmetry"

does_not_prove:
  - "Decrypted TLS payload contents or endpoint parent process identity without correlating host telemetry"

corroborate_with:
  for_alerts: [suricata_eve]
  for_host: [event_logs_sysmon, auth_log]

related_tools: [zeek, tshark]

references:
  - "SANS SEC503 / FOR572 - Network Forensics"
