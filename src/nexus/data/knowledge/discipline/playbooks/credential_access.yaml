name: "Credential Access Investigation"
description: "Investigate indicators of credential theft, dumping, or Kerberos abuse"
mitre: ["T1003", "T1558"]
query_terms:
  - mimikatz
  - procdump
  - lsass
  - lsass.dmp
  - comsvcs
  - sekurlsa
  - ntds.dit
  - ntdsutil
  - hashdump
  - wdigest
  - sedebug
  - nanodump
  - sharpdump
  - safekatz
  - "325"
  - "326"
  - "327"
  - "216"
sources:
  - "13Cubed — Investigating Windows Endpoints (LSASS, NTDS.dit, WDigest)"
  - "SANS FOR508 — Windows Enterprise Incident Response"
  - "MITRE ATT&CK T1003 — OS Credential Dumping"
  - "MITRE ATT&CK T1558 — Steal or Forge Kerberos Tickets"
triggers:
  - "LSASS access detected in Sysmon Event ID 10"
  - "Known credential tools in Prefetch (mimikatz, procdump, comsvcs.dll)"
  - "Kerberoasting event patterns (Event ID 4769 with RC4 encryption)"
  - "Suspicious process accessing credential stores"
  - "lsass.dmp file created in %LOCALAPPDATA%\\Temp (Task Manager 'Create Dump File' default name/location)"
  - "ESENT events 216/325/326/327 in Application log (ntdsutil IFM or database movement)"
  - "Process holding SeDebugPrivilege accessing lsass.exe"
phases:
  - phase: "Identify"
    steps:
      - "Parse Sysmon logs for LSASS access events with Hayabusa (via run_command / run_windows_command)"
      - "Check Prefetch for known credential tool execution using PECmd (via run_windows_command)"
      - "Check running processes with Volatility3 pslist and psscan (via run_command) if memory image available"
      - "Search the filesystem for lsass.dmp / *.dmp in user Temp directories (MFTECmd / fls)"
      - "Check Application log ESENT provider events 216, 325, 326, 327 for ntdsutil/IFM activity"
  - phase: "Tool Identification"
    steps:
      - "Check file hashes of suspected credential tools (opencti: lookup_hash)"
      - "Verify files against Windows baseline (windows-triage: check_file)"
      - "Submit unknown executables for static analysis (remnux: analyze_file)"
  - phase: "Scope"
    steps:
      - "Check for Kerberoasting events — Event ID 4769 with RC4 encryption type (0x17)"
      - "Check for pass-the-hash logon patterns — Event ID 4624 Type 9 or NTLM logons"
      - "Check for DCSync indicators — Event ID 4662 with replication rights GUIDs"
      - "Check for password spraying — one password across many accounts (4625 bursts, low per-account count)"
      - "Check for credential stuffing / breach-reuse logons and cookie theft (session replay without logon)"
  - phase: "Impact"
    steps:
      - "Identify all accounts potentially compromised based on tool access patterns"
      - "Check for subsequent logons using potentially stolen credentials"
      - "Determine credential scope — local accounts, domain accounts, service accounts"
      - "If WDigest is enabled (UseLogonCredential=1), plaintext passwords may be in LSASS — treat all cached credentials as exposed"
  - phase: "Record"
    steps:
      - "Record finding with all evidence IDs"
      - "HITL checkpoint — credential compromise affects investigation scope determination"
caveats:
  - "Task Manager 'Create Dump File' on lsass.exe writes lsass.dmp to %LOCALAPPDATA%\\Temp by default — that exact filename/location is high-signal."
  - "Dumping LSASS requires SeDebugPrivilege (admin or delegated). A non-admin process accessing lsass.exe is anomalous by itself."
  - "ntdsutil 'IFM' is a LOLBIN path to NTDS.dit extraction; its ESENT provider events (216 database location change, 325 create, 326 attach, 327 detach) appear in the Application log."
  - "Only lsass.exe should ever be running as LSASS — multiple LSASS-named processes indicate masquerading."
  - "Kerberoasting shows as 4769 with encryption type 0x17 (RC4); a burst of 4769 for many SPNs from one source is the pattern, not a single event."
  - "WDigest plaintext caching depends on UseLogonCredential registry value; on patched systems it is off by default."
