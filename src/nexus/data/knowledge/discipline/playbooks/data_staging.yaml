name: "Data Staging Investigation"
description: "Investigate data collection and staging activity indicating preparation for exfiltration"
mitre: ["T1074", "T1560", "T1070.004"]
query_terms:
  - sdelete
  - cipher.exe
  - 7z.exe
  - winrar
  - rar.exe
  - .pst
  - googledrive
  - drivefs
  - onedrive
  - my drive
  - rclone
  - robocopy
  - recycle.bin
  - $recycle
sources:
  - "SANS FOR508 — Windows Enterprise Incident Response"
  - "MITRE ATT&CK T1074 — Data Staged"
  - "MITRE ATT&CK T1560 — Archive Collected Data"
triggers:
  - "Large archive file creation in temp or staging directory"
  - "Archive tool (rar, 7z, zip) executed from unusual location"
  - "Compression tool execution detected in Prefetch"
  - "Unusual volume of file access in short timeframe"
phases:
  - phase: "Identify"
    steps:
      - "Check Prefetch for archive tool execution using PECmd (via run_windows_command) — look for 7z.exe, rar.exe, WinRAR.exe, compact.exe"
      - "Check MFT for large file creation in temp or staging paths using MFTECmd (via run_command / run_windows_command)"
      - "Check USN Journal for file rename and creation operations around staging time"
  - phase: "Content"
    steps:
      - "Check Shellbags for folder access patterns using RECmd (via run_command / run_windows_command)"
      - "Check Jump Lists for recent file access using JLECmd (via run_command / run_windows_command)"
      - "Determine what data was accessed before the staging activity"
  - phase: "Exfiltration"
    steps:
      - "Check network connections around staging time using tshark or zeek (via run_command) if PCAP available"
      - "Check for cloud upload activity in browser history using Hindsight (via run_command)"
      - "Check for large outbound data transfers in SRUM using SrumECmd (via run_command / run_windows_command)"
  - phase: "USB Check"
    steps:
      - "Check USB device connections around staging time — MountPoints2 in registry via RECmd (via run_command / run_windows_command)"
      - "Check USBSTOR registry entries for device serial numbers and connection times"
  - phase: "Record"
    steps:
      - "Record finding including timeline from data access through staging through potential exfiltration"
      - "Include all evidence IDs from each analysis phase"
caveats:
  - "SRUM tracks per-application network DATA VOLUME (via SrumECmd {D8F...} data tables) — it is the primary artifact for proving 'how much left the host', not where it went."
  - "ShellBags are the 'GPS for the filesystem': they record FOLDERS (not files) browsed in Explorer with first/last-interacted timestamps, and they survive deletion of the folder — use them to prove what was browsed before staging (see user_activity playbook)."
  - "sdelete renames files (sdeleteNN.tmp pattern) before overwrite — look for the rename chain in USN journal, not just the final deletion."
  - "Recycle Bin presence does not prove user deletion intent — $I files record original path and deletion TIME (UTC); $R files hold content (see file_deletion playbook)."
  - "Archive tools (7z/rar/compact) are frequently used legitimately — staging findings need the accessed-file context (ShellBags/Jump Lists) to be meaningful."
  - "Cloud sync (DriveFS/OneDrive) uploads can look like exfiltration; check whether the account is the user's own before attributing exfiltration."
  - "Compact.exe (LZNT1 compression) is a native alternative to 7z/rar — include it in archive-tool Prefetch review."
  - "Exfil channels beyond cloud: FTP/SFTP/TFTP, email, steganography, RAT/VPN tunneling — corroborate with SRUM volumes and Packetbeat/Zeek flows (CCD Module 8)."
