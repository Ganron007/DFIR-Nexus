name: "DNS Anomaly Investigation"
description: "Investigate DNS tunneling, domain generation algorithms, and unusual query patterns"
mitre: ["T1071.004", "T1568.002"]
query_terms:
  - dns
  - txt
  - nxdomain
  - dnscat
  - iodine
  - "22"
  - sysmon
sources:
  - "13Cubed — Investigating Windows Endpoints (Sysmon for Linux / event log channels)"
  - "SANS FOR572 — Advanced Network Forensics"
  - "MITRE ATT&CK T1071.004 — DNS"
  - "MITRE ATT&CK T1568.002 — Domain Generation Algorithms"
triggers:
  - "High-entropy domain queries suggesting DGA"
  - "Excessive DNS query volume from single host"
  - "Long subdomain labels suggesting DNS tunneling"
  - "Unusual TXT record queries or responses"
  - "Sysmon Event ID 22 (DNS query) with process context pointing at LOLBins"
phases:
  - phase: "Identify"
    steps:
      - "Analyze DNS logs or PCAP using tshark with DNS filter (via run_command) — tshark -Y dns"
      - "Parse Zeek dns.log for query patterns (via run_command)"
      - "Filter for unusual query patterns — long names, high frequency, non-standard types"
  - phase: "Classify"
    steps:
      - "Check for DGA characteristics — random-looking labels, high character entropy, mathematical patterns"
      - "Check for tunneling indicators — long subdomain labels (>30 chars), high volume TXT queries, encoded data in queries"
      - "Compare against known benign high-volume DNS patterns (CDN, telemetry)"
  - phase: "Threat Intel"
    steps:
      - "Check suspicious domains against threat intelligence (opencti: lookup_ioc)"
      - "Search for DNS exfiltration and tunneling techniques (forensic-rag: search)"
  - phase: "Source"
    steps:
      - "Identify which systems and processes are generating the anomalous queries"
      - "Check if DNS queries correlate with process execution on endpoint using Sysmon Event ID 22"
  - phase: "Record"
    steps:
      - "Record finding including DNS patterns, source systems, and threat intelligence results"
      - "Include all evidence IDs from each analysis phase"
caveats:
  - "Sysmon Event ID 22 logs DNS QUERIES (the question), not the resolver's answer — a query appearing in Sysmon does not prove it was resolved."
  - "Zeek dns.log records answers the local resolver returned; NXDOMAIN bursts are a DGA/tunneling signal but also occur with misconfigured clients."
  - "TXT-record volume is the strongest tunneling signal; A-record volume alone is usually benign (CDNs)."
  - "Endpoint DNS artifacts (Sysmon 22) tie queries to a process; network-only DNS logs cannot attribute to a process."
  - "RITA DNS tunneling workflow: 'rita show-exploded-dns <db> -H' (exploded subdomain view) and 'rita show-beacons-fqdn <db> -H'; massive queries to one second-level domain with NO matching HTTP traffic is the strong exfil indicator (CCD labs 34-35)."
  - "Exfil channels beyond DNS: FTP/SFTP/TFTP, cloud sync (Dropbox/Drive/OneDrive), email, steganography, RAT/VPN tunneling — check SRUM data volumes and Packetbeat flows, not just DNS (CCD Module 8)."
