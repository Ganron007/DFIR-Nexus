name: "External Compromise Investigation"
description: "Investigate intrusion, malware, persistence, and C2 on a host or from SIEM/EDR exports"
mitre: ["T1078", "T1059", "T1547"]
query_terms:
  - mimikatz
  - cobalt
  - beacon
  - psexec
  - psexesvc
  - encodedcommand
  - wevtutil
  - rundll32
  - mshta
  - certutil
  - bitsadmin
  - lsass
  - schtasks
sources:
  - "MITRE ATT&CK — Initial Access / Execution / Persistence"
triggers:
  - "Unknown process or LOLBAS execution in the investigation window"
  - "Credential dumping or persistence artifacts"
  - "Outbound C2-like connections"
phases:
  - phase: "Identify"
    steps:
      - "Review Prefetch / AmCache / EVTX for unexpected executables"
      - "Check persistence (Run keys, services, scheduled tasks) via RECmd"
  - phase: "Record"
    steps:
      - "Record finding with audit_ids. Do not force an APT name."
caveats:
  - "This is a catch-all playbook — prefer the specific playbooks (suspicious_execution, credential_access, remote_access) when the artifact family is known."
  - "SIEM/EDR exports are INGEST evidence (another system's view), not direct host acquisition — cite them as corroboration, not primary host artifacts."
  - "Cobalt Strike 'beacon' hits in host CSVs can be false positives on the literal word — require process/network context before claiming C2."
  - "Do not force an APT/threat-actor name onto findings — describe the behavior and let the examiner attribute."
