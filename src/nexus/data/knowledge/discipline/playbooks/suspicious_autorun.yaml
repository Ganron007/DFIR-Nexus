name: "Suspicious Autorun Investigation"
description: "Investigate unexpected persistence mechanisms including registry autoruns, services, and scheduled tasks"
mitre: ["T1547", "T1053", "T1543"]
query_terms:
  - currentversion\\run
  - runonce
  - schtasks
  - winlogon
  - userinit
  - image file execution
  - wmi event
  - "4698"
  - "106"
  - "141"
  - "100"
  - "102"
  - "7045"
  - "4697"
  - active time
  - taskcache
sources:
  - "13Cubed — Investigating Windows Endpoints (Services and Scheduled Tasks; USB Forensics/ASEPs; Windows Registry Cheat Sheet)"
  - "SANS FOR508 — Windows Enterprise Incident Response"
  - "MITRE ATT&CK T1547 — Boot or Logon Autostart Execution"
  - "MITRE ATT&CK T1053 — Scheduled Task/Job"
  - "MITRE ATT&CK T1543 — Create or Modify System Process"
triggers:
  - "Unknown entry in Run/RunOnce registry keys"
  - "New service installed (Event ID 7045)"
  - "New or modified scheduled task"
  - "WMI event subscription detected"
  - "Suspicious BITS job persistence"
  - "ASEP entry pointing outside Program Files / Windows (Temp, AppData, ProgramData, Public)"
phases:
  - phase: "Identify"
    steps:
      - "Parse registry for Run keys, services, and WMI subscriptions using RECmd (via run_command / run_windows_command)"
      - "Check scheduled tasks output using EvtxECmd (via run_command / run_windows_command) for task creation events"
      - "Run autorunsc (via run_windows_command) for comprehensive persistence enumeration if available"
  - phase: "Validate"
    steps:
      - "Check each persistence entry against baseline (windows-triage: check_autorun, check_service, check_scheduled_task)"
      - "Verify binary paths referenced by persistence entries (windows-triage: check_file)"
      - "Flag entries pointing to unusual paths (Temp, AppData, Recycle Bin, ProgramData)"
  - phase: "Analyze Binary"
    steps:
      - "Check binary digital signatures using sigcheck (via run_windows_command)"
      - "Check binary entropy using densityscout (via run_windows_command)"
      - "Check binary hash against threat intelligence (opencti: lookup_hash)"
      - "Submit suspicious binaries for static analysis (remnux: analyze_file)"
  - phase: "Timeline"
    steps:
      - "Determine when persistence was created — registry key timestamps, service install time, task creation time"
      - "Correlate persistence creation time with other activity using MFTECmd (via run_command / run_windows_command)"
      - "Check USN Journal for file operations around persistence creation time"
  - phase: "Record"
    steps:
      - "Record finding including persistence mechanism type, binary details, and creation timeline"
      - "Include all evidence IDs from analysis phases"
caveats:
  - "Run/RunOnce under HKCU affect ONLY that user (NTUSER.DAT); under HKLM they affect ALL users (SOFTWARE hive). Run fires every logon; RunOnce fires once at next logon."
  - "There are 100+ ASEPs on Windows — Run keys are the most ubiquitous and STILL heavily used by threat actors precisely because they work; never skip them as 'too obvious'."
  - "Scheduled task events live in Microsoft-Windows-TaskScheduler/Operational: 106 = task registered, 141 = task deleted, 100 = task started, 102 = task completed. Security 4698 (task created) requires audit policy."
  - "Service creation: System 7045 always fires; Security 4697 requires audit policy — 7045 is the more reliable source."
  - "TaskScheduler 100/102 pairs give actual execution times of a task — use them to prove the persistence RAN, not just exists."
  - "Registry last-write time is the only registry timestamp — it proves 'no earlier than' for key creation and 'no later than' for last modification."
