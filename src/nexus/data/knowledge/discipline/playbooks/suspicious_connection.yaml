name: "Suspicious Network Connection Investigation"
description: "Investigate anomalous network connections including beaconing, unusual ports, and known-bad destinations"
mitre: ["T1071", "T1573"]
query_terms:
  - beacon
  - netscan
  - rita
  - zeek
  - conn.log
  - suricata
  - http
  - tls
sources:
  - "13Cubed — Investigating Windows Endpoints (Windows Event Log Cheat Sheet: Sysmon Event ID 3)"
  - "SANS FOR572 — Advanced Network Forensics"
  - "MITRE ATT&CK T1071 — Application Layer Protocol"
  - "MITRE ATT&CK T1573 — Encrypted Channel"
triggers:
  - "Regular beaconing pattern detected in network traffic"
  - "Outbound connections on unusual ports"
  - "Connections to known-bad IP addresses or domains"
  - "High-volume data transfer to external destination"
  - "Long-duration connections inconsistent with normal traffic"
phases:
  - phase: "Identify"
    steps:
      - "Analyze PCAP or Zeek logs using tshark or zeek (via run_command)"
      - "Check conversation statistics for beaconing patterns — regular intervals, consistent payload sizes"
      - "Identify top talkers and unusual protocol usage"
  - phase: "Threat Intel"
    steps:
      - "Check destination IPs and domains against threat intelligence (opencti: lookup_ioc)"
      - "Search for C2 communication patterns and known malware profiles (forensic-rag: search)"
  - phase: "Process Mapping"
    steps:
      - "If process data available, identify which process made the connection using Volatility3 netscan (via run_command)"
      - "Check Sysmon Event ID 3 for network connection events with process context"
      - "Verify processes against baseline (windows-triage: check_process_tree)"
  - phase: "Payload"
    steps:
      - "Extract HTTP objects from PCAP using tshark --export-objects (via run_command)"
      - "Check DNS queries for tunneling indicators — long labels, high query volume, TXT records"
      - "Analyze extracted payloads for malicious content (remnux: analyze_file)"
  - phase: "Record"
    steps:
      - "Record finding including network indicators, process context, and threat intelligence results"
      - "Include all evidence IDs from each analysis phase"
caveats:
  - "Sysmon Event ID 3 gives process → destination IP/port with the initiating process — the single best endpoint-side network artifact; network logs alone cannot attribute to a process."
  - "Volatility netscan only reflects connections alive (or in freed memory) at capture time — absence in netscan is not absence of activity. Vol3 has TWO plugins: Windows.NetScan (pool scan, finds aged-out connections, more results) vs Windows.NetStat (active structures, fewer); Vol2 netscan is deprecated and misses connections on modern Win10/11."
  - "Beaconing analysis needs at least 10-20 connections to establish periodicity; a single connection to a known-bad IP is still a finding, just not a beacon."
  - "TLS-encrypted channels hide payload content — judge by destination reputation, JA3/SNI, and timing, not content."
  - "Zeek conn.log durations and byte counts are the primary beacon evidence; RITA automates beacon scoring over Zeek logs: 'rita show-beacons', 'rita show-beacons-fqdn <db> -H', 'rita show-exploded-dns <db> -H', 'rita html-report'."
  - "Suricata: config /etc/suricata/suricata.yaml (test with -T); logs at /var/log/suricata (fast.log alerts, eve.json structured, stats.log); custom rules in /var/lib/suricata/rules/local.rules; reload with kill -USR2 $(pidof suricata)."
  - "OS fingerprinting from TTL: Windows ~128, Linux/Mac ~64, some Unix 255; TCP window size hints (Linux 2920-5840, Mac 65535) — use for initial OS attribution only, TTL can be rewritten."
  - "Elastic/Packetbeat exfil hunting: agent.type:'packetbeat' AND type:dns AND NOT dns.response_code:'NOERROR' — NXDOMAIN bursts and randomized subdomains are exfil signals (CCD Module 8)."
