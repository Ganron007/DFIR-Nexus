    title: Rogue Nationalism
    article: AR1
    stage: Motive
    description: A subject, driven by excessive pride in their nation, country, or region, undertakes
      actions that harm an organization. These actions are self-initiated and conducted unilaterally,
      without instruction or influence from legitimate authorities within their nation, country, region,
      or any other third party. The subject often perceives their actions as acts of loyalty or as benefiting
      their homeland. While the subject may believe they are acting in their nation’s best interest, their
      actions frequently lack strategic foresight and can result in significant damage to the organization.
