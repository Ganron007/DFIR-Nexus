objectives:
- id: OB0001
  name: Anti-Behavioral Analysis
  description: Behaviors that prevent, obstruct, or evade behavioral analysis of malware--for example, analysis done using
    a sandbox or debugger. Because the underlying methods differ, separate "detection" and "evasion" behaviors are defined
    for some anti-behavioral analysis areas.
  micro: false
- id: OB0002
  name: Anti-Static Analysis
  description: Behaviors and code characteristics that prevent or hinder static analysis of the malware. Simple static analysis
    identifies features such as embedded strings, header information, or file metadata. More involved static analysis involves
    the disassembly of the binary code.
  micro: false
- id: OB0003
  name: Collection
  description: Behaviors that enable malware to identify and gather information, such as sensitive files, from a machine or
    network. Sources often targeted include drives, browsers, audio/video, and email. Often the malware's next objective is
    to exfiltrate the information gathered.
  micro: false
- id: OB0004
  name: Command and Control
  description: Behaviors that enable malware to communicate with systems such as C2 servers or bots. Malware can establish
    command and control with various levels of covertness, depending on system configuration and network topology.
  micro: false
- id: OB0005
  name: Credential Access
  description: Behaviors to obtain credential access, allowing it or its underlying threat actor to assume control of an account
    with the associated system and network permissions.
  micro: false
- id: OB0006
  name: Defense Evasion
  description: Behaviors that enable malware to evade detection.
  micro: false
- id: OB0007
  name: Discovery
  description: Behaviors that enable malware to gain knowledge about the system and network.
  micro: false
- id: OB0008
  name: Impact
  description: Behaviors that enable malware to manipulate, interrupt, or destroy systems and data.
  micro: false
- id: OB0009
  name: Execution
  description: Behaviors that enable malware to execute code on a system to achieve a variety of goals.
  micro: false
- id: OB0010
  name: Exfiltration
  description: Behaviors that enable malware to steal data from a system. This includes stored data, such as files, as well
    as data input into applications, such as web browsers.
  micro: false
- id: OB0011
  name: Lateral Movement
  description: Behaviors that enable malware to propagate or otherwise move through an environment. Lateral movement may be
    active, happening via direct machine access, or may be passive (for example, done via malicious email).
  micro: false
- id: OB0012
  name: Persistence
  description: Behaviors that enable malware to remain on a system regardless of system events, such as reboots.
  micro: false
- id: OB0013
  name: Privilege Escalation
  description: Behaviors that enable malware to obtain higher level permissions. These behaviors often overlap with Persistence
    behaviors.
  micro: false
- id: OC0001
  name: File System
  description: Micro-behaviors related to file manipulation.
  micro: true
- id: OC0002
  name: Memory
  description: Micro-behaviors related to malware manipulating machine memory.
  micro: true
- id: OC0003
  name: Process
  description: Micro-behaviors related to processes.
  micro: true
- id: OC0004
  name: Data
  description: Micro-behaviors related to malware manipulating data.
  micro: true
- id: OC0005
  name: Cryptography
  description: Micro-behaviors that enable malware to use crypto.
  micro: true
- id: OC0006
  name: Communication
  description: Micro-behaviors that enable malware to communicate.
  micro: true
- id: OC0007
  name: Hardware
  description: Micro-behaviors related to hardware.
  micro: true
- id: OC0008
  name: Operating System
  description: Micro-behaviors related to operating systems.
  micro: true
