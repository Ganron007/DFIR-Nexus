- id: B0001.002
  name: CheckRemoteDebuggerPresent
  description: The kernel32!CheckRemoteDebuggerPresent function calls NtQueryInformationProcess with ProcessInformationClass
    parameter set to 7 (ProcessDebugPort constant).This method is related to Unprotect technique U0121.
  behavior: B0001
- id: B0001.003
  name: CloseHandle
  description: (NtClose); If an invalid handle is passed to the CloseHandle function and a debugger is present, then an EXCEPTION_INVALID_HANDLE
    (0xC0000008) exception will be raised. [7] This method is related to Unprotect technique U0114.
  behavior: B0001
- id: B0001.004
  name: Debugger Artifacts
  description: Malware may detect a debugger by its artifact (window title, device driver, exports, etc.).
  behavior: B0001
- id: B0001.005
  name: Hardware Breakpoints
  description: (SEH/GetThreadContext); Debug registers will indicate the presence of a debugger. See [7] for details. This
    method is related to Unprotect technique U0127.
  behavior: B0001
- id: B0001.006
  name: Interruption
  description: If an interruption is mishandled by the debugger, it can cause a single-byte instruction to be inadvertently
    skipped, which can be detected by malware. Examples include Interrupt 0x2d and Interrupt 1 [7]. This method is related
    to Unprotect
  behavior: B0001
- id: B0001.008
  name: IsDebuggerPresent
  description: 'The kernel32!IsDebuggerPresent API function call checks the PEB BeingDebugged flag to see if the calling process
    is being debugged. It returns 1 if the process is being debugged, 0 otherwise. This is one of the most common ways of
    debugger '
  behavior: B0001
- id: B0001.009
  name: Memory Breakpoints
  description: (PAGE_GUARD); Guard pages trigger an exception the first time they are accessed and can be used to detect a
    debugger. See [7] for details. This method is related to Unprotect technique U0102.
  behavior: B0001
- id: B0001.010
  name: Memory Write Watching
  description: '[7]'
  behavior: B0001
- id: B0001.011
  name: Monitoring Thread
  description: Malware may spawn a monitoring thread to detect tampering, breakpoints, etc.
  behavior: B0001
- id: B0001.012
  name: NtQueryInformationProcess
  description: Calling NtQueryInformationProcess with its ProcessInformationClass parameter set to 0x07 (ProcessDebugPort
    constant) will cause the system to set ProcessInformation to -1 if the process is being debugged. Calling with ProcessInformationClas
  behavior: B0001
- id: B0001.013
  name: NtQueryObject
  description: The ObjectTypeInformation and ObjectAllTypesInformation flags are checked for debugger detection. This method
    is related to Unprotect technique U0118.
  behavior: B0001
- id: B0001.014
  name: NtSetInformationThread
  description: Calling this API with a fake class length or thread handle can indicate whether it is hooked. After calling
    NtSetInformationThread properly, the HideThreadFromDebugger flag is checked with the NtQueryInformationThread API. [7]This
    method is
  behavior: B0001
- id: B0001.015
  name: NtYieldExecution/SwitchToThread
  description: '[7]'
  behavior: B0001
- id: B0001.016
  name: OutputDebugString
  description: (GetLastError); The OutputDebugString function will demonstrate different behavior depending whether or not
    a debugger is present. See [7] for details. This method is related to Unprotect technique U0117.
  behavior: B0001
- id: B0001.017
  name: Page Exception Breakpoint Detection
  description: '[7]'
  behavior: B0001
- id: B0001.018
  name: Parent Process
  description: (Explorer.exe); Executing an application by a debugger will result in the parent process being the debugger
    process rather than the shell process (Explorer.exe) or the command line. Malware checks its parent process; if it's not
    explorer.ex
  behavior: B0001
- id: B0001.019
  name: Process Environment Block
  description: The Process Environment Block (PEB) is a Windows data structure associated with each process that contains
    several fields, such as "BeingDebugged," "NtGlobalFlag," and "IsDebugged". Testing the value of this PEB field of a particular
    proces
  behavior: B0001
- id: B0001.020
  name: Process Jobs
  description: '[7]'
  behavior: B0001
- id: B0001.021
  name: ProcessHeap
  description: Process heaps are affected by debuggers. Malware can detect a debugger by checking heap header fields such
    as Flags (debugger present if value greater than 2) or ForceFlags (debugger present if value greater than 0).This method
    is related t
  behavior: B0001
- id: B0001.022
  name: RtlAdjustPrivilege
  description: Malware may call RtlAdjustPrivilege to detect if a debugger is attached (or to prevent a debugger from attaching).
  behavior: B0001
- id: B0001.023
  name: SeDebugPrivilege
  description: (Csrss.exe); Using the OpenProcess function on the csrss.exe process can detect a debugger. [7]
  behavior: B0001
- id: B0001.024
  name: SetHandleInformation
  description: (Protected Handle)
  behavior: B0001
- id: B0001.025
  name: Software Breakpoints
  description: (INT3/0xCC) This method is related to Unprotect technique U0105.
  behavior: B0001
- id: B0001.026
  name: Stack Canary
  description: Similar to the anti-exploitation method of the same name, malware may try to detect mucking with values on
    the stack.
  behavior: B0001
- id: B0001.027
  name: TIB Aware
  description: Malware may access information in the Thread Information Block (TIB) for debug detection or process obfuscation
    detection. The TIB can be accessed as an offset of the segment register (e.g., fs:[20h]).
  behavior: B0001
- id: B0001.028
  name: Timing/Delay Check
  description: Malware may compare time between two points to detect unusual execution, such as the (relative) massive delays
    introduced by debugging. This method is related to Unprotect techniques U110 and U1308.
  behavior: B0001
- id: B0001.029
  name: TLS Callbacks
  description: '[7]'
  behavior: B0001
- id: B0001.030
  name: UnhandledExceptionFilter
  description: The UnhandledExceptionFilter function is called if no registered exception handlers exist, but it will not
