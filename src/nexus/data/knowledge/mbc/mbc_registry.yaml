  behavior: B0001
- id: B0001.031
  name: WudfIsAnyDebuggerPresent
  description: Includes use of WudfIsAnyDebuggerPresent, WudfIsKernelDebuggerPresent, WudfIsUserDebuggerPresent.
  behavior: B0001
- id: B0001.032
  name: Timing/Delay Check GetTickCount
  description: Malware uses GetTickCount function in a timing/delay check. This method is related to Unprotect technique U0125.
  behavior: B0001
- id: B0001.033
  name: Timing/Delay Check QueryPerformanceCounter
  description: Malware uses QueryPerformanceCounter in a timing/delay check. This method is related to Unprotect techniques
    U110 and U1309.
  behavior: B0001
- id: B0001.034
  name: Anti-debugging Instructions
  description: Malware code contains mnemonics related to anti-debugging (e.g., rdtsc, icebp).
  behavior: B0001
- id: B0001.035
  name: Process Environment Block BeingDebugged
  description: The BeingDebugged field is tested to determine whether the process is being debugged.
  behavior: B0001
- id: B0001.036
  name: Process Environment Block NtGlobalFlag
  description: The NtGlobalFlag field is tested to determine whether the process is being debugged. This method is related
    to Unprotect technique U0111.
  behavior: B0001
- id: B0001.037
  name: Process Environment Block IsDebugged
  description: The IsDebugged field is tested to determine whether the process is being debugged.
  behavior: B0001
- id: B0001.038
  name: Check Processes
  description: The malware may check running processes for specific strings such as "malw" to detect a analysis environment.
  behavior: B0001
- id: B0002.001
  name: Block Interrupts
  description: Block interrupt (via hooking) 1 and/or 3 to prevent debuggers from working.
  behavior: B0002
- id: B0002.002
  name: Break Point Clearing
  description: Intentionally clearing software or hardware breakpoints.
  behavior: B0002
- id: B0002.003
  name: Byte Stealing
  description: Move or copy the first bytes / instructions of the original code elsewhere. AKA stolen bytes or code splicing.
    For example, a packer may incorporate the first few instructions of the original EntryPoint (EP) into its unpacking stub
    before t
  behavior: B0002
- id: B0002.004
  name: Change SizeOfImage
  description: Changing this value during run time can prevent some debuggers from attaching and also confuses some unpackers
    and dumpers.
  behavior: B0002
- id: B0002.005
  name: Code Integrity Check
  description: 'Check that the unpacking code is unmodified. Variation exists where unpacking code is part of the "key" used
    to unpack, therefore any Software Breakpoints during debugging causes unpacking to completely fail or result in malformed
    unpacked '
  behavior: B0002
- id: B0002.006
  name: Exception Misdirection
  description: Using exception handling (SEH) to cause flow of program to non-obvious paths.
  behavior: B0002
- id: B0002.007
  name: Get Base Indirectly
  description: CALL to a POP; finds base of code or data, often the packed version of the code; also used often in obfuscated/packed
    shellcode.
  behavior: B0002
- id: B0002.008
  name: Guard Pages
  description: Encrypt blocks of code individually and decrypt temporarily only upon execution. This method is related to
    Unprotect technique U0102.
  behavior: B0002
- id: B0002.009
  name: Hook Interrupt
  description: Modification of interrupt vector or descriptor tables.
  behavior: B0002
- id: B0002.010
  name: Import Obfuscation
  description: Add obfuscation between imports calls and APIs.
  behavior: B0002
- id: B0002.011
  name: Inlining
  description: Variation of static linking where full API code inserted everywhere it would have been called.
  behavior: B0002
- id: B0002.012
  name: Loop Escapes
  description: Use SEH or other methods to break out of a loop instead of a conditional jump.
  behavior: B0002
- id: B0002.013
  name: Malloc Use
  description: 'Instead of unpacking into a pre-defined section/segment (ex: .text) of the binary, use malloc() / VirtualAlloc()
    to create a new segment. This makes keeping track of memory locations across different runs more difficult, as there is
    no guar'
  behavior: B0002
- id: B0002.014
  name: Modify PE Header
  description: Any part of the header is changed or erased.
  behavior: B0002
- id: B0002.015
  name: Nanomites
  description: int3 with code replacement table; debugs itself.
  behavior: B0002
- id: B0002.016
  name: Obfuscate Library Use
  description: LoadLibrary API calls or direct access of kernel32 via PEB (fs[0]) pointers, used to rebuild IAT or just obfuscate
    library use.
  behavior: B0002
- id: B0002.017
  name: Parallel Threads
  description: Use several parallel threads to make analysis harder.
  behavior: B0002
- id: B0002.018
  name: Pipeline Misdirection
  description: Take advantage of pipelining in modern processors to misdirect debugging, emulation, or static analysis tools.
    An unpacker can assume a certain number of opcodes will be cached and then proceed to overwrite them in memory, causing
    a debugge
  behavior: B0002
- id: B0002.019
  name: Pre-Debug
  description: Prevents debugger from attaching to process or to break until after the code of interest has been executed.
  behavior: B0002
- id: B0002.020
  name: Relocate API Code
  description: Relocate API code in separate buffer (calls don’t lead to imported DLLs).
  behavior: B0002
- id: B0002.021
  name: Return Obfuscation
  description: Overwrite the RET address on the stack or the code at the RET address. Variation seen that writes to the start-up
    code or main module that called the malware's WinMain or DllMain.
  behavior: B0002
- id: B0002.022
  name: RtlAdjustPrivilege
  description: Calling RtlAdjustPrivilege to either prevent a debugger from attaching or to detect if a debugger is attached.
  behavior: B0002
- id: B0002.023
  name: Section Misalignment
  description: Some analysis tools cannot handle binaries with misaligned sections.
  behavior: B0002
- id: B0002.024
  name: Self-Debugging
  description: Debug itself to prevent another debugger to be attached.
  behavior: B0002
- id: B0002.025
  name: Self-Unmapping
  description: UnmapViewOfFile() on itself.
  behavior: B0002
- id: B0002.026
  name: Static Linking
  description: Copy locally the whole content of API code.
  behavior: B0002
- id: B0002.027
  name: Stolen API Code
  description: A variation of "byte stealing" where the first few instructions or bytes of an API are executed in user code,
    allowing the IAT to point into the middle of an API function. This confuses IAT rebuilders such as ImpRec and Scylla and
    may bypas
  behavior: B0002
- id: B0002.028
  name: Tampering
  description: Erase or corrupt specific file parts to prevent rebuilding (header, packer stub, etc.).
  behavior: B0002
- id: B0002.029
  name: Thread Timeout
  description: Setting dwMilliseconds in WaitForSingleObject to a small number will timeout the thread before the analyst
    can step through and analyze the code executing in the thread. Modifying this via patch, register, or stack to the value
    `0xFFFFFFFF`
  behavior: B0002
- id: B0002.030
  name: Use Interrupts
  description: The unpacking code relies on use of int 1 or int 3, or it uses the interrupt vector table as part of the decryption
    "key".
  behavior: B0002
- id: B0003.001
  name: Alternative ntdll.dll
  description: A copy of ntdll.dll is dropped to the filesystem and then loaded. This alternative DLL is used to execute function
    calls to evade sandboxes which use hooking in the operating system's ntdll.dll.
  behavior: B0003
- id: B0003.002
  name: Data Flood
  description: Overloads a sandbox by generating a flood of meaningless behavioral data. [1]
  behavior: B0003
- id: B0003.003
  name: Delayed Execution
  description: Stalling code is typically executed before any malicious behavior. The malware's aim is to delay the execution
    of the malicious activity long enough so that an automated dynamic analysis system fails to extract the interesting malicious
    beh
  behavior: B0003
- id: B0003.004
  name: Demo Mode
  description: Inclusion of a demo binary/mode that is executed when token is absent or not privileged enough.
  behavior: B0003
- id: B0003.005
  name: Drop Code
  description: Original file is written to disk then executed. May confuse some sandboxes, especially if the dropped executable
    must be provided specific arguments and the original dropper is not associated with the drop file(s).
  behavior: B0003
- id: B0003.006
  name: Encode File
  description: Encode a file on disk, such as an implant's config file.
  behavior: B0003
- id: B0003.007
  name: Hook File System
  description: Execution happens when a particular file or directory is accessed, often through hooking certain API calls
    such as CreateFileA and CreateFileW.
  behavior: B0003
- id: B0003.008
  name: Hook Interrupt
  description: Modification of interrupt vector or descriptor tables.
  behavior: B0003
- id: B0003.009
  name: Illusion
  description: Creates an illusion; makes the analyst think something happened when it didn't.
  behavior: B0003
- id: B0003.010
  name: Restart
  description: Restarts or shuts down system to bypass sandboxing.
  behavior: B0003
- id: B0003.011
  name: Code Integrity Check
  description: Compares memory-based and disk-based versions of itself. If differences are detected, the malware alters its
    execution, possibly acting destructively.
  behavior: B0003
- id: B0003.012
  name: API Hammering
  description: Uses of a huge number of calls to Windows APIs as a form of extended sleep to evade analysis in sandbox environments.
    This method is related to Unprotect technique U1305.
  behavior: B0003
- id: B0004.001
  name: Check for Emulator-related Files
  description: Checks whether particular files (e.g., QEMU files) exist.
  behavior: B0004
- id: B0004.002
  name: Check for WINE Version
  description: Checks for WINE via the `get_wine_version` function from WINE's `ntdll.dll`.
  behavior: B0004
- id: B0004.003
  name: Check Emulator-related Registry Keys
  description: 'Emulators register artifacts in the registry, which can be detected by malware. For example, installation
    of QEMU results in the registry key: *HARDWARE\DEVICEMAP\Scsi\Scsi Port 0\Scsi Bus 0\Target Id 0\Logical Unit Id 0* with
    value=*Identi'
  behavior: B0004
- id: B0004.004
  name: Failed Network Connections
  description: Some emulated systems fail to handle some network communications; such failures will indicate the emulated
    environment.
  behavior: B0004
- id: B0005.001
  name: Different Opcode Sets
  description: 'Use different opcodes sets (ex: FPU, MMX, SSE) to block emulators.'
  behavior: B0005
- id: B0005.002
  name: Undocumented/Unimplemented Opcodes
  description: Use rare, undocumented, or unimplemented opcodes to block non-exhaustive emulators.
  behavior: B0005
- id: B0005.003
  name: Unusual/Undocumented API Calls
  description: Call unusual APIs to block non-exhaustive emulators (particularly anti-virus).
  behavior: B0005
- id: B0005.004
  name: Extra Loops/Time Locks
  description: Add extra loops to make time-constraint emulators give up.
  behavior: B0005
- id: B0006.001
  name: Code Encryption in Memory
  description: Encrypt the executing malware instance code in memory.
  behavior: B0006
- id: B0006.002
  name: Erase the PE header
  description: Erase PE header from memory.
  behavior: B0006
- id: B0006.003
  name: Hide virtual memory
  description: Hide arbitrary segments of virtual memory.
  behavior: B0006
- id: B0006.004
  name: SizeOfImage
  description: Set the SizeOfImage field of PEB.LoaderData to be huge.
  behavior: B0006
- id: B0006.005
  name: Tampering
  description: Erase or corrupt specific file parts to prevent rebuilding (header, packer stub, etc.).
  behavior: B0006
- id: B0006.006
  name: Guard Pages
  description: Encrypt blocks of code individually and decrypt temporarily only upon execution. This method is related to
    Unprotect technique U0102.
  behavior: B0006
- id: B0006.007
  name: On-the-Fly APIs
  description: Resolve API addresses before each use to prevent complete dumping.
  behavior: B0006
- id: B0006.008
  name: Feed Misinformation
  description: API behavior can be altered to prevent memory dumps. For example, inaccurate data can be reported when the
    contents of the physical memory of the system on which the malware instance is executing is retrieved. See [Hijack Execution
    Flow](..
  behavior: B0006
- id: B0006.009
  name: Flow Opcode Obstruction
  description: Flow opcodes (e.g., jumps, loops) are removed and emulated (or decrypted) by the packer during execution, resulting
    in incorrect dumps. [6].
  behavior: B0006
- id: B0006.010
  name: Hook memory mapping APIs
  description: Hooking prevents memory dumps by preventing mapping of memory into the kernel's virtual address space. [1]
  behavior: B0006
- id: B0006.011
  name: Patch MmGetPhysicalMemoryRanges
  description: Patching this function to always return NULL prevents drivers from getting information about the physical address
    space layout, preventing memory dumps. [1]
  behavior: B0006
- id: B0007.001
  name: Check Clipboard Data
  description: Checks clipboard data which can be used to detect whether execution is inside a sandbox.
  behavior: B0007
- id: B0007.002
  name: Check Files
  description: Sandboxes create files on the file system. Malware can check the different folders to find sandbox artifacts.
  behavior: B0007
- id: B0007.003
  name: Human User Check
  description: 'Detects whether there is any "user" activity on the machine, such as the movement of the mouse cursor, non-default
    wallpaper, or recently opened Office files. Directories or file might be counted. If there is no human activity, the machine '
  behavior: B0007
- id: B0007.004
  name: Injected DLL Testing
  description: Testing for the name of a particular DLL that is known to be injected by a sandbox for API hooking is a common
    way of detecting sandbox environments. This can be achieved through the kernel32!GetModuleHandle API call and other means.
  behavior: B0007
- id: B0007.005
  name: Product Key/ID Testing
  description: Checking for a particular product key/ID associated with a sandbox environment (commonly associated with the
    Windows host OS used in the environment) can be used to detect whether a malware instance is being executed in a particular
    sandbox
  behavior: B0007
- id: B0007.006
  name: Screen Resolution Testing
  description: Sandboxes aren't used in the same manner as a typical user environment, so most of the time the screen resolution
    stays at the minimum 800x600 or lower. No one is actually working on a such small screen. Malware could potentially detect
    the
  behavior: B0007
- id: B0007.007
  name: Self Check
  description: Malware may check its own characteristics to determine whether it's running in a sandbox. For example, a malicious
    Office document might check its file name or VB project name. This method is related to Unprotect technique U1303.
  behavior: B0007
- id: B0007.008
  name: Timing/Date Check
  description: Calling GetSystemTime or equiv and only executing code if the current date/hour/minute/second passes some check.
    Often this is for running only after or only until a specific date. This behavior can be mitigated in non-automated analysis
    en
  behavior: B0007
- id: B0007.009
  name: Timing/Uptime Check
  description: Comparing single GetTickCount with some value to see if system has been started at least *X* amount ago. This
    behavior can be mitigated in non-automated analysis environments.
  behavior: B0007
- id: B0007.010
  name: Test API Routines
  description: Calls Windows API routines with invalid arguments to identify error supression.
  behavior: B0007
