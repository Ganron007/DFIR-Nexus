# WO-KR2: behavioural analytics — stored ES query JSON over registry fields.
#
# Why this exists: `sigma_needles.yaml` and the other needle packs are keyword
# digests, and `sources/sigma_rules.yaml` is metadata only - the real Sigma runs
# inside Hayabusa and Chainsaw, in the lane. That leaves the families the rule
# engines do NOT cover (prefetch, Amcache, tasks, services, Run keys, MFT,
# Sysmon/4688) with no detection logic at all, only strings.
#
# Each analytic is an `es:` query against the field registry (see
# `data/schema/field_registry.yaml`), and **cites its source**: a CAR analytic id
# we already hold in `needles/car_analytics.yaml`, or an ATT&CK technique. An
# analytic without a citation is a guess, and guesses do not belong in a pack an
# examiner will be asked to trust.
#
# Every entry must pass `validate_stored_query` and reference fields that exist. Both are
# enforced by `nexus.analysis.behavioural_analytics.validate_pack` and pinned by
# tests - a stale field name would make the analytic silently match nothing,
# which reads as "no such behaviour" rather than "broken analytic".
version: 1
description: 'Behavioural analytics for the artifact families the rule engines do not cover. Typed queries over
  registry columns, each citing a CAR analytic or ATT&CK technique, so a lead can travel from a hit back to published
  detection logic.

  '
source: MITRE CAR (car.mitre.org) as held in needles/car_analytics.yaml; ATT&CK Enterprise
packs:
- id: ba-exec-user-writable
  name: Execution from a user-writable path
  families:
  - evtxecmd
  - hayabusa
  citation:
    type: authored
    id: authored:ba-exec-user-writable
    ref: ''
    rationale: 'Authored for this product: expresses T1204.002, T1059 in this pack''s logic. Not derived from an
      external source.'
  techniques:
  - T1204.002
  - T1059
  rationale: User-writable locations are where a downloaded payload lands. The DSL has NO typed-field negation (`not
    path:\Windows` parses as a POSITIVE filter, so it would invert the analytic), so this is deliberately a single
    positive term and the system-tree exclusion is the examiner's next filter.
  search:
    basis:
    - attack:DET0294
    - manifest
    events:
    - channel: Microsoft-Windows-Sysmon/Operational
      codes:
      - '1'
    - channel: Security
      codes:
      - '4688'
    any:
    - field: ecs.process.executable
      contains:
      - \Users\Public\
      - \AppData\Local\Temp\
      - \AppData\Roaming\
      - \Downloads\
      - \Windows\Temp\
      - \PerfLogs\
  es:
    bool:
      filter:
      - bool:
          should:
          - bool:
              filter:
              - term:
                  ecs.winlog.channel:
                    value: Microsoft-Windows-Sysmon/Operational
                    case_insensitive: true
              - terms:
                  event_id:
                  - '1'
          - bool:
              filter:
              - term:
                  ecs.winlog.channel:
                    value: Security
                    case_insensitive: true
              - terms:
                  event_id:
                  - '4688'
          minimum_should_match: 1
      - bool:
          should:
          - wildcard:
              ecs.process.executable.wc:
                value: '*\\Users\\Public\\*'
                case_insensitive: true
          - wildcard:
              ecs.process.executable.wc:
                value: '*\\AppData\\Local\\Temp\\*'
                case_insensitive: true
          - wildcard:
              ecs.process.executable.wc:
                value: '*\\AppData\\Roaming\\*'
                case_insensitive: true
          - wildcard:
              ecs.process.executable.wc:
                value: '*\\Downloads\\*'
                case_insensitive: true
          - wildcard:
              ecs.process.executable.wc:
                value: '*\\Windows\\Temp\\*'
                case_insensitive: true
          - wildcard:
              ecs.process.executable.wc:
                value: '*\\PerfLogs\\*'
                case_insensitive: true
          minimum_should_match: 1
  es_source:
    bool:
      filter:
      - bool:
          should:
          - bool:
              filter:
              - term:
                  ecs.winlog.channel:
                    value: Microsoft-Windows-Sysmon/Operational
                    case_insensitive: true
              - terms:
                  event_id:
                  - '1'
          - bool:
              filter:
              - term:
                  ecs.winlog.channel:
                    value: Security
                    case_insensitive: true
              - terms:
                  event_id:
                  - '4688'
          minimum_should_match: 1
