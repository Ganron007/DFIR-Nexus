            case_insensitive: true
- id: ba-persist-service-temp
  name: Service binary in a user-writable path
  families:
  - registry
  - recmd
  - evtxecmd
  - hayabusa
  - security
  citation:
    type: car
    id: CAR-2014-02-001
    ref: https://car.mitre.org/analytics/CAR-2014-02-001/
    title: Service Binary Modifications
  techniques:
  - T1543.003
  rationale: A service is the strongest persistence on Windows; its ImagePath should
    be a system or Program Files path.
  es:
    bool:
      filter:
      - wildcard:
          ecs.registry.path:
            value: '*Services*'
            case_insensitive: true
      - wildcard:
          ecs.file.path:
            value: '*AppData*'
            case_insensitive: true
