- id: ba-exec-script-host
  name: Script host executing a script
  families:
  - evtxecmd
  - hayabusa
  - security
  - sysmon
  - prefetch
  citation:
    type: authored
    id: authored:ba-exec-script-host
    ref: ''
    rationale: 'Authored for this product: expresses T1059.005, T1218.005 in this
      pack''s logic. Not derived from an external source.'
  techniques:
  - T1059.005
  - T1218.005
  rationale: A script host is normal; a script host pointed at a loose file is the
    interesting shape.
  es:
    bool:
      filter:
      - bool:
          should:
          - term:
              fields.process_name.kw:
                value: wscript.exe
                case_insensitive: true
          - term:
              fields.process_name.kw:
                value: cscript.exe
                case_insensitive: true
          - term:
              fields.process_name.kw:
                value: mshta.exe
                case_insensitive: true
          minimum_should_match: 1
      - wildcard:
          ecs.process.command_line:
            value: '*.js*'
            case_insensitive: true
- id: ba-exec-encoded-command
  name: Encoded or hidden command line
  families:
  - evtxecmd
  - hayabusa
  - security
  - sysmon
  citation:
    type: authored
    id: authored:ba-exec-encoded-command
    ref: ''
    rationale: 'Authored for this product: expresses T1059.001, T1027 in this pack''s
      logic. Not derived from an external source.'
  techniques:
  - T1059.001
  - T1027
  rationale: Encoding exists to defeat string inspection; pair with the decoded text,
    not the flag alone.
  es:
    bool:
      filter:
      - bool:
          should:
          - term:
              ecs.process.command_line:
                value: -enc
                case_insensitive: true
          - term:
              ecs.process.command_line:
                value: -EncodedCommand
                case_insensitive: true
          - term:
              ecs.process.command_line:
                value: -nop
                case_insensitive: true
          - term:
              ecs.process.command_line:
                value: -noprofile
                case_insensitive: true
          minimum_should_match: 1
