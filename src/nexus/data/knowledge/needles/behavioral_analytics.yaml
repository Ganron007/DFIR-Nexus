- id: ba-persist-task-script-host
  name: Scheduled task running a script host or encoded command
  families:
  - tasks
  - evtxecmd
  - hayabusa
  - security
  citation:
    type: car
    id: CAR-2020-09-001
    ref: https://car.mitre.org/analytics/CAR-2020-09-001/
    title: Scheduled Task - FileAccess
  techniques:
  - T1053.005
  - T1059.001
  rationale: A task is the cheapest durable execution; the action it runs is what
    distinguishes it from Windows' own.
  es:
    bool:
      filter:
      - exists:
          field: fields.task_uri.kw
      - bool:
          should:
          - term:
              ecs.process.command_line:
                value: powershell
                case_insensitive: true
          - term:
              ecs.process.command_line:
                value: wscript
                case_insensitive: true
          - term:
              ecs.process.command_line:
                value: cscript
                case_insensitive: true
          - term:
              ecs.process.command_line:
                value: mshta
                case_insensitive: true
          - term:
              ecs.process.command_line:
                value: -enc
                case_insensitive: true
          minimum_should_match: 1
