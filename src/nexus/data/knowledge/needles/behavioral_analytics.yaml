- id: ba-eva-timestomp
  name: File timestamps inconsistent with the directory
  families:
  - mft
  - mftecmd
  - ntfs
  citation:
    type: authored
    id: authored:ba-eva-timestomp
    ref: ''
    rationale: 'Authored for this product: expresses T1070.006 in this pack''s logic.
      Not derived from an external source.'
  techniques:
  - T1070.006
  rationale: A payload older than the directory that contains it was back-dated.
  es:
    bool:
      should:
      - term:
          fields.SI<FN.kw: 'True'
      - term:
          fields.SI<FN.kw: 'true'
      - exists:
          field: fields.LastModified0x10
      - wildcard:
          text.wc:
            value: '*timestomp*'
            case_insensitive: true
      minimum_should_match: 1
  es_authored_reason: the Mode 1 compiler cannot express this against the registry
    (field 'fields.targetmodified.kw' (column 'targetmodified') does not exist for
    declared families ['fls', 'ingest-kape', 'ingest-mft', 'ingest-mftecmd', 'ingest-ntfs',
    'mft', 'mftecmd', 'mftecmd-i30', 'mftecmd-usn', 'ntfs'] (column exists for ['jlecmd',
    'lecmd'])); reviewed and kept by hand
