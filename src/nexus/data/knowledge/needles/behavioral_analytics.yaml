- id: ba-eva-timestomp
  name: Executable with $SI creation earlier than $FN creation
  families:
  - mftecmd
  citation:
    type: authored
    id: authored:ba-eva-timestomp
    ref: ''
    rationale: 'Authored for this product: expresses T1070.006 in this pack''s logic. Not derived from an external
      source.'
  techniques:
  - T1070.006
  rationale: MFTECmd SI<FN means same-record $SI Created0x10 precedes $FN Created0x30. uSecZeros only checks for a
    zero Millisecond component on $SI creation or last-modified time; neither flag proves malicious backdating.
    Treat this analytic as a lead and inspect its source facts and independent chronology.
  source_fact_ids:
  - mftecmd.si_fn
  - mftecmd.usec_zeros
  - mftecmd.copied
  search:
    basis:
    - attack:DET0591
    families:
    - mftecmd
    all:
    - field: fields.SI<FN
      is:
      - 'True'
    - field: fields.uSecZeros
      is:
      - 'True'
    - field: ecs.file.extension
      is:
      - exe
      - dll
      - sys
      - ps1
      - bat
      - vbs
      - js
      - scr
      - hta
    none:
    - field: ecs.file.path
      contains:
      - \Windows\WinSxS\
      - \Windows\servicing\
      - \Windows\SoftwareDistribution\
  es:
    bool:
      filter:
      - terms:
          family:
          - mftecmd
      - term:
          fields.SI<FN.kw:
            value: 'True'
            case_insensitive: true
      - term:
          fields.uSecZeros.kw:
            value: 'True'
            case_insensitive: true
      - bool:
          should:
          - term:
              ecs.file.extension:
                value: exe
                case_insensitive: true
          - term:
              ecs.file.extension:
                value: dll
                case_insensitive: true
          - term:
              ecs.file.extension:
                value: sys
                case_insensitive: true
          - term:
              ecs.file.extension:
                value: ps1
                case_insensitive: true
          - term:
              ecs.file.extension:
                value: bat
                case_insensitive: true
          - term:
              ecs.file.extension:
                value: vbs
                case_insensitive: true
          - term:
              ecs.file.extension:
                value: js
                case_insensitive: true
          - term:
              ecs.file.extension:
                value: scr
                case_insensitive: true
          - term:
              ecs.file.extension:
                value: hta
                case_insensitive: true
          minimum_should_match: 1
      must_not:
      - bool:
          should:
          - wildcard:
              ecs.file.path.wc:
                value: '*\\Windows\\WinSxS\\*'
                case_insensitive: true
          - wildcard:
              ecs.file.path.wc:
                value: '*\\Windows\\servicing\\*'
                case_insensitive: true
          - wildcard:
              ecs.file.path.wc:
                value: '*\\Windows\\SoftwareDistribution\\*'
                case_insensitive: true
          minimum_should_match: 1
  es_source:
    bool:
      filter:
      - terms:
          family:
          - mftecmd
