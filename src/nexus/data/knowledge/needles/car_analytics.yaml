  data_model:
  - process/create/exe
  - process/create/parent_exe
  description: The Windows [Command Prompt](https://en.wikipedia.org/wiki/cmd.exe) (`cmd.exe`) is a utility that provides a command line interface to Windows operating systems. It provides the ability to run additional programs and also has several built-in commands such as `dir`, `copy`, `mkdir`, and `type`, as well as batch scripts (`.bat`). Typically, when a user runs a command prompt, the parent process is `explorer.exe` or another instance of the prompt. There may be automated programs, logon scripts, or administrative tools that launch instances of the command prompt in order to run scripts or other built-in commands. Spawning the process `cmd.exe` from certain parents may be more indicative of malice. For example, if Adobe Reader or Outlook launches a command shell, this may suggest that a malicious document has been loaded and should be investigated. Thus, by looking for abnormal parent processes of `cmd.exe`, it may be possible to detect adversaries.
  pseudocode: 'process = search Process:Create

    cmd = filter process where (exe == "cmd.exe")

    output cmd'
  source_key: analytics/CAR-2013-02-003.yaml
- analytic: CAR-2013-02-008
  name: Simultaneous Logins on a Host
  technique: T1078
  techniques:
  - T1078
  - T1078.002
  - T1078.003
  tactics:
  - TA0001
  data_model:
  - user_session/login/user
  - user_session/login/hostname
  description: 'Multiple users logged into a single machine at the same time, or even within the same hour, do not typically occur in networks we have observed.


    Logon events are Windows Event Code 4624 for Windows Vista and above, 518 for pre-Vista. Logoff events are 4634 for Windows Vista and above, 538 for pre-Vista.

    Logon types 2, 3, 9 and 10 are of interest. For more details see the Logon Types table on Microsoft''s [Audit Logon Events](https://docs.microsoft.com/en-us/previous-versions/windows/it-pro/windows-server-2003/cc787567(v=ws.10)) page.'
  pseudocode: 'users_list = search UserSession:Login

    users_grouped = group users_list by hostname

    users_grouped = from users_grouped select min(time) as earliest_time, max(time) as latest_time count(user) as user_count

    multiple_logins = filter users_grouped where (latest_time - earliest_time <= 1 hour and user_count > 1)

    output multiple_logins'
  source_key: analytics/CAR-2013-02-008.yaml
