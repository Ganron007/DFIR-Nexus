# Vendor detection guides — WP 3.27d.
# Detection guidance from security vendors — Microsoft, CrowdStrike,
# SentinelOne, Palo Alto, FireEye. Vendor-specific detection logic and
# field names for needle suggestions.

version: 1
description: >
  Vendor detection guides — detection logic and field names from
  Microsoft, CrowdStrike, SentinelOne, Palo Alto, FireEye, and other
  security vendors. The scribe can suggest needles based on vendor-
  specific detection logic.
source: "Microsoft, CrowdStrike, SentinelOne, Palo Alto, FireEye, Elastic"

vendors:
  # --- Microsoft ---
  - vendor: "Microsoft"
    product: "Microsoft Defender for Endpoint"
    detection_logic:
      - name: "Process creation"
        fields: ["FileName", "ProcessCommandLine", "InitiatingProcessFileName", "InitiatingProcessCommandLine", "InitiatingProcessParentFileName", "AccountName", "AccountDomain", "LogonId"]
        needles: ["powershell.exe", "cmd.exe", "wscript.exe", "cscript.exe", "mshta.exe", "rundll32.exe", "regsvr32.exe", "certutil.exe", "bitsadmin.exe", "wmic.exe", "schtasks.exe", "sc.exe", "net.exe", "netstat.exe", "ipconfig.exe", "route.exe", "arp.exe", "whoami.exe", "systeminfo.exe", "tasklist.exe", "taskkill.exe", "shutdown.exe", "reg.exe", "vssadmin.exe", "bcdedit.exe", "wevtutil.exe", "esentutl.exe", "procdump.exe", "psexec.exe", "winrs.exe", "rclone.exe", "ftp.exe", "curl.exe", "wget.exe"]
        caveats:
          - "Microsoft Defender uses cloud-delivered protection — look for process names + command lines"
      - name: "Network connection"
        fields: ["RemoteIP", "RemotePort", "LocalIP", "LocalPort", "Protocol", "ProcessName", "ProcessId"]
        needles: ["RemoteIP", "RemotePort", "Protocol", "ProcessName"]
        caveats:
          - "Microsoft Defender tracks network connections per process — look for unusual process-to-IP connections"
      - name: "Registry"
        fields: ["RegistryKey", "RegistryValueName", "RegistryValueData", "ProcessName", "ProcessId"]
        needles: ["RegistryKey", "RegistryValueName", "RegistryValueData"]
        caveats:
          - "Microsoft Defender tracks registry modifications — look for Run/RunOnce keys and suspicious values"
      - name: "File"
        fields: ["FileName", "FilePath", "FileSize", "FileHash", "ProcessName", "ProcessId"]
        needles: ["FileName", "FilePath", "FileHash"]
        caveats:
          - "Microsoft Defender tracks file operations — look for suspicious file paths and hashes"

  - vendor: "Microsoft"
    product: "Microsoft Sentinel"
    detection_logic:
      - name: "Analytics rules"
        fields: ["FileName", "ProcessCommandLine", "InitiatingProcessFileName", "InitiatingProcessCommandLine", "AccountName", "AccountDomain", "LogonId", "RemoteIP", "RemotePort", "LocalIP", "LocalPort", "Protocol", "ProcessName", "ProcessId", "RegistryKey", "RegistryValueName", "RegistryValueData", "FileName", "FilePath", "FileSize", "FileHash"]
        needles: ["powershell.exe", "cmd.exe", "wscript.exe", "cscript.exe", "mshta.exe", "rundll32.exe", "regsvr32.exe", "certutil.exe", "bitsadmin.exe", "wmic.exe", "schtasks.exe", "sc.exe", "net.exe", "netstat.exe", "ipconfig.exe", "route.exe", "arp.exe", "whoami.exe", "systeminfo.exe", "tasklist.exe", "taskkill.exe", "shutdown.exe", "reg.exe", "vssadmin.exe", "bcdedit.exe", "wevtutil.exe", "esentutl.exe", "procdump.exe", "psexec.exe", "winrs.exe", "rclone.exe", "ftp.exe", "curl.exe", "wget.exe"]
        caveats:
          - "Microsoft Sentinel uses KQL analytics — look for process names, command lines, and network indicators"

  # --- CrowdStrike ---
  - vendor: "CrowdStrike"
    product: "Falcon"
    detection_logic:
      - name: "Process execution"
        fields: ["ImageFileName", "CommandLine", "ParentImageFileName", "ParentCommandLine", "UserName", "UserSid", "ProcessId", "ProcessGuid"]
        needles: ["powershell.exe", "cmd.exe", "wscript.exe", "cscript.exe", "mshta.exe", "rundll32.exe", "regsvr32.exe", "certutil.exe", "bitsadmin.exe", "wmic.exe", "schtasks.exe", "sc.exe", "net.exe", "netstat.exe", "ipconfig.exe", "route.exe", "arp.exe", "whoami.exe", "systeminfo.exe", "tasklist.exe", "taskkill.exe", "shutdown.exe", "reg.exe", "vssadmin.exe", "bcdedit.exe", "wevtutil.exe", "esentutl.exe", "procdump.exe", "psexec.exe", "winrs.exe", "rclone.exe", "ftp.exe", "curl.exe", "wget.exe"]
        caveats:
          - "CrowdStrike tracks process execution with parent-child relationships — look for unusual parents"
      - name: "Network connection"
        fields: ["RemoteAddressIP4", "RemotePort", "LocalAddressIP4", "LocalPort", "Protocol", "ImageFileName", "ProcessId"]
        needles: ["RemoteAddressIP4", "RemotePort", "Protocol", "ImageFileName"]
        caveats:
          - "CrowdStrike tracks network connections per process — look for unusual process-to-IP connections"
      - name: "Registry"
        fields: ["RegistryPath", "RegistryValueName", "RegistryValueData", "ImageFileName", "ProcessId"]
        needles: ["RegistryPath", "RegistryValueName", "RegistryValueData"]
        caveats:
          - "CrowdStrike tracks registry modifications — look for Run/RunOnce keys and suspicious values"

