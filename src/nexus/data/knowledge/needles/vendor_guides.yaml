        caveats:
          - "SentinelOne tracks process execution with integrity levels — look for low-integrity processes making network connections"
      - name: "Network connection"
        fields: ["DstIp", "DstPort", "SrcIp", "SrcPort", "Protocol", "ProcessName", "ProcessId"]
        needles: ["DstIp", "DstPort", "Protocol", "ProcessName"]
        caveats:
