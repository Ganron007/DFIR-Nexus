caveats:
- This skill is DC-telemetry-dependent — a member-server-only case cannot see 4662/4769;
  note coverage in findings.
- Some monitoring tools and Azure AD Connect legitimately perform replication — whitelist
  known replication service accounts.
- RC4 TGS requests occur in legacy environments — volume + source-account context
  separates attack from noise.
- Golden tickets leave almost no DC-side trace — look for the TGT-lifetime anomaly
  and impossible-travel logons instead.
