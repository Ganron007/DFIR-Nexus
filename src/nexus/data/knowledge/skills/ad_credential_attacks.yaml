# kb: EIR AD lesson (Kerberoast/AS-REP/DCSync/delegation abuse detection)
# kb: d_f9d99a1b61b6 (EIR — domain enumeration command set)
# kb: SANS AD attack poster, FOR508 AD material, BTL1 AD attacks
skill: ad_credential_attacks
title: AD credential attacks — Kerberoast, AS-REP roast, DCSync, delegation
description: >-
  Detect Active Directory credential attacks: Kerberoasting (SPN ticket
  extraction), AS-REP roasting (pre-auth disabled), DCSync replication
  abuse, unconstrained/constrained delegation abuse, and golden/silver
  ticket indicators.
trigger:
  families: [evtx, security, hayabusa, sysmon]
  keywords: [kerberos, kerberoast, asrep, dcsync, spn, ticket, delegation, rubeus, klist, tgt, tgs]
  techniques: [T1558.003, T1558.004, T1003.006, T1558.001, T1558.002]
steps:
  - name: kerberoast_tgs
    query: "4769 RC4 OR 0x17 OR service ticket"
    look_for: >-
      Kerberoasting signature: burst of 4769 TGS requests for service
      accounts (SPNs) with RC4 encryption (ticket type 0x17) — attackers
      request crackable RC4 tickets to brute offline. One account
      requesting many distinct SPNs in a short window is the tell.
    pivot: ServiceName
    corroborate: single account → many SPNs + RC4 downgrade + no corresponding service usage
  - name: asrep_roast
    query: "4768 pre-authentication OR 0x40850210"
    look_for: >-
      AS-REP roasting: 4768 TGT requests succeeding WITHOUT pre-auth for
      accounts with DONT_REQ_PREAUTH — attacker harvested AS-REPs to
      crack offline. Look for the pre-auth type field absent/0 on
      accounts that should require it.
    pivot: TargetUserName
  - name: dcsync_replication
    query: "4662 Replicating OR directory service access"
    look_for: >-
      DCSync: 4662 replication extended-rights access by a non-DC account —
      DS-Replication-Get-Changes-All/Secrets GUIDs. DCs replicate with
      other DCs; anything else requesting replication is hostile.
    pivot: SubjectUserName
    corroborate: followed by 4624 type-3 from the requester's source + mass account-hash usage
  - name: delegation_abuse
    query: "delegation OR trusted for delegation OR unconstrained"
    look_for: >-
      Delegation abuse: unconstrained-delegation hosts capture TGTs of
      connecting users; constrained-delegation (S4U2Self/S4U2Proxy)
      misuse lets a service impersonate. New delegation settings on
      unexpected accounts/computers are the pre-attack staging.
    pivot: TargetUserName
  - name: golden_ticket
    query: "ticket lifetime OR 4768 OR 4769 OR aes"
    look_for: >-
      Golden/silver tickets: TGS requests for accounts with no matching
      4768 TGT (forged tickets skip the AS exchange), anomalous ticket
      lifetimes (>10h default), or encryption-type anomalies vs domain
      baseline.
    corroborate: 4769 without preceding 4768 for the same account
  - name: enum_pre_attack
    query: "net group OR nltest OR dsquery OR setspn"
    look_for: >-
      Pre-attack enumeration feeds the roast: setspn -Q */* (SPN
      discovery = kerberoast target list), net group "Domain Admins"
      /domain, nltest /dclist — recon commands precede the credential
      attack in the same session window.
    pivot: CommandLine
negative: >-
  No anomalous 4768/4769/4662 patterns → AD credential attacks not evident
  in the window. Note: DCSync and golden tickets can be nearly silent on
  endpoints — DC Security log coverage is required for this skill to be
  meaningful.
confidence_rules:
  high: DCSync GUIDs by non-DC account OR RC4 SPN burst + offline-crack context OR ticket without TGT
  medium: anomalous ticket patterns + recon commands in same window
  low: single odd 4769 (service accounts legitimately request tickets)
mitre: [T1558.003, T1558.004, T1003.006, T1558.001, T1558.002]
source:
  - "d_f9d99a1b61b6"
caveats:
  - "This skill is DC-telemetry-dependent — a member-server-only case cannot see 4662/4769; note coverage in findings."
  - "Some monitoring tools and Azure AD Connect legitimately perform replication — whitelist known replication service accounts."
  - "RC4 TGS requests occur in legacy environments — volume + source-account context separates attack from noise."
  - "Golden tickets leave almost no DC-side trace — look for the TGT-lifetime anomaly and impossible-travel logons instead."
