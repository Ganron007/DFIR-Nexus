# kb: EIR AD lesson (Kerberoast/AS-REP/DCSync/delegation abuse detection)
# kb: d_f9d99a1b61b6 (EIR — domain enumeration command set)
# kb: SANS AD attack poster, FOR508 AD material, BTL1 AD attacks
skill: ad_credential_attacks
title: AD credential attacks — Kerberoast, AS-REP roast, DCSync, delegation
description: 'Detect Active Directory credential attacks: Kerberoasting (SPN ticket
  extraction), AS-REP roasting (pre-auth disabled), DCSync replication abuse, unconstrained/constrained
  delegation abuse, and golden/silver ticket indicators.'
trigger:
  families:
  - evtx
  - security
  - hayabusa
  - sysmon
  keywords:
  - kerberos
  - kerberoast
  - asrep
  - dcsync
  - spn
  - ticket
  - delegation
  - rubeus
  - klist
  - tgt
  - tgs
  techniques:
  - T1558.003
  - T1558.004
  - T1003.006
  - T1558.001
  - T1558.002
steps:
- name: kerberoast_tgs
  query: 4769 RC4 OR 0x17 OR service ticket
  look_for: 'Kerberoasting signature: burst of 4769 TGS requests for service accounts
    (SPNs) with RC4 encryption (ticket type 0x17) — attackers request crackable RC4
    tickets to brute offline. One account requesting many distinct SPNs in a short
    window is the tell.'
  pivot: ServiceName
  corroborate: single account → many SPNs + RC4 downgrade + no corresponding service
    usage
  es:
    bool:
      should:
      - bool:
          must:
          - term:
              event_id: '4769'
          - wildcard:
              text.wc:
                value: '*RC4*'
                case_insensitive: true
      - wildcard:
          text.wc:
            value: '*0x17*'
            case_insensitive: true
      - wildcard:
          text.wc:
            value: '*service ticket*'
            case_insensitive: true
      minimum_should_match: 1
  requires:
    families: &id001
    - evtx
    - security
    - hayabusa
    - sysmon
  es_text_only_reason:
  - 'RC4: free phrase; the step''s pivot names no registry column'
  - '0x17: no typed column for a hex mask in these families'
  - 'service ticket: free phrase; the step''s pivot names no registry column'
- name: asrep_roast
  query: 4768 pre-authentication OR 0x40850210
  look_for: 'AS-REP roasting: 4768 TGT requests succeeding WITHOUT pre-auth for accounts
    with DONT_REQ_PREAUTH — attacker harvested AS-REPs to crack offline. Look for
    the pre-auth type field absent/0 on accounts that should require it.'
  pivot: TargetUserName
  es:
    bool:
      should:
      - bool:
          must:
          - term:
              event_id: '4768'
          - wildcard:
              text.wc:
                value: '*pre-authentication*'
                case_insensitive: true
      - wildcard:
          text.wc:
            value: '*0x40850210*'
            case_insensitive: true
      minimum_should_match: 1
  requires:
    families: *id001
  es_text_only_reason:
  - 'pre-authentication: free phrase; the step''s pivot is an identity column'
  - '0x40850210: no typed column for a hex mask in these families'
- name: dcsync_replication
  query: 4662 Replicating OR directory service access
  look_for: 'DCSync: 4662 replication extended-rights access by a non-DC account —
    DS-Replication-Get-Changes-All/Secrets GUIDs. DCs replicate with other DCs; anything
    else requesting replication is hostile.'
  pivot: SubjectUserName
  corroborate: followed by 4624 type-3 from the requester's source + mass account-hash
    usage
  es:
    bool:
      should:
      - bool:
          must:
          - term:
              event_id: '4662'
          - wildcard:
              text.wc:
                value: '*Replicating*'
                case_insensitive: true
      - wildcard:
          text.wc:
            value: '*directory service access*'
            case_insensitive: true
      minimum_should_match: 1
  requires:
    families: *id001
  es_text_only_reason:
  - 'Replicating: free phrase; the step''s pivot is an identity column'
  - 'directory service access: free phrase; the step''s pivot is an identity column'
- name: delegation_abuse
  query: delegation OR trusted for delegation OR unconstrained
  look_for: 'Delegation abuse: unconstrained-delegation hosts capture TGTs of connecting
    users; constrained-delegation (S4U2Self/S4U2Proxy) misuse lets a service impersonate.
    New delegation settings on unexpected accounts/computers are the pre-attack staging.'
  pivot: TargetUserName
  es:
    bool:
      should:
      - wildcard:
          text.wc:
            value: '*delegation*'
            case_insensitive: true
      - wildcard:
          text.wc:
            value: '*trusted for delegation*'
            case_insensitive: true
      - wildcard:
          text.wc:
            value: '*unconstrained*'
            case_insensitive: true
      minimum_should_match: 1
  requires:
    families: *id001
  es_text_only_reason:
  - 'delegation: free phrase; the step''s pivot is an identity column'
  - 'trusted for delegation: free phrase; the step''s pivot is an identity column'
  - 'unconstrained: free phrase; the step''s pivot is an identity column'
- name: golden_ticket
  query: ticket lifetime OR 4768 OR 4769 OR aes
  look_for: 'Golden/silver tickets: TGS requests for accounts with no matching 4768
    TGT (forged tickets skip the AS exchange), anomalous ticket lifetimes (>10h default),
    or encryption-type anomalies vs domain baseline.'
  corroborate: 4769 without preceding 4768 for the same account
  es:
    bool:
      should:
      - wildcard:
          text.wc:
            value: '*ticket lifetime*'
            case_insensitive: true
      - term:
          event_id: '4768'
      - term:
          event_id: '4769'
      - wildcard:
          text.wc:
            value: '*aes*'
            case_insensitive: true
      minimum_should_match: 1
  requires:
    families: *id001
  es_text_only_reason:
  - 'ticket lifetime: free phrase; the step''s pivot names no registry column'
  - 'aes: free phrase; the step''s pivot names no registry column'
- name: enum_pre_attack
  query: net group OR nltest OR dsquery OR setspn
  look_for: 'Pre-attack enumeration feeds the roast: setspn -Q */* (SPN discovery
    = kerberoast target list), net group "Domain Admins" /domain, nltest /dclist —
    recon commands precede the credential attack in the same session window.'
  pivot: CommandLine
  es:
    bool:
      should:
      - wildcard:
          fields.command_line.kw:
            value: '*net group*'
            case_insensitive: true
      - wildcard:
          fields.command_line.kw:
            value: '*nltest*'
            case_insensitive: true
      - wildcard:
          fields.command_line.kw:
            value: '*dsquery*'
            case_insensitive: true
      - wildcard:
          fields.command_line.kw:
            value: '*setspn*'
            case_insensitive: true
      minimum_should_match: 1
  requires:
    families: *id001
negative: 'No anomalous 4768/4769/4662 patterns → AD credential attacks not evident
  in the window. Note: DCSync and golden tickets can be nearly silent on endpoints
  — DC Security log coverage is required for this skill to be meaningful.'
confidence_rules:
  high: DCSync GUIDs by non-DC account OR RC4 SPN burst + offline-crack context OR
    ticket without TGT
  medium: anomalous ticket patterns + recon commands in same window
  low: single odd 4769 (service accounts legitimately request tickets)
mitre:
- T1558.003
- T1558.004
- T1003.006
- T1558.001
- T1558.002
