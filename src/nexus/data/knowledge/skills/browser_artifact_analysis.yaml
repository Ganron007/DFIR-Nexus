caveats:
- History databases only show what was retained — InPrivate/Incognito and history-clearing
  leave cache/cookies/session residue instead.
- Chrome/Edge timestamps are WebKit microseconds since 1601; Firefox is Unix µs —
  normalize before timeline merge.
- Sync'd profiles (signed-in Chrome/Edge) can import history from OTHER devices —
  attribute the device field, not just the URL.
- Downloads table rows persist after the file is deleted — the download event is provable
  even when the payload is gone.
