# kb: d_db0d91434fd6:c0035 (HTB DefSec — beaconing interval classes: fixed,
#      jittered, complex-schedule; carriers HTTP/HTTPS/DNS/ICMP; Cobalt
#      Strike default profile detection)
# kb: CCD M2 (RITA beacon scoring), EIR C2 methodology
skill: c2_beaconing
title: C2 beaconing — periodic callbacks, beacon intervals, DGA
description: Detect command-and-control traffic — periodic connections, beacon jitter,
  domain-generation algorithms, and proxy artifacts.
trigger:
  families:
  - netstat
  - dns
  - browser
  - evtx
  - sysmon
  - powershell
  keywords:
  - c2
  - beacon
  - callback
  - botnet
  - implant
  - cobalt
  - meterpreter
  - sliver
  techniques:
  - T1071
  - T1071.001
  - T1071.004
  - T1105
steps:
- name: periodic_connections
  query: netstat OR ESTABLISHED
  look_for: 'Repeated connections to the same external IP/domain at regular intervals
    — classic beacon signature. Classify the interval: FIXED (exact cadence), JITTERED
    (varied slightly around a base period — common evasion), or COMPLEX-SCHEDULE (malware-defined
    timing). Small uniform payloads at near-fixed intervals are the strongest signal.'
  pivot: RemoteAddress
  corroborate: connection-size uniformity + interval variance analysis
  es:
    bool:
      should:
      - wildcard:
          text.wc:
            value: '*netstat*'
            case_insensitive: true
      - wildcard:
          text.wc:
            value: '*ESTABLISHED*'
            case_insensitive: true
      minimum_should_match: 1
  requires:
    families: &id001
    - netstat
    - dns
    - browser
    - evtx
    - sysmon
    - powershell
  es_text_only_reason:
  - 'netstat: value of the wrong kind for source_ip; searched in text'
  - 'ESTABLISHED: value of the wrong kind for source_ip; searched in text'
- name: cobalt_beacon
  query: cobaltstrike OR beacon OR beacon.dll
  look_for: Cobalt Strike artifacts — beacon.dll in process, known C2 IPs.
  pivot: Image
  es:
    bool:
      should:
      - wildcard:
          fields.ExecutableInfo.kw:
            value: '*cobaltstrike*'
            case_insensitive: true
      - wildcard:
          fields.ExecutableInfo.kw:
            value: '*beacon*'
            case_insensitive: true
      - wildcard:
          fields.file_path.kw:
            value: '*beacon.dll*'
            case_insensitive: true
      minimum_should_match: 1
  requires:
    families: *id001
- name: dga_domains
  query: dns QueryName OR nslookup
  look_for: Long random subdomains, non-standard TLDs, high-entropy names.
  pivot: QueryName
  es:
    bool:
      should:
      - wildcard:
          fields.PayloadData2.kw:
            value: '*dns QueryName*'
            case_insensitive: true
      - wildcard:
          fields.PayloadData2.kw:
            value: '*nslookup*'
            case_insensitive: true
      minimum_should_match: 1
  requires:
    families: *id001
- name: dnscat_tunneling
  query: dnscat OR iodine OR dns2tcp
  look_for: DNS tunneling tool execution or TXT-record exfil patterns.
  pivot: CommandLine
  es:
    bool:
      should:
      - wildcard:
          fields.command_line.kw:
            value: '*dnscat*'
            case_insensitive: true
      - wildcard:
          fields.command_line.kw:
            value: '*iodine*'
            case_insensitive: true
      - wildcard:
          fields.command_line.kw:
            value: '*dns2tcp*'
            case_insensitive: true
      minimum_should_match: 1
  requires:
    families: *id001
- name: proxy_pac
  query: proxy OR pac file OR ProxyServer
  look_for: Proxy settings that redirect traffic through attacker infra.
  pivot: ValueName
  es:
    bool:
      should:
      - wildcard:
          fields.registry_value.kw:
            value: '*proxy*'
            case_insensitive: true
      - wildcard:
          fields.registry_value.kw:
            value: '*pac file*'
            case_insensitive: true
      - wildcard:
          fields.registry_value.kw:
            value: '*ProxyServer*'
            case_insensitive: true
      minimum_should_match: 1
  requires:
    families: *id001
- name: smb_beacon
  query: \\.\pipe\ OR named pipe
  look_for: Named-pipe creation/connection for SMB-beacon implants.
  pivot: PipeName
  es:
    bool:
      should:
      - wildcard:
          text.wc:
            value: '*\\.\pipe\*'
            case_insensitive: true
      - wildcard:
          text.wc:
            value: '*named pipe*'
            case_insensitive: true
      minimum_should_match: 1
  requires:
    families: *id001
  es_text_only_reason:
  - '\\.\pipe\: free phrase; the step''s pivot names no registry column'
  - 'named pipe: free phrase; the step''s pivot names no registry column'
- name: carrier_protocols
  query: dns TXT OR icmp OR http POST
  look_for: 'Beacon carriers beyond HTTP/S: DNS TXT/NULL queries at intervals, ICMP
    echo payloads, or HTTPS POSTs of uniform small size. Cobalt Strike default profile
    uses HTTP GET metadata + POST tasking — profile request-size asymmetry, not just
    destination.'
  pivot: QueryName
  es:
    bool:
      should:
      - wildcard:
          fields.PayloadData2.kw:
            value: '*dns TXT*'
            case_insensitive: true
      - wildcard:
          fields.PayloadData2.kw:
            value: '*icmp*'
            case_insensitive: true
      - wildcard:
          fields.PayloadData2.kw:
            value: '*http POST*'
            case_insensitive: true
      minimum_should_match: 1
  requires:
    families: *id001
negative: No periodic external connections or C2 artifacts → implant likely dormant,
  destroyed, or using encrypted/unobserved channels.
confidence_rules:
  high: regular-interval connections + named-pipe/beacon artifact
  medium: periodic DNS to suspicious domain without confirmed payload
  low: single external connection (normal traffic)
mitre:
- T1071
- T1105
