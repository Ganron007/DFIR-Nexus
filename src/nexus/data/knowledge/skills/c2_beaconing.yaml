skill: c2_beaconing
title: C2 beaconing — periodic callbacks, beacon intervals, DGA
description: Detect command-and-control traffic — periodic connections, beacon jitter, domain-generation algorithms,
  and proxy artifacts.
trigger:
  families:
  - netstat
  - dns
  - browser
  - evtx
  - sysmon
  - powershell
  keywords:
  - c2
  - beacon
  - callback
  - botnet
  - implant
  - cobalt
  - meterpreter
  - sliver
  techniques:
  - T1071
  - T1071.001
  - T1071.004
  - T1105
steps:
- name: periodic_connections
  query: netstat OR ESTABLISHED
  look_for: 'Repeated connections to the same external IP/domain at regular intervals — classic beacon signature.
    Classify the interval: FIXED (exact cadence), JITTERED (varied slightly around a base period — common evasion),
    or COMPLEX-SCHEDULE (malware-defined timing). Small uniform payloads at near-fixed intervals are the strongest
    signal.'
  pivot: RemoteAddress
  corroborate: connection-size uniformity + interval variance analysis
  requires:
    families:
    - evtxecmd
    - hayabusa
  es_source:
    bool:
      filter:
      - bool:
          filter:
          - term:
              ecs.winlog.channel:
                value: Microsoft-Windows-Sysmon/Operational
                case_insensitive: true
          - terms:
              event_id:
              - '3'
  source: Sysmon 3
  kind: aggregate
  search:
    basis:
    - attack:DET0027
    events:
    - channel: Microsoft-Windows-Sysmon/Operational
      codes:
      - '3'
  aggregate:
    field: ecs.destination.ip
    size: 100
  es:
    bool:
      filter:
      - bool:
          filter:
          - term:
              ecs.winlog.channel:
                value: Microsoft-Windows-Sysmon/Operational
                case_insensitive: true
          - terms:
              event_id:
              - '3'
  es_aggs:
    by:
      terms:
        field: ecs.destination.ip
        size: 100
- name: cobalt_beacon
  query: cobaltstrike OR beacon OR beacon.dll
  look_for: Cobalt Strike artifacts — beacon.dll in process, known C2 IPs.
  pivot: Image
  requires:
    families:
    - evtxecmd
    - hayabusa
  es_source:
    bool:
      filter:
      - bool:
          should:
          - bool:
              filter:
              - term:
                  ecs.winlog.channel:
                    value: Microsoft-Windows-Sysmon/Operational
                    case_insensitive: true
              - terms:
                  event_id:
                  - '17'
                  - '18'
          - bool:
              filter:
              - term:
                  ecs.winlog.channel:
                    value: Microsoft-Windows-Windows Defender/Operational
                    case_insensitive: true
              - terms:
                  event_id:
                  - '1116'
                  - '1117'
          minimum_should_match: 1
  source: Sysmon 17, 18; Defender/Operational 1116, 1117
  search:
    basis:
    - evtx-map
    - manifest
    events:
    - channel: Microsoft-Windows-Sysmon/Operational
      codes:
      - '17'
      - '18'
    - channel: Microsoft-Windows-Windows Defender/Operational
      codes:
      - '1116'
      - '1117'
    any:
    - field: ecs.winlog.event_data.PipeName
      contains:
      - \MSSE-
      - \msagent_
      - \postex_
      - \status_
      - \mojo.5688.8052
    - field: text
      contains:
      - CobaltStrike
  es:
    bool:
      filter:
      - bool:
          should:
          - bool:
              filter:
              - term:
                  ecs.winlog.channel:
                    value: Microsoft-Windows-Sysmon/Operational
                    case_insensitive: true
              - terms:
                  event_id:
                  - '17'
                  - '18'
          - bool:
              filter:
              - term:
                  ecs.winlog.channel:
                    value: Microsoft-Windows-Windows Defender/Operational
                    case_insensitive: true
              - terms:
                  event_id:
                  - '1116'
                  - '1117'
          minimum_should_match: 1
      - bool:
          should:
          - bool:
              should:
              - wildcard:
                  ecs.winlog.event_data.PipeName.wc:
                    value: '*\\MSSE-*'
                    case_insensitive: true
              - wildcard:
                  ecs.winlog.event_data.PipeName.wc:
                    value: '*\\msagent_*'
                    case_insensitive: true
              - wildcard:
                  ecs.winlog.event_data.PipeName.wc:
                    value: '*\\postex_*'
                    case_insensitive: true
              - wildcard:
                  ecs.winlog.event_data.PipeName.wc:
                    value: '*\\status_*'
                    case_insensitive: true
              - wildcard:
                  ecs.winlog.event_data.PipeName.wc:
                    value: '*\\mojo.5688.8052*'
                    case_insensitive: true
              minimum_should_match: 1
          - wildcard:
              text.wc:
                value: '*CobaltStrike*'
                case_insensitive: true
          minimum_should_match: 1
- name: dga_domains
  query: dns QueryName OR nslookup
  look_for: Long random subdomains, non-standard TLDs, high-entropy names.
  pivot: QueryName
  requires:
    families:
    - evtxecmd
    - hayabusa
  es_source:
    bool:
      filter:
      - bool:
          filter:
          - term:
              ecs.winlog.channel:
                value: Microsoft-Windows-Sysmon/Operational
                case_insensitive: true
          - terms:
              event_id:
              - '22'
  source: Sysmon 22
  kind: aggregate
  search:
    basis:
    - attack:DET0400
    events:
    - channel: Microsoft-Windows-Sysmon/Operational
      codes:
      - '22'
  aggregate:
    field: ecs.dns.question.name
    size: 100
  es:
    bool:
      filter:
      - bool:
          filter:
          - term:
              ecs.winlog.channel:
                value: Microsoft-Windows-Sysmon/Operational
                case_insensitive: true
          - terms:
              event_id:
              - '22'
  es_aggs:
    by:
      terms:
        field: ecs.dns.question.name
        size: 100
- name: dnscat_tunneling
  query: dnscat OR iodine OR dns2tcp
  look_for: DNS tunneling tool execution or TXT-record exfil patterns.
  pivot: CommandLine
  requires:
    families:
    - evtxecmd
    - hayabusa
  es_source:
    bool:
      filter:
      - bool:
          should:
          - bool:
              filter:
              - term:
                  ecs.winlog.channel:
                    value: Microsoft-Windows-Sysmon/Operational
                    case_insensitive: true
              - terms:
                  event_id:
                  - '1'
          - bool:
              filter:
              - term:
                  ecs.winlog.channel:
                    value: Security
                    case_insensitive: true
              - terms:
                  event_id:
                  - '4688'
          minimum_should_match: 1
  source: Sysmon 1; Security 4688
  search:
    basis:
    - attack:DET0538
    - manifest
    events:
    - channel: Microsoft-Windows-Sysmon/Operational
      codes:
      - '1'
    - channel: Security
      codes:
      - '4688'
    any:
    - field: ecs.process.command_line
      contains:
      - dnscat
      - iodine
      - dns2tcp
  es:
    bool:
      filter:
      - bool:
          should:
          - bool:
              filter:
              - term:
                  ecs.winlog.channel:
                    value: Microsoft-Windows-Sysmon/Operational
                    case_insensitive: true
              - terms:
                  event_id:
                  - '1'
          - bool:
              filter:
              - term:
                  ecs.winlog.channel:
                    value: Security
                    case_insensitive: true
              - terms:
                  event_id:
                  - '4688'
          minimum_should_match: 1
      - bool:
          should:
          - wildcard:
              ecs.process.command_line.wc:
                value: '*dnscat*'
                case_insensitive: true
          - wildcard:
              ecs.process.command_line.wc:
                value: '*iodine*'
                case_insensitive: true
          - wildcard:
              ecs.process.command_line.wc:
                value: '*dns2tcp*'
                case_insensitive: true
          minimum_should_match: 1
- name: proxy_pac
  query: proxy OR pac file OR ProxyServer
  look_for: Proxy settings that redirect traffic through attacker infra.
  pivot: ValueName
  requires:
    families:
    - evtxecmd
    - hayabusa
    - recmd
  es_source:
    bool:
      filter:
      - bool:
          should:
          - bool:
              should:
              - bool:
                  filter:
                  - term:
                      ecs.winlog.channel:
                        value: Microsoft-Windows-Sysmon/Operational
                        case_insensitive: true
                  - terms:
                      event_id:
                      - '13'
              - bool:
                  filter:
                  - term:
                      ecs.winlog.channel:
                        value: Microsoft-Windows-WinINet-Config/ProxyConfigChanged
                        case_insensitive: true
                  - terms:
                      event_id:
                      - '5600'
              minimum_should_match: 1
          - terms:
              family:
              - recmd
          minimum_should_match: 1
  source: Sysmon 13; Microsoft-Windows-WinINet-Config/ProxyConfigChanged 5600; families recmd
  search:
    basis:
    - attack:DET0445
    - evtx-map
    events:
    - channel: Microsoft-Windows-Sysmon/Operational
      codes:
      - '13'
    - channel: Microsoft-Windows-WinINet-Config/ProxyConfigChanged
      codes:
      - '5600'
    families:
    - recmd
    any:
    - field: event_id
      is:
      - '5600'
    - field: ecs.registry.path
      endswith:
      - \Internet Settings\ProxyServer
      - \Internet Settings\AutoConfigURL
      - \Internet Settings\ProxyEnable
    - field: ecs.registry.value
      is:
      - ProxyServer
      - AutoConfigURL
  es:
    bool:
      filter:
      - bool:
          should:
          - bool:
              should:
              - bool:
                  filter:
                  - term:
                      ecs.winlog.channel:
                        value: Microsoft-Windows-Sysmon/Operational
                        case_insensitive: true
                  - terms:
                      event_id:
                      - '13'
              - bool:
                  filter:
                  - term:
                      ecs.winlog.channel:
                        value: Microsoft-Windows-WinINet-Config/ProxyConfigChanged
                        case_insensitive: true
                  - terms:
                      event_id:
                      - '5600'
              minimum_should_match: 1
          - terms:
              family:
              - recmd
          minimum_should_match: 1
      - bool:
          should:
          - term:
              event_id: '5600'
          - bool:
              should:
              - wildcard:
                  ecs.registry.path.wc:
                    value: '*\\Internet Settings\\ProxyServer'
                    case_insensitive: true
              - wildcard:
                  ecs.registry.path.wc:
                    value: '*\\Internet Settings\\AutoConfigURL'
                    case_insensitive: true
              - wildcard:
                  ecs.registry.path.wc:
                    value: '*\\Internet Settings\\ProxyEnable'
                    case_insensitive: true
              minimum_should_match: 1
          - bool:
              should:
              - term:
                  ecs.registry.value:
                    value: ProxyServer
                    case_insensitive: true
              - term:
                  ecs.registry.value:
                    value: AutoConfigURL
                    case_insensitive: true
              minimum_should_match: 1
          minimum_should_match: 1
- name: smb_beacon
  query: \\.\pipe\ OR named pipe
  look_for: Named-pipe creation/connection for SMB-beacon implants.
  pivot: PipeName
  requires:
    families:
    - evtxecmd
    - hayabusa
  es_source:
    bool:
      filter:
      - bool:
          filter:
          - term:
              ecs.winlog.channel:
                value: Microsoft-Windows-Sysmon/Operational
                case_insensitive: true
          - terms:
              event_id:
              - '17'
              - '18'
  source: Sysmon 17, 18
  kind: aggregate
  search:
    basis:
    - evtx-map
    events:
    - channel: Microsoft-Windows-Sysmon/Operational
      codes:
      - '17'
      - '18'
  aggregate:
    field: ecs.winlog.event_data.PipeName
    size: 100
  es:
    bool:
      filter:
      - bool:
          filter:
          - term:
              ecs.winlog.channel:
                value: Microsoft-Windows-Sysmon/Operational
                case_insensitive: true
          - terms:
              event_id:
              - '17'
              - '18'
  es_aggs:
    by:
      terms:
        field: ecs.winlog.event_data.PipeName
        size: 100
- name: carrier_protocols
  query: dns TXT OR icmp OR http POST
  look_for: 'Beacon carriers beyond HTTP/S: DNS TXT/NULL queries at intervals, ICMP echo payloads, or HTTPS POSTs
    of uniform small size. Cobalt Strike default profile uses HTTP GET metadata + POST tasking — profile request-size
    asymmetry, not just destination.'
  pivot: QueryName
  requires:
    families:
    - evtxecmd
    - hayabusa
  es_source:
    bool:
      filter:
      - bool:
          filter:
          - term:
              ecs.winlog.channel:
                value: Microsoft-Windows-Sysmon/Operational
                case_insensitive: true
          - terms:
              event_id:
              - '3'
  source: Sysmon 3
  kind: aggregate
  search:
    basis:
    - attack:DET0027
    - attack:DET0400
    events:
    - channel: Microsoft-Windows-Sysmon/Operational
      codes:
      - '3'
  aggregate:
    field: ecs.destination.port
    size: 50
  es:
    bool:
      filter:
      - bool:
          filter:
          - term:
              ecs.winlog.channel:
                value: Microsoft-Windows-Sysmon/Operational
                case_insensitive: true
          - terms:
              event_id:
              - '3'
  es_aggs:
    by:
      terms:
        field: ecs.destination.port
        size: 50
negative: No periodic external connections or C2 artifacts → implant likely dormant, destroyed, or using encrypted/unobserved
  channels.
confidence_rules:
  high: regular-interval connections + named-pipe/beacon artifact
  medium: periodic DNS to suspicious domain without confirmed payload
  low: single external connection (normal traffic)
mitre:
- T1071
- T1105
caveats:
- Some beacons use sleep/jitter to evade periodic detection — look at variance, not just regularity.
- Legitimate telemetry (Windows, AV, update services) creates periodic traffic — filter by destination.
