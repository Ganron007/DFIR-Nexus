caveats:
- Containers are ephemeral — `docker rm` destroys the writable layer; recovery depends
  on the host overlay2 data surviving, so capture it before any prune.
- Kubernetes audit logging must be enabled and retained; many clusters log only metadata
  by default — missing request bodies is a coverage gap, not innocence.
- Platform/CI systems pull and run many images legitimately — verify the registry,
  digest, and service account before flagging (FD-004).
- Host runtime telemetry (auditd/sysdig) is required to see inside containers; without
  it, container behaviour is only visible through stdout logs.
