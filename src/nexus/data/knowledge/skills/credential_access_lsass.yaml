# kb: EIR CH4-1 (Windows credential theft — LSASS dump vectors)
# kb: 13Cubed Windows Memory (lsass access/dump artifacts in memory triage)
# kb: FOR526 memory forensics (credential material in process memory)
skill: lsass_credential_access
title: LSASS memory credential dumping
description: Detect access to lsass.exe memory by non-standard processes — the canonical
  credential-dumping signal (mimikatz, procdump, comsvcs, nanodump, EDR bypass).
trigger:
  families:
  - evtx
  - sysmon
  - security
  - hayabusa
  keywords:
  - credential
  - cred
  - lsass
  - dump
  - mimikatz
  - procdump
  - comsvcs
  - nanodump
  techniques:
  - T1003.001
  - T1003
steps:
- name: sysmon_lsass_access
  query: lsass.exe GrantedAccess
  look_for: Sysmon EventID 10 (ProcessAccess) on lsass.exe with GrantedAccess 0x1010
    / 0x1410 / 0x1438 / 0x143a from a SourceImage that is NOT MsMpEng.exe, svchost,
    or a signed EDR binary.
  pivot: SourceImage
  corroborate: unsigned or user-writable SourceImage path
  es:
    wildcard:
      fields.process_name.kw:
        value: '*lsass.exe*'
        case_insensitive: true
  requires:
    families: &id001
    - evtx
    - sysmon
    - security
    - hayabusa
- name: sec_lsass_handle
  query: lsass.exe 4656 OR 4663
  look_for: Security 4656/4663 handle requests on lsass.exe by non-system processes
    (access mask 0x1010 indicates PROCESS_VM_READ).
  pivot: ProcessName
  es:
    wildcard:
      fields.process_name.kw:
        value: '*lsass.exe*'
        case_insensitive: true
  requires:
    families: *id001
- name: dump_tool_execution
  query: procdump comsvcs.dll nanodump mimikatz sekurlsa
  look_for: Execution of known dump tools — procdump -ma lsass, rundll32 comsvcs.dll
    MiniDump, nanodump, mimikatz sekurlsa::logonpasswords.
  pivot: CommandLine
  es:
    wildcard:
      fields.command_line.kw:
        value: '*comsvcs.dll*'
        case_insensitive: true
  requires:
    families: *id001
- name: dump_file_artifacts
  query: lsass.dmp lsass.exe.dmp procdump .dmp
  look_for: Dump files on disk (mft/usn/prefetch/amcache) named for lsass.
  pivot: FileName
  es:
    wildcard:
      fields.file_path.kw:
        value: '*lsass.dmp*'
        case_insensitive: true
  requires:
    families: *id001
- name: protected_process_bypass
  query: PPL service lsass protection RunAsPPL
  look_for: Attempts to disable LSASS PPL or load unsigned drivers to bypass it.
  corroborate: service creation events for driver loaders
  es:
    wildcard:
      text.wc:
        value: '*protection*'
        case_insensitive: true
  requires:
    families: *id001
- name: memory_side_confirmation
  query: lsass OR mimikatz OR sekurlsa OR wdigest
  look_for: 'If a memory image exists, confirm at the source: injected threads or
    unexpected handles into lsass.exe, mimikatz/sekurlsa strings, wdigest plaintext-credential
    artifacts — memory-side proof survives even when Sysmon 10 was filtered or logs
    cleared.'
  corroborate: disk-side dump artifacts (dmp files, tool prefetch) in the same window
  es:
    wildcard:
      text.wc:
        value: '*lsass*'
        case_insensitive: true
  requires:
    families: *id001
negative: No lsass-access events and no dump-tool execution → credentials were likely
  NOT read from LSASS memory on this host; consider SAM/NTDS/DCSync instead.
confidence_rules:
  high: unsigned SourceImage + GrantedAccess 0x1010/0x1410 + dump artifact present
  medium: lsass access by a signed-but-unusual process (e.g. taskmgr, sqlservr)
  low: lsass access by known EDR/backup processes (still note for review)
mitre:
- T1003.001
