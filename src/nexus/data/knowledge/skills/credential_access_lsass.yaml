skill: lsass_credential_access
title: LSASS memory credential dumping
description: >-
  Detect access to lsass.exe memory by non-standard processes — the canonical
  credential-dumping signal (mimikatz, procdump, comsvcs, nanodump, EDR bypass).
trigger:
  families: [evtx, sysmon, security, hayabusa]
  keywords: [credential, cred, lsass, dump, mimikatz, procdump, comsvcs, nanodump]
  techniques: [T1003.001, T1003]
steps:
  - name: sysmon_lsass_access
    query: "lsass.exe GrantedAccess"
    look_for: >-
      Sysmon EventID 10 (ProcessAccess) on lsass.exe with GrantedAccess
      0x1010 / 0x1410 / 0x1438 / 0x143a from a SourceImage that is NOT
      MsMpEng.exe, svchost, or a signed EDR binary.
    pivot: SourceImage
    corroborate: unsigned or user-writable SourceImage path
  - name: sec_lsass_handle
    query: "lsass.exe 4656 OR 4663"
    look_for: >-
      Security 4656/4663 handle requests on lsass.exe by non-system
      processes (access mask 0x1010 indicates PROCESS_VM_READ).
    pivot: ProcessName
  - name: dump_tool_execution
    query: "procdump comsvcs.dll nanodump mimikatz sekurlsa"
    look_for: >-
      Execution of known dump tools — procdump -ma lsass,
      rundll32 comsvcs.dll MiniDump, nanodump, mimikatz sekurlsa::logonpasswords.
    pivot: CommandLine
  - name: dump_file_artifacts
    query: "lsass.dmp lsass.exe.dmp procdump .dmp"
    look_for: Dump files on disk (mft/usn/prefetch/amcache) named for lsass.
    pivot: FileName
  - name: protected_process_bypass
    query: "PPL service lsass protection RunAsPPL"
    look_for: Attempts to disable LSASS PPL or load unsigned drivers to bypass it.
    corroborate: service creation events for driver loaders
negative: >-
  No lsass-access events and no dump-tool execution → credentials were likely
  NOT read from LSASS memory on this host; consider SAM/NTDS/DCSync instead.
confidence_rules:
  high: unsigned SourceImage + GrantedAccess 0x1010/0x1410 + dump artifact present
  medium: lsass access by a signed-but-unusual process (e.g. taskmgr, sqlservr)
  low: lsass access by known EDR/backup processes (still note for review)
mitre: [T1003.001]
caveats:
  - "EDR, AV, and backup agents legitimately read LSASS — verify the SourceImage signer first (FD-004)."
  - "Sysmon 10 requires an Olaf/SwiftOnSecurity-style config that logs lsass access — absence may be a coverage gap, not absence of attack."
