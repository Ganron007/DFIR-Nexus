skill: lsass_credential_access
title: LSASS memory credential dumping
description: Detect access to lsass.exe memory by non-standard processes — the canonical credential-dumping signal
  (mimikatz, procdump, comsvcs, nanodump, EDR bypass).
trigger:
  families:
  - evtx
  - hayabusa
  keywords:
  - credential
  - cred
  - lsass
  - dump
  - mimikatz
  - procdump
  - comsvcs
  - nanodump
  techniques:
  - T1003.001
  - T1003
steps:
- name: sysmon_lsass_access
  query: lsass.exe GrantedAccess
  look_for: Sysmon EventID 10 (ProcessAccess) on lsass.exe with GrantedAccess 0x1010 / 0x1410 / 0x1438 / 0x143a
    from a SourceImage that is NOT MsMpEng.exe, svchost, or a signed EDR binary.
  pivot: SourceImage
  corroborate: unsigned or user-writable SourceImage path
  requires:
    families:
    - kind:evtx
  es_source:
    bool:
      filter:
      - bool:
          filter:
          - term:
              ecs.winlog.channel:
                value: Microsoft-Windows-Sysmon/Operational
                case_insensitive: true
          - terms:
              event_id:
              - '10'
  source: Sysmon 10
  search:
    basis:
    - attack:DET0363
    events:
    - channel: Microsoft-Windows-Sysmon/Operational
      codes:
      - '10'
    all:
    - field: ecs.winlog.event_data.TargetImage
      endswith:
      - \lsass.exe
  es:
    bool:
      filter:
      - bool:
          filter:
          - term:
              ecs.winlog.channel:
                value: Microsoft-Windows-Sysmon/Operational
                case_insensitive: true
          - terms:
              event_id:
              - '10'
      - wildcard:
          ecs.winlog.event_data.TargetImage.wc:
            value: '*\\lsass.exe'
            case_insensitive: true
- name: sec_lsass_handle
  query: lsass.exe 4656 OR 4663
  look_for: Security 4656/4663 handle requests on lsass.exe by non-system processes (access mask 0x1010 indicates
    PROCESS_VM_READ).
  pivot: ProcessName
  requires:
    families:
    - kind:evtx
  es_source:
    bool:
      filter:
      - bool:
          filter:
          - term:
              ecs.winlog.channel:
                value: Security
                case_insensitive: true
          - terms:
              event_id:
              - '4656'
              - '4663'
  source: Security 4656, 4663
  search:
    basis:
    - attack:DET0234
    events:
    - channel: Security
      codes:
      - '4656'
      - '4663'
    all:
    - field: ecs.winlog.event_data.ObjectName
      endswith:
      - \lsass.exe
  es:
    bool:
      filter:
      - bool:
          filter:
          - term:
              ecs.winlog.channel:
                value: Security
                case_insensitive: true
          - terms:
              event_id:
              - '4656'
              - '4663'
      - wildcard:
          ecs.winlog.event_data.ObjectName.wc:
            value: '*\\lsass.exe'
            case_insensitive: true
- name: dump_tool_execution
  query: procdump comsvcs.dll nanodump mimikatz sekurlsa
  look_for: Execution of known dump tools — procdump -ma lsass, rundll32 comsvcs.dll MiniDump, nanodump, mimikatz
    sekurlsa::logonpasswords.
  pivot: CommandLine
  requires:
    families:
    - kind:evtx
  es_source:
    bool:
      filter:
      - bool:
          should:
          - bool:
              filter:
              - term:
                  ecs.winlog.channel:
                    value: Microsoft-Windows-Sysmon/Operational
                    case_insensitive: true
              - terms:
                  event_id:
                  - '1'
          - bool:
              filter:
              - term:
                  ecs.winlog.channel:
                    value: Security
                    case_insensitive: true
              - terms:
                  event_id:
                  - '4688'
          - bool:
              filter:
              - term:
                  ecs.winlog.channel:
                    value: Microsoft-Windows-PowerShell/Operational
                    case_insensitive: true
              - terms:
                  event_id:
                  - '4104'
          minimum_should_match: 1
  source: Sysmon 1; Security 4688; PowerShell/Operational 4104
  search:
    basis:
    - attack:DET0363
    - attack:DET0455
    - manifest
    events:
    - channel: Microsoft-Windows-Sysmon/Operational
      codes:
      - '1'
    - channel: Security
      codes:
      - '4688'
    - channel: Microsoft-Windows-PowerShell/Operational
      codes:
      - '4104'
    any:
    - field: ecs.process.command_line
      contains:
      - procdump
      - comsvcs
      - MiniDump
      - nanodump
      - sekurlsa
      - mimikatz
    - field: ecs.winlog.event_data.ScriptBlockText
      contains:
      - Invoke-Mimikatz
      - sekurlsa
      - MiniDumpWriteDump
  es:
    bool:
      filter:
      - bool:
          should:
          - bool:
              filter:
              - term:
                  ecs.winlog.channel:
                    value: Microsoft-Windows-Sysmon/Operational
                    case_insensitive: true
              - terms:
                  event_id:
                  - '1'
          - bool:
              filter:
              - term:
                  ecs.winlog.channel:
                    value: Security
                    case_insensitive: true
              - terms:
                  event_id:
                  - '4688'
          - bool:
              filter:
              - term:
                  ecs.winlog.channel:
                    value: Microsoft-Windows-PowerShell/Operational
                    case_insensitive: true
              - terms:
                  event_id:
                  - '4104'
          minimum_should_match: 1
      - bool:
          should:
          - bool:
              should:
              - wildcard:
                  ecs.process.command_line.wc:
                    value: '*procdump*'
                    case_insensitive: true
              - wildcard:
                  ecs.process.command_line.wc:
                    value: '*comsvcs*'
                    case_insensitive: true
              - wildcard:
                  ecs.process.command_line.wc:
                    value: '*MiniDump*'
                    case_insensitive: true
              - wildcard:
                  ecs.process.command_line.wc:
                    value: '*nanodump*'
                    case_insensitive: true
              - wildcard:
                  ecs.process.command_line.wc:
                    value: '*sekurlsa*'
                    case_insensitive: true
              - wildcard:
                  ecs.process.command_line.wc:
                    value: '*mimikatz*'
                    case_insensitive: true
              minimum_should_match: 1
          - bool:
              should:
              - wildcard:
                  ecs.winlog.event_data.ScriptBlockText.wc:
                    value: '*Invoke-Mimikatz*'
                    case_insensitive: true
              - wildcard:
                  ecs.winlog.event_data.ScriptBlockText.wc:
                    value: '*sekurlsa*'
                    case_insensitive: true
              - wildcard:
                  ecs.winlog.event_data.ScriptBlockText.wc:
                    value: '*MiniDumpWriteDump*'
                    case_insensitive: true
              minimum_should_match: 1
          minimum_should_match: 1
- name: dump_file_artifacts
  query: lsass.dmp lsass.exe.dmp procdump .dmp
  look_for: Dump files on disk (mft/usn/prefetch/amcache) named for lsass.
  pivot: FileName
  requires:
    families:
    - kind:evtx
    - mftecmd
  es_source:
    bool:
      filter:
      - bool:
          should:
          - bool:
              filter:
              - term:
                  ecs.winlog.channel:
                    value: Microsoft-Windows-Sysmon/Operational
                    case_insensitive: true
              - terms:
                  event_id:
                  - '11'
          - terms:
              family:
              - mftecmd
          minimum_should_match: 1
  source: Sysmon 11; families mftecmd
  search:
    basis:
    - attack:DET0363
    events:
    - channel: Microsoft-Windows-Sysmon/Operational
      codes:
      - '11'
    families:
    - mftecmd
    all:
    - field: ecs.file.name
      contains:
      - lsass
    - field: ecs.file.extension
      is:
      - dmp
  es:
    bool:
      filter:
      - bool:
          should:
          - bool:
              filter:
              - term:
                  ecs.winlog.channel:
                    value: Microsoft-Windows-Sysmon/Operational
                    case_insensitive: true
              - terms:
                  event_id:
                  - '11'
          - terms:
              family:
              - mftecmd
          minimum_should_match: 1
      - wildcard:
          ecs.file.name.wc:
            value: '*lsass*'
            case_insensitive: true
      - term:
          ecs.file.extension:
            value: dmp
            case_insensitive: true
- name: protected_process_bypass
  query: PPL service lsass protection RunAsPPL
  look_for: Attempts to disable LSASS PPL or load unsigned drivers to bypass it.
  corroborate: service creation events for driver loaders
  requires:
    families:
    - kind:evtx
    - recmd
  es_source:
    bool:
      filter:
      - bool:
          should:
          - bool:
              filter:
              - term:
                  ecs.winlog.channel:
                    value: Microsoft-Windows-Sysmon/Operational
                    case_insensitive: true
              - terms:
                  event_id:
                  - '13'
          - terms:
              family:
              - recmd
          minimum_should_match: 1
  source: Sysmon 13; families recmd
  search:
    basis:
    - attack:DET0363
    events:
    - channel: Microsoft-Windows-Sysmon/Operational
      codes:
      - '13'
    families:
    - recmd
    any:
    - field: ecs.registry.path
      endswith:
      - \Control\Lsa\RunAsPPL
    - field: ecs.registry.value
      is:
      - RunAsPPL
  es:
    bool:
      filter:
      - bool:
          should:
          - bool:
              filter:
              - term:
                  ecs.winlog.channel:
                    value: Microsoft-Windows-Sysmon/Operational
                    case_insensitive: true
              - terms:
                  event_id:
                  - '13'
          - terms:
              family:
              - recmd
          minimum_should_match: 1
      - bool:
          should:
          - wildcard:
              ecs.registry.path.wc:
                value: '*\\Control\\Lsa\\RunAsPPL'
                case_insensitive: true
          - term:
              ecs.registry.value:
                value: RunAsPPL
                case_insensitive: true
          minimum_should_match: 1
- name: memory_side_confirmation
  query: lsass OR mimikatz OR sekurlsa OR wdigest
  look_for: 'If a memory image exists, confirm at the source: injected threads or unexpected handles into lsass.exe,
    mimikatz/sekurlsa strings, wdigest plaintext-credential artifacts — memory-side proof survives even when Sysmon
    10 was filtered or logs cleared.'
  corroborate: disk-side dump artifacts (dmp files, tool prefetch) in the same window
  kind: procedure
  procedure_reason: confirming at the source is memory analysis (handles and injected threads in lsass, YARA over
    its pages) done by the memory tools; their detections reach every mode as memory leads (IC-2). No single index
    search states it.
negative: No lsass-access events and no dump-tool execution → credentials were likely NOT read from LSASS memory
  on this host; consider SAM/NTDS/DCSync instead.
confidence_rules:
  high: unsigned SourceImage + GrantedAccess 0x1010/0x1410 + dump artifact present
  medium: lsass access by a signed-but-unusual process (e.g. taskmgr, sqlservr)
  low: lsass access by known EDR/backup processes (still note for review)
mitre:
- T1003.001
caveats:
- EDR, AV, and backup agents legitimately read LSASS — verify the SourceImage signer first (FD-004).
- Sysmon 10 requires an Olaf/SwiftOnSecurity-style config that logs lsass access — absence may be a coverage gap,
  not absence of attack.
