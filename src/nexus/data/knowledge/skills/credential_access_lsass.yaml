caveats:
- EDR, AV, and backup agents legitimately read LSASS — verify the SourceImage signer
  first (FD-004).
- Sysmon 10 requires an Olaf/SwiftOnSecurity-style config that logs lsass access —
  absence may be a coverage gap, not absence of attack.
