skill: sam_ntds_credential_theft
title: SAM/NTDS credential database theft
description: Detect theft of the SAM database (local creds), NTDS.dit (domain creds), or DCSync replication abuse.
trigger:
  families:
  - evtx
  - sysmon
  - security
  - registry
  - mft
  - hayabusa
  keywords:
  - sam
  - ntds
  - dcsync
  - vssadmin
  - shadow
  - secretsdump
  - esentutl
  techniques:
  - T1003.002
  - T1003.003
  - T1003.004
  - T1003.006
  - T1207
steps:
- name: vss_shadow_copy
  query: vssadmin create shadow OR vssadmin delete shadows OR diskshadow
  look_for: Shadow copy creation/deletion around the suspected theft window — attackers copy locked SAM/SYSTEM/NTDS
    from a shadow.
  pivot: CommandLine
  requires:
    families:
    - evtxecmd
    - hayabusa
  es_source:
    bool:
      filter:
      - bool:
          should:
          - bool:
              filter:
              - term:
                  ecs.winlog.channel:
                    value: Microsoft-Windows-Sysmon/Operational
                    case_insensitive: true
              - terms:
                  event_id:
                  - '1'
          - bool:
              filter:
              - term:
                  ecs.winlog.channel:
                    value: Security
                    case_insensitive: true
              - terms:
                  event_id:
                  - '4688'
          minimum_should_match: 1
  source: Sysmon 1; Security 4688
  search:
    basis:
    - attack:DET0586
    - attack:DET0329
    events:
    - channel: Microsoft-Windows-Sysmon/Operational
      codes:
      - '1'
    - channel: Security
      codes:
      - '4688'
    any:
    - field: ecs.process.command_line
      contains:
      - vssadmin
      - diskshadow
      - shadowcopy
  es:
    bool:
      filter:
      - bool:
          should:
          - bool:
              filter:
              - term:
                  ecs.winlog.channel:
                    value: Microsoft-Windows-Sysmon/Operational
                    case_insensitive: true
              - terms:
                  event_id:
                  - '1'
          - bool:
              filter:
              - term:
                  ecs.winlog.channel:
                    value: Security
                    case_insensitive: true
              - terms:
                  event_id:
                  - '4688'
          minimum_should_match: 1
      - bool:
          should:
          - wildcard:
              ecs.process.command_line.wc:
                value: '*vssadmin*'
                case_insensitive: true
          - wildcard:
              ecs.process.command_line.wc:
                value: '*diskshadow*'
                case_insensitive: true
          - wildcard:
              ecs.process.command_line.wc:
                value: '*shadowcopy*'
                case_insensitive: true
          minimum_should_match: 1
- name: sam_reg_export
  query: reg save sam OR reg save system OR reg save security
  look_for: reg save HKLM\SAM / HKLM\SYSTEM / HKLM\SECURITY to a writable path.
  pivot: CommandLine
  requires:
    families:
    - evtxecmd
    - hayabusa
  es_source:
    bool:
      filter:
      - bool:
          should:
          - bool:
              filter:
              - term:
                  ecs.winlog.channel:
                    value: Microsoft-Windows-Sysmon/Operational
                    case_insensitive: true
              - terms:
                  event_id:
                  - '1'
          - bool:
              filter:
              - term:
                  ecs.winlog.channel:
                    value: Security
                    case_insensitive: true
              - terms:
                  event_id:
                  - '4688'
          minimum_should_match: 1
  source: Sysmon 1; Security 4688
  search:
    basis:
    - attack:DET0085
    - evtx-map
    events:
    - channel: Microsoft-Windows-Sysmon/Operational
      codes:
      - '1'
    - channel: Security
      codes:
      - '4688'
    all:
    - field: ecs.process.executable
      endswith:
      - \reg.exe
    - field: ecs.process.command_line
      contains:
      - save
    any:
    - field: ecs.process.command_line
      contains:
      - \sam
      - \system
      - \security
  es:
    bool:
      filter:
      - bool:
          should:
          - bool:
              filter:
              - term:
                  ecs.winlog.channel:
                    value: Microsoft-Windows-Sysmon/Operational
                    case_insensitive: true
              - terms:
                  event_id:
                  - '1'
          - bool:
              filter:
              - term:
                  ecs.winlog.channel:
                    value: Security
                    case_insensitive: true
              - terms:
                  event_id:
                  - '4688'
          minimum_should_match: 1
      - wildcard:
          ecs.process.executable.wc:
            value: '*\\reg.exe'
            case_insensitive: true
      - wildcard:
          ecs.process.command_line.wc:
            value: '*save*'
            case_insensitive: true
      - bool:
          should:
          - wildcard:
              ecs.process.command_line.wc:
                value: '*\\sam*'
                case_insensitive: true
          - wildcard:
              ecs.process.command_line.wc:
                value: '*\\system*'
                case_insensitive: true
          - wildcard:
              ecs.process.command_line.wc:
                value: '*\\security*'
                case_insensitive: true
          minimum_should_match: 1
- name: ntds_copy
  query: ntds.dit ntdsutil esentutl
  look_for: ntdsutil/esentutl copies of NTDS.dit or the dit file touched on a DC.
  pivot: FileName
  requires:
    families:
    - evtxecmd
    - hayabusa
  es_source:
    bool:
      filter:
      - bool:
          should:
          - bool:
              filter:
              - term:
                  ecs.winlog.channel:
                    value: Microsoft-Windows-Sysmon/Operational
                    case_insensitive: true
              - terms:
                  event_id:
                  - '1'
                  - '11'
          - bool:
              filter:
              - term:
                  ecs.winlog.channel:
                    value: Security
                    case_insensitive: true
              - terms:
                  event_id:
                  - '4688'
          minimum_should_match: 1
  source: Sysmon 1, 11; Security 4688
  search:
    basis:
    - attack:DET0586
    - evtx-map
    events:
    - channel: Microsoft-Windows-Sysmon/Operational
      codes:
      - '1'
      - '11'
    - channel: Security
      codes:
      - '4688'
    any:
    - field: ecs.process.command_line
      contains:
      - ntds.dit
      - ntdsutil
      - esentutl
    - field: ecs.file.name
      is:
      - ntds.dit
  es:
    bool:
      filter:
      - bool:
          should:
          - bool:
              filter:
              - term:
                  ecs.winlog.channel:
                    value: Microsoft-Windows-Sysmon/Operational
                    case_insensitive: true
              - terms:
                  event_id:
                  - '1'
                  - '11'
          - bool:
              filter:
              - term:
                  ecs.winlog.channel:
                    value: Security
                    case_insensitive: true
              - terms:
                  event_id:
                  - '4688'
          minimum_should_match: 1
      - bool:
          should:
          - bool:
              should:
              - wildcard:
                  ecs.process.command_line.wc:
                    value: '*ntds.dit*'
                    case_insensitive: true
              - wildcard:
                  ecs.process.command_line.wc:
                    value: '*ntdsutil*'
                    case_insensitive: true
              - wildcard:
                  ecs.process.command_line.wc:
                    value: '*esentutl*'
                    case_insensitive: true
              minimum_should_match: 1
          - term:
              ecs.file.name:
                value: ntds.dit
                case_insensitive: true
          minimum_should_match: 1
- name: replication_abuse
  query: 4662 Replicating Get Changes
  look_for: Security 4662 directory-service access with replication extended rights — DS-Replication-Get-Changes-All
    {1131f6aa-9c07-11d1-f79f-00c04fc2dcd2} and related GUIDs requested by a NON-DC account = DCSync. Legitimate
    replication only ever happens between DC machine accounts.
  corroborate: 4648/4624 logon by the same account + subsequent NTLM use (4768/4769 absent — DCSync skips Kerberos
    tickets)
  requires:
    families:
    - evtxecmd
    - hayabusa
  es_source:
    bool:
      filter:
      - bool:
          filter:
          - term:
              ecs.winlog.channel:
                value: Security
                case_insensitive: true
          - terms:
              event_id:
              - '4662'
  source: Security 4662
  search:
    basis:
    - attack:DET0594
    events:
    - channel: Security
      codes:
      - '4662'
    any:
    - field: text
      contains:
      - 1131f6aa-9c07-11d1-f79f-00c04fc2dcd2
      - 1131f6ad-9c07-11d1-f79f-00c04fc2dcd2
      - 89e95b76-444d-4c62-991a-0facbeda640c
    none:
    - field: ecs.winlog.event_data.SubjectUserName
      endswith:
      - $
  es:
    bool:
      filter:
      - bool:
          filter:
          - term:
              ecs.winlog.channel:
                value: Security
                case_insensitive: true
          - terms:
              event_id:
              - '4662'
      - bool:
          should:
          - wildcard:
              text.wc:
                value: '*1131f6aa-9c07-11d1-f79f-00c04fc2dcd2*'
                case_insensitive: true
          - wildcard:
              text.wc:
                value: '*1131f6ad-9c07-11d1-f79f-00c04fc2dcd2*'
                case_insensitive: true
          - wildcard:
              text.wc:
                value: '*89e95b76-444d-4c62-991a-0facbeda640c*'
                case_insensitive: true
          minimum_should_match: 1
      must_not:
      - wildcard:
          ecs.winlog.event_data.SubjectUserName.wc:
            value: '*$'
            case_insensitive: true
- name: ntds_ifm_path
  query: ntdsutil activate instance OR ifm OR install from media
  look_for: ntdsutil "ac i ntds" + "ifm" creates a media-install snapshot that copies NTDS.dit + SYSTEM hive — a
    quieter theft path than vssadmin because it looks like legitimate DC provisioning.
  pivot: CommandLine
  requires:
    families:
    - evtxecmd
    - hayabusa
  es_source:
    bool:
      filter:
      - bool:
          should:
          - bool:
              filter:
              - term:
                  ecs.winlog.channel:
                    value: Microsoft-Windows-Sysmon/Operational
                    case_insensitive: true
              - terms:
                  event_id:
                  - '1'
          - bool:
              filter:
              - term:
                  ecs.winlog.channel:
                    value: Security
                    case_insensitive: true
              - terms:
                  event_id:
                  - '4688'
          minimum_should_match: 1
  source: Sysmon 1; Security 4688
  search:
    basis:
    - attack:DET0586
    - evtx-map
    events:
    - channel: Microsoft-Windows-Sysmon/Operational
      codes:
      - '1'
    - channel: Security
      codes:
      - '4688'
    all:
    - field: ecs.process.command_line
      contains:
      - ntdsutil
    - field: ecs.process.command_line
      contains:
      - ifm
  es:
    bool:
      filter:
      - bool:
          should:
          - bool:
              filter:
              - term:
                  ecs.winlog.channel:
                    value: Microsoft-Windows-Sysmon/Operational
                    case_insensitive: true
              - terms:
                  event_id:
                  - '1'
          - bool:
              filter:
              - term:
                  ecs.winlog.channel:
                    value: Security
                    case_insensitive: true
              - terms:
                  event_id:
                  - '4688'
          minimum_should_match: 1
      - wildcard:
          ecs.process.command_line.wc:
            value: '*ntdsutil*'
            case_insensitive: true
      - wildcard:
          ecs.process.command_line.wc:
            value: '*ifm*'
            case_insensitive: true
- name: secretsdump_artifacts
  query: secretsdump impacket- secretsdump.py
  look_for: secretsdump/impacket execution strings in process or script logs.
  requires:
    families:
    - evtxecmd
    - hayabusa
  es_source:
    bool:
      filter:
      - bool:
          should:
          - bool:
              filter:
              - term:
                  ecs.winlog.channel:
                    value: Microsoft-Windows-Sysmon/Operational
                    case_insensitive: true
              - terms:
                  event_id:
                  - '1'
          - bool:
              filter:
              - term:
                  ecs.winlog.channel:
                    value: Security
                    case_insensitive: true
              - terms:
                  event_id:
                  - '4688'
          - bool:
              filter:
              - term:
                  ecs.winlog.channel:
                    value: Microsoft-Windows-PowerShell/Operational
                    case_insensitive: true
              - terms:
                  event_id:
                  - '4104'
          minimum_should_match: 1
  source: Sysmon 1; Security 4688; PowerShell/Operational 4104
  search:
    basis:
    - attack:DET0586
    - attack:DET0455
    events:
    - channel: Microsoft-Windows-Sysmon/Operational
      codes:
      - '1'
    - channel: Security
      codes:
      - '4688'
    - channel: Microsoft-Windows-PowerShell/Operational
      codes:
      - '4104'
    any:
    - field: ecs.process.command_line
      contains:
      - secretsdump
      - impacket
    - field: ecs.winlog.event_data.ScriptBlockText
      contains:
      - secretsdump
  es:
    bool:
      filter:
      - bool:
          should:
          - bool:
              filter:
              - term:
                  ecs.winlog.channel:
                    value: Microsoft-Windows-Sysmon/Operational
                    case_insensitive: true
              - terms:
                  event_id:
                  - '1'
          - bool:
              filter:
              - term:
                  ecs.winlog.channel:
                    value: Security
                    case_insensitive: true
              - terms:
                  event_id:
                  - '4688'
          - bool:
              filter:
              - term:
                  ecs.winlog.channel:
                    value: Microsoft-Windows-PowerShell/Operational
                    case_insensitive: true
              - terms:
                  event_id:
                  - '4104'
          minimum_should_match: 1
      - bool:
          should:
          - bool:
              should:
              - wildcard:
                  ecs.process.command_line.wc:
                    value: '*secretsdump*'
                    case_insensitive: true
              - wildcard:
                  ecs.process.command_line.wc:
                    value: '*impacket*'
                    case_insensitive: true
              minimum_should_match: 1
          - wildcard:
              ecs.winlog.event_data.ScriptBlockText.wc:
                value: '*secretsdump*'
                case_insensitive: true
          minimum_should_match: 1
negative: No shadow-copy, reg-save, or NTDS access artifacts → database theft path unlikely; check LSASS memory
  access or DCSync-only paths.
confidence_rules:
  high: vss create + dit/sam copy artifact + subsequent shadow deletion
  medium: reg save sam/system without admin-context corroboration
  low: single vssadmin invocation (may be admin maintenance)
mitre:
- T1003.002
- T1003.003
- T1003.004
- T1003.006
caveats:
- Admin maintenance (backup, audit) legitimately runs vssadmin/ntdsutil — corroborate account + window.
- 4662 replication events are noisy on DCs — filter to non-DC machine accounts.
