skill: sam_ntds_credential_theft
title: SAM/NTDS credential database theft
description: >-
  Detect theft of the SAM database (local creds), NTDS.dit (domain creds), or
  DCSync replication abuse.
trigger:
  families: [evtx, sysmon, security, registry, mft, hayabusa]
  keywords: [sam, ntds, dcsync, vssadmin, shadow, secretsdump, esentutl]
  techniques: [T1003.002, T1003.003, T1003.004, T1003.006, T1207]
steps:
  - name: vss_shadow_copy
    query: "vssadmin create shadow OR vssadmin delete shadows OR diskshadow"
    look_for: >-
      Shadow copy creation/deletion around the suspected theft window —
      attackers copy locked SAM/SYSTEM/NTDS from a shadow.
    pivot: CommandLine
  - name: sam_reg_export
    query: "reg save sam OR reg save system OR reg save security"
    look_for: 'reg save HKLM\SAM / HKLM\SYSTEM / HKLM\SECURITY to a writable path.'
    pivot: CommandLine
  - name: ntds_copy
    query: "ntds.dit ntdsutil esentutl"
    look_for: ntdsutil/esentutl copies of NTDS.dit or the dit file touched on a DC.
    pivot: FileName
  - name: replication_abuse
    query: "4662 Replicating Get Changes"
    look_for: >-
      Security 4662 with replication GUIDs requested by a non-DC account —
      DCSync indicator.
    corroborate: 4648/4624 logon by the same account
  - name: secretsdump_artifacts
    query: "secretsdump impacket- secretsdump.py"
    look_for: secretsdump/impacket execution strings in process or script logs.
negative: >-
  No shadow-copy, reg-save, or NTDS access artifacts → database theft path
  unlikely; check LSASS memory access or DCSync-only paths.
confidence_rules:
  high: vss create + dit/sam copy artifact + subsequent shadow deletion
  medium: reg save sam/system without admin-context corroboration
  low: single vssadmin invocation (may be admin maintenance)
mitre: [T1003.002, T1003.003, T1003.004, T1003.006]
caveats:
  - "Admin maintenance (backup, audit) legitimately runs vssadmin/ntdsutil — corroborate account + window."
  - "4662 replication events are noisy on DCs — filter to non-DC machine accounts."
