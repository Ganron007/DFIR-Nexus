skill: discovery_recon
title: Discovery — recon commands and internal enumeration
description: Detect internal reconnaissance — whoami, net commands, system info, domain enumeration, network scanning.
trigger:
  families:
  - evtx
  - sysmon
  - powershell
  - prefetch
  - cmd
  keywords:
  - recon
  - enum
  - whoami
  - systeminfo
  - ipconfig
  - netstat
  - arp
  - nltest
  techniques:
  - T1033
  - T1082
  - T1087
  - T1018
  - T1069
  - T1057
steps:
- name: whoami_chains
  query: whoami.exe OR whoami /all OR whoami /priv
  look_for: whoami runs by non-interactive processes or in quick succession.
  pivot: CommandLine
  requires:
    families:
    - evtxecmd
    - hayabusa
  es_source:
    bool:
      filter:
      - bool:
          should:
          - bool:
              filter:
              - term:
                  ecs.winlog.channel:
                    value: Microsoft-Windows-Sysmon/Operational
                    case_insensitive: true
              - terms:
                  event_id:
                  - '1'
          - bool:
              filter:
              - term:
                  ecs.winlog.channel:
                    value: Security
                    case_insensitive: true
              - terms:
                  event_id:
                  - '4688'
          minimum_should_match: 1
  source: Sysmon 1; Security 4688
  search:
    basis:
    - attack:DET0093
    - manifest
    events:
    - channel: Microsoft-Windows-Sysmon/Operational
      codes:
      - '1'
    - channel: Security
      codes:
      - '4688'
    all:
    - field: ecs.process.executable
      endswith:
      - \whoami.exe
  es:
    bool:
      filter:
      - bool:
          should:
          - bool:
              filter:
              - term:
                  ecs.winlog.channel:
                    value: Microsoft-Windows-Sysmon/Operational
                    case_insensitive: true
              - terms:
                  event_id:
                  - '1'
          - bool:
              filter:
              - term:
                  ecs.winlog.channel:
                    value: Security
                    case_insensitive: true
              - terms:
                  event_id:
                  - '4688'
          minimum_should_match: 1
      - wildcard:
          ecs.process.executable.wc:
            value: '*\\whoami.exe'
            case_insensitive: true
- name: net_commands
  query: net user OR net group OR net localgroup OR net view OR net share
  look_for: net user/group/localgroup/view/share — internal user and share enumeration.
  pivot: CommandLine
  requires:
    families:
    - evtxecmd
    - hayabusa
  es_source:
    bool:
