# kb: d_c45cc28b4bdd:c0004 (EIR attack lifecycle — Internal Recon phase:
#      critical-system identification, system enumeration, account/password
#      enumeration) | d_f9d99a1b61b6:c0001 (EIR recon command set:
#      net localgroup, net group /domain, net sessions, quser, net file)
# kb: EIR M4 (discovery hunting), CCD M8 (threat-hunt enumeration patterns)
skill: discovery_recon
title: Discovery — recon commands and internal enumeration
description: Detect internal reconnaissance — whoami, net commands, system info, domain
  enumeration, network scanning.
trigger:
  families:
  - evtx
  - sysmon
  - powershell
  - prefetch
  - cmd
  keywords:
  - recon
  - enum
  - whoami
  - systeminfo
  - ipconfig
  - netstat
  - arp
  - nltest
  techniques:
  - T1033
  - T1082
  - T1087
  - T1018
  - T1069
  - T1057
steps:
- name: whoami_chains
  query: whoami.exe OR whoami /all OR whoami /priv
  look_for: whoami runs by non-interactive processes or in quick succession.
  pivot: CommandLine
  es:
    bool:
      should:
      - wildcard:
          fields.file_path.kw:
            value: '*whoami.exe*'
            case_insensitive: true
      - wildcard:
          text.wc:
            value: '*whoami /all*'
            case_insensitive: true
      - wildcard:
          text.wc:
            value: '*whoami /priv*'
            case_insensitive: true
      minimum_should_match: 1
  requires:
    families: &id001
    - evtx
    - sysmon
    - powershell
    - prefetch
    - cmd
  es_text_only_reason:
  - 'whoami /all: free phrase; the step''s pivot names no registry column'
  - 'whoami /priv: free phrase; the step''s pivot names no registry column'
- name: net_commands
  query: net user OR net group OR net localgroup OR net view OR net share
  look_for: net user/group/localgroup/view/share — internal user and share enumeration.
  pivot: CommandLine
  es:
    bool:
      should:
      - wildcard:
          text.wc:
            value: '*net user*'
            case_insensitive: true
      - wildcard:
          text.wc:
            value: '*net group*'
            case_insensitive: true
      - wildcard:
          text.wc:
            value: '*net localgroup*'
            case_insensitive: true
      - wildcard:
          text.wc:
            value: '*net view*'
            case_insensitive: true
      - wildcard:
          text.wc:
            value: '*net share*'
            case_insensitive: true
      minimum_should_match: 1
  requires:
    families: *id001
  es_text_only_reason:
  - 'net user: free phrase; the step''s pivot names no registry column'
  - 'net group: free phrase; the step''s pivot names no registry column'
  - 'net localgroup: free phrase; the step''s pivot names no registry column'
  - 'net view: free phrase; the step''s pivot names no registry column'
  - 'net share: free phrase; the step''s pivot names no registry column'
- name: system_info
  query: systeminfo OR hostname OR ver
  look_for: systeminfo/hostname — basic host recon.
  pivot: CommandLine
  es:
    bool:
      should:
      - wildcard:
          text.wc:
            value: '*systeminfo*'
            case_insensitive: true
      - wildcard:
          text.wc:
            value: '*hostname*'
            case_insensitive: true
      - wildcard:
          text.wc:
            value: '*ver*'
            case_insensitive: true
      minimum_should_match: 1
  requires:
    families: *id001
  es_text_only_reason:
  - 'systeminfo: free phrase; the step''s pivot names no registry column'
  - 'hostname: free phrase; the step''s pivot names no registry column'
  - 'ver: free phrase; the step''s pivot names no registry column'
- name: ipconfig_route
  query: ipconfig /all OR route print OR arp -a
  look_for: Network config discovery — routing/ARP table dumps.
  pivot: CommandLine
  es:
    bool:
      should:
      - wildcard:
          text.wc:
            value: '*ipconfig /all*'
            case_insensitive: true
      - wildcard:
          text.wc:
            value: '*route print*'
            case_insensitive: true
      - wildcard:
          text.wc:
            value: '*arp -a*'
            case_insensitive: true
      minimum_should_match: 1
  requires:
    families: *id001
  es_text_only_reason:
  - 'ipconfig /all: free phrase; the step''s pivot names no registry column'
  - 'route print: free phrase; the step''s pivot names no registry column'
  - 'arp -a: free phrase; the step''s pivot names no registry column'
- name: domain_enum
  query: nltest /dclist OR dsquery OR net group "Domain Admins"
  look_for: Domain-controller listing and privileged-group enumeration.
  pivot: CommandLine
  es:
    bool:
      should:
      - wildcard:
          text.wc:
            value: '*nltest /dclist*'
            case_insensitive: true
      - wildcard:
          text.wc:
            value: '*dsquery*'
            case_insensitive: true
      - wildcard:
          text.wc:
            value: '*net group Domain Admins*'
            case_insensitive: true
      minimum_should_match: 1
  requires:
    families: *id001
  es_text_only_reason:
  - 'nltest /dclist: free phrase; the step''s pivot names no registry column'
  - 'dsquery: free phrase; the step''s pivot names no registry column'
  - 'net group Domain Admins: free phrase; the step''s pivot names no registry column'
- name: session_file_enum
  query: net session OR net file OR quser OR qwinsta
  look_for: 'Session/share enumeration — net session, net file, quser/qwinsta. EIR''s
    recon set: attackers enumerate who is logged on and what files are open before
    moving — these commands map live sessions and open handles, not just static config.'
  pivot: CommandLine
  es:
    bool:
      should:
      - wildcard:
          text.wc:
            value: '*net session*'
            case_insensitive: true
      - wildcard:
          text.wc:
            value: '*net file*'
            case_insensitive: true
      - wildcard:
          text.wc:
            value: '*quser*'
            case_insensitive: true
      - wildcard:
          text.wc:
            value: '*qwinsta*'
            case_insensitive: true
      minimum_should_match: 1
  requires:
    families: *id001
  es_text_only_reason:
  - 'net session: free phrase; the step''s pivot names no registry column'
  - 'net file: free phrase; the step''s pivot names no registry column'
  - 'quser: free phrase; the step''s pivot names no registry column'
  - 'qwinsta: free phrase; the step''s pivot names no registry column'
- name: tasklist_scan
  query: tasklist OR tasklist /svc OR qprocess
  look_for: Process/service enumeration for target identification.
  pivot: CommandLine
  es:
    bool:
      should:
      - wildcard:
          text.wc:
            value: '*tasklist*'
            case_insensitive: true
      - wildcard:
          text.wc:
            value: '*tasklist /svc*'
            case_insensitive: true
      - wildcard:
          text.wc:
            value: '*qprocess*'
            case_insensitive: true
      minimum_should_match: 1
  requires:
    families: *id001
  es_text_only_reason:
  - 'tasklist: free phrase; the step''s pivot names no registry column'
  - 'tasklist /svc: free phrase; the step''s pivot names no registry column'
  - 'qprocess: free phrase; the step''s pivot names no registry column'
negative: No recon-command artifacts → the attacker may have used a C2 implant with
  built-in discovery (no shell commands) or skipped enumeration.
confidence_rules:
  high: multiple distinct recon commands in a short window from one process
  medium: single recon command by an unexpected parent
  low: admin tools run by admins during maintenance
mitre:
- T1033
- T1082
- T1087
- T1018
- T1069
