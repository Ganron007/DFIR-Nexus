                    case_insensitive: true
              - terms:
                  event_id:
                  - '4688'
          minimum_should_match: 1
      - bool:
          should:
          - wildcard:
              ecs.process.executable.wc:
                value: '*\\net.exe'
                case_insensitive: true
          - wildcard:
              ecs.process.executable.wc:
                value: '*\\net1.exe'
                case_insensitive: true
          minimum_should_match: 1
      - bool:
          should:
          - wildcard:
              ecs.process.command_line.wc:
                value: '* user*'
                case_insensitive: true
          - wildcard:
              ecs.process.command_line.wc:
                value: '* group*'
                case_insensitive: true
          - wildcard:
              ecs.process.command_line.wc:
                value: '* localgroup*'
                case_insensitive: true
          - wildcard:
              ecs.process.command_line.wc:
                value: '* view*'
                case_insensitive: true
          - wildcard:
              ecs.process.command_line.wc:
                value: '* share*'
                case_insensitive: true
          minimum_should_match: 1
