skill: email_phishing
title: Phishing email analysis — headers, auth checks, payload chain
description: 'Analyze a suspected phishing email: authenticate the sender (SPF/DKIM/DMARC + Received-chain), extract
  and defang URLs/attachments, then pivot to host-side delivery and execution artifacts — the email is the vector,
  the host is the scene.'
trigger:
  families:
  - email
  - eml
  - evtx
  - prefetch
  - lnk
  - mft
  keywords:
  - phish
  - email
  - eml
  - attachment
  - link
  - spoof
  - dkim
  - spf
  - dmarc
  - invoice
  - lure
  techniques:
  - T1566.001
  - T1566.002
  - T1204.001
  - T1204.002
steps:
- name: sender_authentication
  query: spf OR dkim OR dmarc OR received OR return-path
  look_for: 'Authenticate first: SPF pass/fail on the connecting IP, DKIM signature validity, DMARC alignment between
    From: and Return-Path/SPF domains. Failures prove spoofing; passes on a lookalike/compromised domain still prove
    the infrastructure used.'
  pivot: Received
  requires:
    families:
    - email
  es_source:
    bool:
      filter:
      - bool:
          should:
          - terms:
              family:
              - email
          - terms:
              importer_leaf:
              - nexus.ingest.generic.email_import.EmailImporter
          minimum_should_match: 1
  source: families email
  search:
    families:
    - email
    any:
    - field: text
      contains:
      - spf=fail
      - spf=softfail
      - dkim=fail
      - dmarc=fail
      - Received-SPF
  es:
    bool:
      filter:
      - bool:
          should:
          - terms:
              family:
              - email
          - terms:
              importer_leaf:
              - nexus.ingest.generic.email_import.EmailImporter
          minimum_should_match: 1
      - bool:
          should:
          - wildcard:
              text.wc:
                value: '*spf=fail*'
                case_insensitive: true
          - wildcard:
              text.wc:
                value: '*spf=softfail*'
                case_insensitive: true
          - wildcard:
              text.wc:
                value: '*dkim=fail*'
                case_insensitive: true
          - wildcard:
              text.wc:
                value: '*dmarc=fail*'
                case_insensitive: true
          - wildcard:
              text.wc:
                value: '*Received-SPF*'
                case_insensitive: true
          minimum_should_match: 1
- name: header_chain
  query: 'Received: OR X-Originating OR message-id'
  look_for: 'Walk the Received: chain bottom-up (originating MTA → hops → your gateway) — the first untrusted hop
    reveals the true source IP. X-Originating-IP and mismatched HELO/hostnames expose relays.'
  pivot: Received
  requires:
    families:
    - email
  es_source:
    bool:
      filter:
      - bool:
          should:
          - terms:
              family:
              - email
          - terms:
              importer_leaf:
              - nexus.ingest.generic.email_import.EmailImporter
          minimum_should_match: 1
  source: families email
  search:
    families:
    - email
    any:
    - field: text
      contains:
      - X-Originating-IP
      - X-Sender-IP
  es:
    bool:
      filter:
      - bool:
          should:
          - terms:
              family:
              - email
          - terms:
              importer_leaf:
              - nexus.ingest.generic.email_import.EmailImporter
          minimum_should_match: 1
      - bool:
          should:
          - wildcard:
              text.wc:
                value: '*X-Originating-IP*'
                case_insensitive: true
          - wildcard:
              text.wc:
                value: '*X-Sender-IP*'
                case_insensitive: true
          minimum_should_match: 1
- name: url_extraction
  query: http OR https OR click OR link
  look_for: Extract every URL — display text vs href mismatches, punycode/ homoglyph domains, URL shorteners, credential-harvest
    pages. The URL is evidence even when the payload is gone.
  pivot: URL
  kind: procedure
  procedure_reason: extracting every URL and comparing display text with the link target is read from each message
    body; nearly every message holds a URL, so a search for one returns the mailbox.
- name: attachment_triage
  query: attachment OR .iso OR .lnk OR .docm OR .html OR .zip
  look_for: 'Attachment class decides the risk: ISO/IMG (MOTW bypass → mounts as drive), LNK (double-click execution),
    Office macros (.docm/ .xlsm), HTML smuggling (.html that writes the payload locally), archived EXEs. Hash the
    attachment, check VT/defang, record the payload chain.'
  pivot: FileName
  requires:
    families:
    - email
  es_source:
    bool:
      filter:
      - bool:
          should:
          - terms:
              family:
              - email
          - terms:
              importer_leaf:
              - nexus.ingest.generic.email_import.EmailImporter
          minimum_should_match: 1
  source: families email
  search:
    families:
    - email
    any:
    - field: text
      contains:
      - .iso
      - .img
      - .lnk
      - .docm
      - .xlsm
      - .hta
      - .vbs
      - .js
      - .one
      - .chm
  es:
    bool:
      filter:
      - bool:
          should:
          - terms:
              family:
              - email
          - terms:
              importer_leaf:
              - nexus.ingest.generic.email_import.EmailImporter
          minimum_should_match: 1
      - bool:
          should:
          - wildcard:
              text.wc:
                value: '*.iso*'
                case_insensitive: true
          - wildcard:
              text.wc:
                value: '*.img*'
                case_insensitive: true
          - wildcard:
              text.wc:
                value: '*.lnk*'
                case_insensitive: true
          - wildcard:
              text.wc:
                value: '*.docm*'
                case_insensitive: true
          - wildcard:
              text.wc:
                value: '*.xlsm*'
                case_insensitive: true
          - wildcard:
              text.wc:
                value: '*.hta*'
                case_insensitive: true
          - wildcard:
              text.wc:
                value: '*.vbs*'
                case_insensitive: true
          - wildcard:
              text.wc:
                value: '*.js*'
                case_insensitive: true
          - wildcard:
              text.wc:
                value: '*.one*'
                case_insensitive: true
          - wildcard:
              text.wc:
                value: '*.chm*'
                case_insensitive: true
          minimum_should_match: 1
- name: delivery_artifact
  query: Zone.Identifier OR downloads OR attachment
  look_for: 'Host-side proof of delivery: Zone.Identifier ADS on the dropped file (ZoneId=3 internet; note ISO/zip
    children may not inherit MOTW — the bypass), file in Downloads/Temp/AppData via MFT/USN, Outlook temp-attachment
    paths.'
  pivot: FileName
  corroborate: email-received time ↔ file-write time ↔ execution time = complete delivery chain
  requires:
    families:
    - mftecmd
  es_source:
    bool:
      filter:
      - terms:
          family:
          - mftecmd
  source: families mftecmd
  search:
    families:
    - mftecmd
    all:
    - field: ecs.file.name
      endswith:
      - :Zone.Identifier
    any:
    - field: ecs.file.path
      contains:
      - \Downloads\
      - \Content.Outlook\
      - \INetCache\
  es:
    bool:
      filter:
      - terms:
          family:
          - mftecmd
      - wildcard:
          ecs.file.name.wc:
            value: '*:Zone.Identifier'
            case_insensitive: true
      - bool:
          should:
          - wildcard:
              ecs.file.path.wc:
                value: '*\\Downloads\\*'
                case_insensitive: true
          - wildcard:
              ecs.file.path.wc:
                value: '*\\Content.Outlook\\*'
                case_insensitive: true
          - wildcard:
              ecs.file.path.wc:
                value: '*\\INetCache\\*'
                case_insensitive: true
          minimum_should_match: 1
- name: execution_chain
  query: explorer.exe OR mshta OR rundll32 OR powershell
  look_for: Did the user execute it? Child processes of explorer.exe (double- click) or OUTLOOK.EXE/winword (attachment
    open) → script interpreters → payload. Prefetch/AmCache confirm the binary ran.
  pivot: ParentImage
  requires:
    families:
    - kind:evtx
  es_source:
    bool:
      filter:
      - bool:
          should:
          - bool:
              filter:
              - term:
                  ecs.winlog.channel:
                    value: Microsoft-Windows-Sysmon/Operational
                    case_insensitive: true
              - terms:
                  event_id:
                  - '1'
          - bool:
              filter:
              - term:
                  ecs.winlog.channel:
                    value: Security
                    case_insensitive: true
              - terms:
                  event_id:
                  - '4688'
          minimum_should_match: 1
  source: Sysmon 1; Security 4688
  search:
    basis:
    - attack:DET0236
    - manifest
    events:
    - channel: Microsoft-Windows-Sysmon/Operational
      codes:
      - '1'
    - channel: Security
      codes:
      - '4688'
    all:
    - field: ecs.process.executable
      endswith:
      - \cmd.exe
      - \powershell.exe
      - \mshta.exe
      - \rundll32.exe
      - \wscript.exe
      - \cscript.exe
    any:
    - field: ecs.process.parent.executable
      endswith:
      - \outlook.exe
      - \winword.exe
      - \excel.exe
      - \explorer.exe
    - field: ecs.winlog.event_data.ParentProcessName
      endswith:
      - \outlook.exe
      - \winword.exe
      - \excel.exe
      - \explorer.exe
  es:
    bool:
      filter:
      - bool:
          should:
          - bool:
              filter:
              - term:
                  ecs.winlog.channel:
                    value: Microsoft-Windows-Sysmon/Operational
                    case_insensitive: true
              - terms:
                  event_id:
                  - '1'
          - bool:
              filter:
              - term:
                  ecs.winlog.channel:
                    value: Security
                    case_insensitive: true
              - terms:
                  event_id:
                  - '4688'
          minimum_should_match: 1
      - bool:
          should:
          - wildcard:
              ecs.process.executable.wc:
                value: '*\\cmd.exe'
                case_insensitive: true
          - wildcard:
              ecs.process.executable.wc:
                value: '*\\powershell.exe'
                case_insensitive: true
          - wildcard:
              ecs.process.executable.wc:
                value: '*\\mshta.exe'
                case_insensitive: true
          - wildcard:
              ecs.process.executable.wc:
                value: '*\\rundll32.exe'
                case_insensitive: true
          - wildcard:
              ecs.process.executable.wc:
                value: '*\\wscript.exe'
                case_insensitive: true
          - wildcard:
              ecs.process.executable.wc:
                value: '*\\cscript.exe'
                case_insensitive: true
          minimum_should_match: 1
      - bool:
          should:
          - bool:
              should:
              - wildcard:
                  ecs.process.parent.executable.wc:
                    value: '*\\outlook.exe'
                    case_insensitive: true
              - wildcard:
                  ecs.process.parent.executable.wc:
                    value: '*\\winword.exe'
                    case_insensitive: true
              - wildcard:
                  ecs.process.parent.executable.wc:
                    value: '*\\excel.exe'
                    case_insensitive: true
              - wildcard:
                  ecs.process.parent.executable.wc:
                    value: '*\\explorer.exe'
                    case_insensitive: true
              minimum_should_match: 1
          - bool:
              should:
              - wildcard:
                  ecs.winlog.event_data.ParentProcessName.wc:
                    value: '*\\outlook.exe'
                    case_insensitive: true
              - wildcard:
                  ecs.winlog.event_data.ParentProcessName.wc:
                    value: '*\\winword.exe'
                    case_insensitive: true
              - wildcard:
                  ecs.winlog.event_data.ParentProcessName.wc:
                    value: '*\\excel.exe'
                    case_insensitive: true
              - wildcard:
                  ecs.winlog.event_data.ParentProcessName.wc:
                    value: '*\\explorer.exe'
                    case_insensitive: true
              minimum_should_match: 1
          minimum_should_match: 1
negative: No delivery artifact and no exec chain → the phish likely wasn't opened, was filtered, or the payload
  was blocked — a delivered-but-unopened phish is still reportable (user-awareness finding, not compromise).
confidence_rules:
  high: auth-fail or lookalike + payload attachment + MOTW/delivery artifact + exec chain
  medium: authenticated-but-malicious link + click evidence without exec proof
  low: suspicious email with no delivery artifact (filtered/quarantined)
mitre:
- T1566.001
- T1566.002
- T1204
caveats:
- SPF/DKIM pass does NOT mean legitimate — attackers own domains and infrastructure; it means the mail came from
  where it claims.
- ISO/IMG/container attachments defeat MOTW — the outer file may lack Zone.Identifier while contents execute; check
  the mount/child artifacts.
- A deleted email isn't gone — recover from OST/PST, mailbox dumpster, gateway quarantine, or journaling before
  concluding 'not found'.
- Report 'delivered but unopened' separately from 'executed' — they are different findings with different response
  actions.
