caveats:
- SPF/DKIM pass does NOT mean legitimate — attackers own domains and infrastructure;
  it means the mail came from where it claims.
- ISO/IMG/container attachments defeat MOTW — the outer file may lack Zone.Identifier
  while contents execute; check the mount/child artifacts.
- A deleted email isn't gone — recover from OST/PST, mailbox dumpster, gateway quarantine,
  or journaling before concluding 'not found'.
- Report 'delivered but unopened' separately from 'executed' — they are different
  findings with different response actions.
