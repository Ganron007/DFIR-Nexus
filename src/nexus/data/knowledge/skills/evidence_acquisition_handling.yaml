caveats:
- 'Power state decides the procedure: powered-on encrypted → live-triage BEFORE shutdown;
  powered-off → hiberfil/pagefile may still hold memory.'
- Never acquire to or analyze on the source media — writes to the evidence disk contaminate
  unallocated space.
- A triage image is not a disk image — say which one a finding came from; 'disk shows
  no X' is only valid for the scope actually acquired.
- Record the tool AND version — parser behavior changes between releases; reproducibility
  requires the exact toolchain.
