  look_for: Office/browser binaries spawning cmd/powershell/wscript — macro or exploit child-process chains.
  pivot: ParentImage
  requires:
    families:
    - kind:evtx
  es_source:
    bool:
      filter:
      - bool:
          should:
          - bool:
              filter:
              - term:
                  ecs.winlog.channel:
                    value: Microsoft-Windows-Sysmon/Operational
                    case_insensitive: true
              - terms:
                  event_id:
                  - '1'
          - bool:
              filter:
              - term:
                  ecs.winlog.channel:
                    value: Security
                    case_insensitive: true
              - terms:
                  event_id:
                  - '4688'
          minimum_should_match: 1
  source: Sysmon 1; Security 4688
  search:
    basis:
    - attack:DET0236
    - attack:DET0294
    - manifest
    events:
    - channel: Microsoft-Windows-Sysmon/Operational
      codes:
