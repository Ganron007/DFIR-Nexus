              - wildcard:
                  ecs.process.parent.executable.wc:
                    value: '*\\powerpnt.exe'
                    case_insensitive: true
              - wildcard:
                  ecs.process.parent.executable.wc:
                    value: '*\\outlook.exe'
                    case_insensitive: true
              - wildcard:
                  ecs.process.parent.executable.wc:
                    value: '*\\msaccess.exe'
                    case_insensitive: true
              - wildcard:
                  ecs.process.parent.executable.wc:
                    value: '*\\mspub.exe'
                    case_insensitive: true
              - wildcard:
                  ecs.process.parent.executable.wc:
