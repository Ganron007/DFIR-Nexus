skill: execution_anomaly
title: Execution anomalies — suspicious parentage, unsigned binaries, LOLBins
description: Detect anomalous execution — unsigned binaries, suspicious parent-child
  chains, LOLBin abuse, and process lineage analysis.
trigger:
  families:
  - prefetch
  - amcache
  - evtx
  - sysmon
  - pecmd
  - mft
  - appcompat
  keywords:
  - unsigned
  - anomaly
  - lolbin
  - rundll32
  - mshta
  - hollowing
  - spawn
  techniques:
  - T1218
  - T1059.005
  - T1106
  - T1055.001
steps:
- name: unsigned_execution
  query: prefetch amcache unsigned OR .exe
  look_for: Executables in prefetch/amcache without a signed counterpart — unsigned
    binaries in user-writable paths.
  pivot: ExecutableName
  es:
    bool:
      should:
      - wildcard:
          fields.ExecutableName.kw:
            value: '*prefetch amcache unsigned*'
            case_insensitive: true
      - wildcard:
          ecs.file.path:
            value: '*.exe*'
            case_insensitive: true
      minimum_should_match: 1
  requires:
    families: &id001
    - prefetch
    - amcache
    - evtx
    - sysmon
    - pecmd
    - mft
    - appcompat
- name: lolbin_abuse
  query: rundll32 regsvr32 mshta wscript cscript msbuild installutil regasm
  look_for: LOLBin execution with unexpected arguments or parents — rundll32 with
    unusual DLLs, mshta running remote scripts.
  pivot: CommandLine
  es:
    wildcard:
      fields.command_line.kw:
        value: '*rundll32 regsvr32 mshta wscript cscript msbuild installutil regasm*'
        case_insensitive: true
  requires:
    families: *id001
- name: suspicious_parentage
  query: winword.exe cmd.exe OR excel.exe powershell.exe OR wscript.exe
  look_for: Office/browser binaries spawning cmd/powershell/wscript — macro or exploit
    child-process chains.
  pivot: ParentImage
  es:
    bool:
      should:
      - bool:
          must:
          - wildcard:
              ecs.file.path:
                value: '*winword.exe*'
                case_insensitive: true
          - wildcard:
              ecs.file.path:
                value: '*cmd.exe*'
                case_insensitive: true
      - bool:
          must:
          - wildcard:
              ecs.file.path:
                value: '*excel.exe*'
                case_insensitive: true
          - wildcard:
              ecs.file.path:
                value: '*powershell.exe*'
                case_insensitive: true
      - wildcard:
          ecs.file.path:
            value: '*wscript.exe*'
            case_insensitive: true
      minimum_should_match: 1
  requires:
    families: *id001
- name: temp_exec
  query: \Temp\ OR \AppData\Local\Temp\ OR \Downloads\
  look_for: Executables running from temp/download paths — dropper pattern.
  pivot: Image
  es:
    bool:
      should:
      - wildcard:
          text.wc:
            value: '*\Temp\*'
            case_insensitive: true
      - wildcard:
          text.wc:
            value: '*\AppData\Local\Temp\*'
            case_insensitive: true
      - wildcard:
          text.wc:
            value: '*\Downloads\*'
            case_insensitive: true
      minimum_should_match: 1
  requires:
    families: *id001
  es_text_only_reason:
  - '\Temp\: free phrase; the step''s pivot names no registry column'
  - '\AppData\Local\Temp\: free phrase; the step''s pivot names no registry column'
  - '\Downloads\: free phrase; the step''s pivot names no registry column'
- name: process_injection_indicators
  query: CreateRemoteThread OR QueueUserAPC OR SetThreadContext
  look_for: Injection API sequences in process-access events.
  pivot: SourceImage
  es:
    bool:
      should:
      - wildcard:
          ecs.process.name:
            value: '*CreateRemoteThread*'
            case_insensitive: true
      - wildcard:
          ecs.process.name:
            value: '*QueueUserAPC*'
            case_insensitive: true
      - wildcard:
          ecs.process.name:
            value: '*SetThreadContext*'
            case_insensitive: true
      minimum_should_match: 1
  requires:
    families: *id001
- name: renamed_system_binary
  query: svchost OR smss OR csrss OR wininit
  look_for: System process names executing from non-System32 paths.
  corroborate: prefetch/amcache entry in user-writable path
  es:
    bool:
      should:
      - wildcard:
          text.wc:
            value: '*svchost*'
            case_insensitive: true
      - wildcard:
          text.wc:
            value: '*smss*'
            case_insensitive: true
      - wildcard:
          text.wc:
            value: '*csrss*'
            case_insensitive: true
      - wildcard:
          text.wc:
            value: '*wininit*'
            case_insensitive: true
      minimum_should_match: 1
  requires:
    families: *id001
  es_text_only_reason:
  - 'svchost: free phrase; the step''s pivot names no registry column'
  - 'smss: free phrase; the step''s pivot names no registry column'
  - 'csrss: free phrase; the step''s pivot names no registry column'
  - 'wininit: free phrase; the step''s pivot names no registry column'
- name: artifact_cross_validation
  query: prefetch OR shimcache OR amcache OR bam OR userassist OR srum
  look_for: 'No single artifact is proof — cross-validate execution claims across
    the stack: Prefetch (first/last run + count), AmCache (full path + SHA1 + first-seen),
    ShimCache (path + mod time, proves presence not exec), BAM (per-user exec + timestamp),
    UserAssist (GUI exec + run count, ROT13 values), SRUM (process runtime + network
    bytes). An exec claim backed by 2+ artifacts is far stronger than one.'
  corroborate: same binary appearing in prefetch AND amcache AND bam = robust execution
    evidence
  es:
    bool:
      should:
      - wildcard:
          text.wc:
            value: '*prefetch*'
            case_insensitive: true
      - wildcard:
          text.wc:
            value: '*shimcache*'
            case_insensitive: true
      - wildcard:
          text.wc:
            value: '*amcache*'
            case_insensitive: true
      - wildcard:
          text.wc:
            value: '*bam*'
            case_insensitive: true
      - wildcard:
          text.wc:
            value: '*userassist*'
            case_insensitive: true
      - wildcard:
          text.wc:
            value: '*srum*'
            case_insensitive: true
      minimum_should_match: 1
  requires:
    families: *id001
  es_text_only_reason:
  - 'prefetch: free phrase; the step''s pivot names no registry column'
  - 'shimcache: free phrase; the step''s pivot names no registry column'
  - 'amcache: free phrase; the step''s pivot names no registry column'
  - 'bam: free phrase; the step''s pivot names no registry column'
  - 'userassist: free phrase; the step''s pivot names no registry column'
  - 'srum: free phrase; the step''s pivot names no registry column'
negative: No unsigned binaries or suspicious parentage → execution was clean; the
  compromise may be living-off-the-land only or in memory.
confidence_rules:
  high: unsigned binary + suspicious parent + network artifact
  medium: LOLBin with unusual args or temp-path exec
  low: single unsigned exec in a developer/build context
mitre:
- T1218
- T1059.005
- T1106
caveats:
- Developers and IT tools run unsigned binaries — check signer and path context before
  flagging.
- Prefetch only proves execution, not intent — corroborate with CommandLine or network
  evidence.
primary_families:
- amcache
