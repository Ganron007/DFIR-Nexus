                    case_insensitive: true
              - terms:
                  event_id:
                  - '1'
          - bool:
              filter:
              - term:
                  ecs.winlog.channel:
                    value: Security
                    case_insensitive: true
              - terms:
                  event_id:
                  - '4688'
          minimum_should_match: 1
      - bool:
          should:
          - wildcard:
              ecs.process.executable.wc:
                value: '*\\cmd.exe'
                case_insensitive: true
          - wildcard:
              ecs.process.executable.wc:
                value: '*\\powershell.exe'
                case_insensitive: true
          - wildcard:
              ecs.process.executable.wc:
                value: '*\\pwsh.exe'
                case_insensitive: true
          - wildcard:
              ecs.process.executable.wc:
                value: '*\\wscript.exe'
                case_insensitive: true
          - wildcard:
              ecs.process.executable.wc:
                value: '*\\cscript.exe'
                case_insensitive: true
          - wildcard:
              ecs.process.executable.wc:
                value: '*\\mshta.exe'
                case_insensitive: true
          - wildcard:
              ecs.process.executable.wc:
                value: '*\\rundll32.exe'
                case_insensitive: true
          - wildcard:
              ecs.process.executable.wc:
                value: '*\\regsvr32.exe'
                case_insensitive: true
