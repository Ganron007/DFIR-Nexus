- name: temp_exec
  query: \Temp\ OR \AppData\Local\Temp\ OR \Downloads\
  look_for: Executables running from temp/download paths — dropper pattern.
  pivot: Image
  requires:
    families:
    - kind:evtx
  es_source:
    bool:
      filter:
      - bool:
          should:
          - bool:
              filter:
              - term:
                  ecs.winlog.channel:
                    value: Microsoft-Windows-Sysmon/Operational
                    case_insensitive: true
              - terms:
                  event_id:
                  - '1'
          - bool:
              filter:
              - term:
                  ecs.winlog.channel:
                    value: Security
                    case_insensitive: true
              - terms:
                  event_id:
                  - '4688'
          minimum_should_match: 1
  source: Sysmon 1; Security 4688
  search:
    basis:
    - attack:DET0294
    - manifest
    events:
    - channel: Microsoft-Windows-Sysmon/Operational
      codes:
      - '1'
    - channel: Security
      codes:
      - '4688'
    any:
    - field: ecs.process.executable
      contains:
      - \AppData\Local\Temp\
      - \Windows\Temp\
      - \Downloads\
      - \Users\Public\
  es:
    bool:
      filter:
      - bool:
          should:
          - bool:
              filter:
              - term:
                  ecs.winlog.channel:
                    value: Microsoft-Windows-Sysmon/Operational
                    case_insensitive: true
              - terms:
                  event_id:
                  - '1'
          - bool:
              filter:
              - term:
                  ecs.winlog.channel:
                    value: Security
                    case_insensitive: true
              - terms:
                  event_id:
                  - '4688'
          minimum_should_match: 1
      - bool:
          should:
          - wildcard:
              ecs.process.executable.wc:
                value: '*\\AppData\\Local\\Temp\\*'
                case_insensitive: true
          - wildcard:
              ecs.process.executable.wc:
                value: '*\\Windows\\Temp\\*'
                case_insensitive: true
          - wildcard:
              ecs.process.executable.wc:
                value: '*\\Downloads\\*'
                case_insensitive: true
          - wildcard:
              ecs.process.executable.wc:
                value: '*\\Users\\Public\\*'
                case_insensitive: true
          minimum_should_match: 1
- name: process_injection_indicators
  query: CreateRemoteThread OR QueueUserAPC OR SetThreadContext
  look_for: Injection API sequences in process-access events.
  pivot: SourceImage
  requires:
    families:
    - kind:evtx
  es_source:
    bool:
      filter:
      - bool:
          filter:
          - term:
              ecs.winlog.channel:
                value: Microsoft-Windows-Sysmon/Operational
                case_insensitive: true
          - terms:
              event_id:
              - '8'
              - '10'
  source: Sysmon 8, 10
  search:
    basis:
    - attack:DET0508
    - evtx-map
    events:
    - channel: Microsoft-Windows-Sysmon/Operational
      codes:
      - '8'
      - '10'
    any:
    - field: event_id
      is:
      - '8'
    - field: ecs.winlog.event_data.CallTrace
      contains:
      - UNKNOWN
  es:
    bool:
      filter:
      - bool:
          filter:
          - term:
              ecs.winlog.channel:
                value: Microsoft-Windows-Sysmon/Operational
                case_insensitive: true
          - terms:
              event_id:
              - '8'
              - '10'
      - bool:
          should:
          - term:
              event_id: '8'
          - wildcard:
              ecs.winlog.event_data.CallTrace.wc:
                value: '*UNKNOWN*'
                case_insensitive: true
          minimum_should_match: 1
- name: renamed_system_binary
  query: svchost OR smss OR csrss OR wininit
  look_for: System process names executing from non-System32 paths.
  corroborate: prefetch/amcache entry in user-writable path
  requires:
    families:
    - kind:evtx
  es_source:
    bool:
      filter:
      - bool:
          should:
          - bool:
              filter:
              - term:
                  ecs.winlog.channel:
                    value: Microsoft-Windows-Sysmon/Operational
                    case_insensitive: true
              - terms:
                  event_id:
                  - '1'
          - bool:
              filter:
              - term:
                  ecs.winlog.channel:
                    value: Security
                    case_insensitive: true
              - terms:
                  event_id:
                  - '4688'
          minimum_should_match: 1
  source: Sysmon 1; Security 4688
  search:
    basis:
    - attack:DET0127
    - attack:DET0347
    events:
    - channel: Microsoft-Windows-Sysmon/Operational
      codes:
      - '1'
    - channel: Security
      codes:
      - '4688'
    all:
    - field: ecs.process.executable
      endswith:
      - \svchost.exe
      - \smss.exe
      - \csrss.exe
      - \wininit.exe
    none:
    - field: ecs.process.executable
      contains:
      - \Windows\System32\
      - \Windows\SysWOW64\
  es:
    bool:
      filter:
      - bool:
          should:
          - bool:
              filter:
              - term:
                  ecs.winlog.channel:
                    value: Microsoft-Windows-Sysmon/Operational
                    case_insensitive: true
              - terms:
                  event_id:
                  - '1'
          - bool:
              filter:
              - term:
                  ecs.winlog.channel:
                    value: Security
                    case_insensitive: true
              - terms:
                  event_id:
                  - '4688'
          minimum_should_match: 1
      - bool:
          should:
          - wildcard:
              ecs.process.executable.wc:
                value: '*\\svchost.exe'
                case_insensitive: true
          - wildcard:
              ecs.process.executable.wc:
                value: '*\\smss.exe'
                case_insensitive: true
          - wildcard:
              ecs.process.executable.wc:
                value: '*\\csrss.exe'
                case_insensitive: true
          - wildcard:
              ecs.process.executable.wc:
                value: '*\\wininit.exe'
                case_insensitive: true
          minimum_should_match: 1
      must_not:
      - bool:
          should:
          - wildcard:
              ecs.process.executable.wc:
                value: '*\\Windows\\System32\\*'
                case_insensitive: true
          - wildcard:
              ecs.process.executable.wc:
                value: '*\\Windows\\SysWOW64\\*'
                case_insensitive: true
          minimum_should_match: 1
- name: artifact_cross_validation
  query: prefetch OR shimcache OR amcache OR bam OR userassist OR srum
  look_for: 'No single artifact is proof — cross-validate execution claims across the stack: Prefetch (first/last
    run + count), AmCache (full path + SHA1 + first-seen), ShimCache (path + mod time, proves presence not exec),
    BAM (per-user exec + timestamp), UserAssist (GUI exec + run count, ROT13 values), SRUM (process runtime + network
    bytes). An exec claim backed by 2+ artifacts is far stronger than one.'
  corroborate: same binary appearing in prefetch AND amcache AND bam = robust execution evidence
  requires:
    families:
    - pecmd
    - amcache
    - appcompat
    - srumecmd
    - recmd
    - wxtcmd
  es_source:
    bool:
      filter:
      - terms:
          family:
          - pecmd
          - amcache
          - appcompat
          - srumecmd
          - recmd
          - wxtcmd
  source: families pecmd, amcache, appcompat, srumecmd, recmd, wxtcmd
  kind: aggregate
  search:
    families:
    - pecmd
    - amcache
    - appcompat
    - srumecmd
    - recmd
    - wxtcmd
  aggregate:
    field: family
    size: 20
  es:
    bool:
      filter:
      - terms:
          family:
          - pecmd
          - amcache
          - appcompat
          - srumecmd
          - recmd
          - wxtcmd
  es_aggs:
    by:
      terms:
        field: family
        size: 20
negative: No unsigned binaries or suspicious parentage → execution was clean; the compromise may be living-off-the-land
  only or in memory.
confidence_rules:
  high: unsigned binary + suspicious parent + network artifact
  medium: LOLBin with unusual args or temp-path exec
  low: single unsigned exec in a developer/build context
mitre:
- T1218
- T1059.005
- T1106
caveats:
- Developers and IT tools run unsigned binaries — check signer and path context before flagging.
- Prefetch only proves execution, not intent — corroborate with CommandLine or network evidence.
primary_families:
- amcache
