skill: execution_anomaly
title: Execution anomalies — suspicious parentage, unsigned binaries, LOLBins
description: Detect anomalous execution — unsigned binaries, suspicious parent-child chains, LOLBin abuse, and process
  lineage analysis.
trigger:
  families:
  - prefetch
  - amcache
  - evtx
  - pecmd
  - mft
  - appcompat
  keywords:
  - unsigned
  - anomaly
  - lolbin
  - rundll32
  - mshta
  - hollowing
  - spawn
  techniques:
  - T1218
  - T1059.005
  - T1106
  - T1055.001
steps:
- name: unsigned_execution
  query: prefetch amcache unsigned OR .exe
  look_for: Executables in prefetch/amcache without a signed counterpart — unsigned binaries in user-writable paths.
  pivot: ExecutableName
  requires:
    families:
    - kind:evtx
  es_source:
    bool:
      filter:
      - bool:
          filter:
          - term:
              ecs.winlog.channel:
                value: Microsoft-Windows-Sysmon/Operational
                case_insensitive: true
          - terms:
              event_id:
              - '6'
              - '7'
  source: Sysmon 6, 7
  search:
    basis:
    - attack:DET0081
    - attack:DET0552
    events:
    - channel: Microsoft-Windows-Sysmon/Operational
      codes:
      - '6'
      - '7'
    all:
    - field: ecs.winlog.event_data.Signed
      is:
      - 'false'
  es:
    bool:
      filter:
      - bool:
          filter:
          - term:
              ecs.winlog.channel:
                value: Microsoft-Windows-Sysmon/Operational
                case_insensitive: true
          - terms:
              event_id:
              - '6'
              - '7'
      - term:
          ecs.winlog.event_data.Signed:
            value: 'false'
            case_insensitive: true
- name: lolbin_abuse
  query: rundll32 regsvr32 mshta wscript cscript msbuild installutil regasm
  look_for: LOLBin execution with unexpected arguments or parents — rundll32 with unusual DLLs, mshta running remote
    scripts.
  pivot: CommandLine
  requires:
    families:
    - kind:evtx
  es_source:
    bool:
      filter:
      - bool:
          should:
          - bool:
              filter:
              - term:
                  ecs.winlog.channel:
                    value: Microsoft-Windows-Sysmon/Operational
                    case_insensitive: true
              - terms:
                  event_id:
                  - '1'
          - bool:
              filter:
              - term:
                  ecs.winlog.channel:
                    value: Security
                    case_insensitive: true
              - terms:
                  event_id:
                  - '4688'
          minimum_should_match: 1
  source: Sysmon 1; Security 4688
  kind: aggregate
  search:
    basis:
    - attack:DET0081
    - attack:DET0475
    - attack:DET0506
    - attack:DET0282
    - manifest
    events:
    - channel: Microsoft-Windows-Sysmon/Operational
      codes:
      - '1'
    - channel: Security
      codes:
      - '4688'
    all:
    - field: ecs.process.executable
      endswith:
      - \rundll32.exe
      - \regsvr32.exe
      - \mshta.exe
      - \wscript.exe
      - \cscript.exe
      - \msbuild.exe
      - \installutil.exe
      - \regasm.exe
      - \regsvcs.exe
      - \certutil.exe
      - \bitsadmin.exe
      - \odbcconf.exe
  aggregate:
    field: ecs.process.command_line
    size: 50
  es:
    bool:
      filter:
      - bool:
          should:
          - bool:
              filter:
              - term:
                  ecs.winlog.channel:
                    value: Microsoft-Windows-Sysmon/Operational
                    case_insensitive: true
              - terms:
                  event_id:
                  - '1'
          - bool:
              filter:
              - term:
                  ecs.winlog.channel:
                    value: Security
                    case_insensitive: true
              - terms:
                  event_id:
                  - '4688'
          minimum_should_match: 1
      - bool:
          should:
          - wildcard:
              ecs.process.executable.wc:
                value: '*\\rundll32.exe'
                case_insensitive: true
          - wildcard:
              ecs.process.executable.wc:
                value: '*\\regsvr32.exe'
                case_insensitive: true
          - wildcard:
              ecs.process.executable.wc:
                value: '*\\mshta.exe'
                case_insensitive: true
          - wildcard:
              ecs.process.executable.wc:
                value: '*\\wscript.exe'
                case_insensitive: true
          - wildcard:
              ecs.process.executable.wc:
                value: '*\\cscript.exe'
                case_insensitive: true
          - wildcard:
              ecs.process.executable.wc:
                value: '*\\msbuild.exe'
                case_insensitive: true
          - wildcard:
              ecs.process.executable.wc:
                value: '*\\installutil.exe'
                case_insensitive: true
          - wildcard:
              ecs.process.executable.wc:
                value: '*\\regasm.exe'
                case_insensitive: true
          - wildcard:
              ecs.process.executable.wc:
                value: '*\\regsvcs.exe'
                case_insensitive: true
          - wildcard:
              ecs.process.executable.wc:
                value: '*\\certutil.exe'
                case_insensitive: true
          - wildcard:
              ecs.process.executable.wc:
                value: '*\\bitsadmin.exe'
                case_insensitive: true
          - wildcard:
              ecs.process.executable.wc:
                value: '*\\odbcconf.exe'
                case_insensitive: true
          minimum_should_match: 1
  es_aggs:
    by:
      terms:
        field: ecs.process.command_line
        size: 50
- name: suspicious_parentage
