# kb: d_5aeea6f2e856 (CCD M5 T9 Prefetch) | d_dbacad7baf4c (CCD M5 ShimCache)
# kb: d_52edb94c2503 (CCD M5 AmCache) | d_bfa005ec18f7 (CCD M5 BAM/DAM)
# kb: d_f5ad68c1b019 (CCD M5 UserAssist) | d_426d040d6cb8 (CCD M5 SRUM)
# kb: d_ea8f1ff52359 (13C WE 12 Prefetch) | d_d1ae4e63463e (13C WE 13 ShimCache)
# kb: d_9169ff3bbce2 (13C WE 14 AmCache) | d_47e7720ecbfd (13C WE 15 PCA)
# kb: d_a8a00cbad358 (13C WE 18 SRUM) | d_346b1e448071 (13C Registry cheat sheet)
skill: execution_artifact_analysis
title: Evidence-of-execution stack — Prefetch → ShimCache → AmCache → BAM → UserAssist
  → SRUM → PCA
description: 'Establish whether a binary actually ran using the layered execution
  artifacts. The examiner reads them in order of evidentiary strength: Prefetch proves
  execution, ShimCache proves existence only, AmCache records installed-program lineage,
  BAM/UserAssist/PCA/SRUM corroborate per-user execution and network volume.'
trigger:
  families:
  - pecmd
  - prefetch
  - amcache
  - appcompat
  - srum
  - srumecmd
  - recmd
  - wxtcmd
  - sysmon
  - security
  - evtx
  - powershell
  keywords:
  - executed
  - execution
  - ran
  - launch
  - prefetch
  - shimcache
  - amcache
  - userassist
  - srum
  - pca
  - muicache
  techniques:
  - T1204
  - T1059
  - T1036
  - T1106
steps:
- name: prefetch_all
  query: file:prefetch
  look_for: A .pf file exists only because the binary ran at least once — the file
    is created on first launch. Read run count and last-run times (up to 8 on Win10+).
    The .pf creation timestamp minus the ~10s prefetch-write delta approximates first
    execution; its modified timestamp tracks the most recent run. Convert to UTC before
    reporting.
  pivot: ExecutableFileName
  corroborate: referenced-file paths inside the .pf reveal staging dirs and loaded
    modules
  es:
    wildcard:
      file:
        value: '*prefetch*'
        case_insensitive: true
  requires:
    families: &id001
    - pecmd
    - prefetch
    - amcache
    - appcompat
    - srum
    - srumecmd
    - recmd
    - wxtcmd
    - sysmon
    - security
    - evtx
    - powershell
- name: prefetch_lolbin
  query: file:prefetch rundll32 OR mshta OR powershell OR regsvr32 OR cmd.exe OR wmic
    OR bitsadmin OR certutil
  look_for: Prefetch entries for living-off-the-land binaries with unusual parents
    or user-profile/temp working paths — attackers repurpose trusted binaries; the
    .pf proves they actually executed.
  pivot: ExecutableFileName
  corroborate: parent process from Sysmon EID 1 or Security 4688 in the same window
  es:
    bool:
      should:
      - bool:
          must:
          - wildcard:
              file:
                value: '*prefetch*'
                case_insensitive: true
          - wildcard:
              text.wc:
                value: '*rundll32*'
                case_insensitive: true
      - wildcard:
          text.wc:
            value: '*mshta*'
            case_insensitive: true
      - wildcard:
          text.wc:
            value: '*powershell*'
            case_insensitive: true
      - wildcard:
          text.wc:
            value: '*regsvr32*'
            case_insensitive: true
      - wildcard:
          fields.file_path.kw:
            value: '*cmd.exe*'
            case_insensitive: true
      - wildcard:
          text.wc:
            value: '*wmic*'
            case_insensitive: true
      - wildcard:
          text.wc:
            value: '*bitsadmin*'
            case_insensitive: true
      - wildcard:
          text.wc:
            value: '*certutil*'
            case_insensitive: true
      minimum_should_match: 1
  requires:
    families: *id001
  es_text_only_reason:
  - 'rundll32: free phrase; the step''s pivot names no registry column'
  - 'mshta: free phrase; the step''s pivot names no registry column'
  - 'powershell: free phrase; the step''s pivot names no registry column'
  - 'regsvr32: free phrase; the step''s pivot names no registry column'
  - 'wmic: free phrase; the step''s pivot names no registry column'
  - 'bitsadmin: free phrase; the step''s pivot names no registry column'
  - 'certutil: free phrase; the step''s pivot names no registry column'
- name: shimcache_existence
  query: file:shimcache OR file:appcompat
  look_for: ShimCache (SYSTEM\ControlSet001\Control\Session Manager\AppCompatCache)
    proves the file EXISTED on the system — NOT that it executed. Its timestamp is
    literally the file's $SI modification time (M of MACB), never the execution time.
    Treat presence as "attacker-staged binary", then prove execution elsewhere.
  pivot: FilePath
  corroborate: M-time anomaly vs MFT $FN timestamps exposes timestomped binaries
  es:
    bool:
      should:
      - wildcard:
          file:
            value: '*shimcache*'
            case_insensitive: true
      - wildcard:
          file:
            value: '*appcompat*'
            case_insensitive: true
      minimum_should_match: 1
  requires:
    families: *id001
- name: amcache_lineage
  query: file:amcache
  look_for: AmCache.hve (Windows\AppCompat\Programs) is populated by the Microsoft
    Compatibility Appraiser scheduled task. InventoryApplication = installed programs
    (name, version, publisher, path, uninstall string); file entries carry SHA1 hash
    + timestamps — pivot the hash to reputation.
  pivot: SHA1
  corroborate: file-entry key last-write aligns with install/copy time, not necessarily
    first run
  es:
    wildcard:
      file:
        value: '*amcache*'
        case_insensitive: true
  requires:
    families: *id001
- name: bam_per_user
  query: file:bam OR bam\State OR UserSettings
  look_for: BAM (SYSTEM\Services\bam\State\UserSettings\<SID>, Win10 1709+) records
    per-user last-execution time for background-active executables — key differentiator
    for WHO ran it, because keys sit under the user's SID.
  pivot: FullPath
  corroborate: map the SID to a username via ProfileList/SAM to attribute execution
  es:
    bool:
      should:
      - wildcard:
          file:
            value: '*bam*'
            case_insensitive: true
      - wildcard:
          text.wc:
            value: '*bam\State*'
            case_insensitive: true
      - wildcard:
          text.wc:
            value: '*UserSettings*'
            case_insensitive: true
      minimum_should_match: 1
  requires:
    families: *id001
  es_text_only_reason:
  - 'bam\State: free phrase; the step''s pivot names no registry column'
  - 'UserSettings: free phrase; the step''s pivot names no registry column'
- name: userassist_gui
  query: userassist
  look_for: NTUSER\Software\Microsoft\Windows\CurrentVersion\Explorer\UserAssist tracks
    per-user GUI program launches — ROT13-encoded value names, run-count and last-run
    time per GUID ({CEBFF5CD…} executables, {F4E57C4B…} shortcuts). GUI-only — CLI
    invocations absent.
  pivot: ValueName
  es:
    wildcard:
      fields.registry_value.kw:
        value: '*userassist*'
        case_insensitive: true
  requires:
    families: *id001
- name: srum_usage
  query: file:srum
  look_for: SRUM (30–60 days) — the two app-usage CSVs corroborate execution; the
    two network CSVs give per-application bytes sent/received per day, which also
    bounds possible exfil volume by process.
  pivot: AppId
  corroborate: network-table bytes confirm data-mover tools actually transferred
  es:
    wildcard:
      file:
        value: '*srum*'
        case_insensitive: true
  requires:
    families: *id001
- name: pca_applaunch
  query: file:pca OR PCAAppLaunchDIC
  look_for: Program Compatibility Assistant (Win11 22H2+) — PCAAppLaunchDIC.txt under
    Windows\AppCompat\PCA records full path + last execution time in UTC, pipe-delimited,
    for GUI-launched programs. New but reliable.
  pivot: FilePath
  es:
    bool:
      should:
      - wildcard:
          file:
            value: '*pca*'
            case_insensitive: true
      - wildcard:
          fields.file_path.kw:
            value: '*PCAAppLaunchDIC*'
            case_insensitive: true
      minimum_should_match: 1
  requires:
    families: *id001
- name: muicache_gui
  query: muicache
  look_for: UsrClass MuiCache — per-user evidence of GUI execution; confirms the binary
    ran but does NOT carry a timestamp. Use only as corroboration.
  es:
    wildcard:
      text.wc:
        value: '*muicache*'
        case_insensitive: true
  requires:
    families: *id001
  es_text_only_reason:
  - 'muicache: free phrase; the step''s pivot names no registry column'
- name: windows_timeline
  query: file:activit OR file:wxtcmd
  look_for: Windows Timeline (ActivitiesCache.db via WxTCmd) — per-user app usage
    with focus duration; bridges execution to what the user was doing.
  es:
    bool:
      should:
      - wildcard:
          file:
            value: '*activit*'
            case_insensitive: true
      - wildcard:
          file:
            value: '*wxtcmd*'
            case_insensitive: true
      minimum_should_match: 1
  requires:
    families: *id001
negative: No execution artifacts for a binary does not prove it never ran — Prefetch
  is often disabled on servers, BAM/SRUM have retention windows, and CLI-only execution
  leaves no UserAssist/PCA trace. Compensate with Security 4688 / Sysmon EID 1 process-creation
  rows for the same window.
confidence_rules:
  high: two or more independent artifacts agree (e.g. prefetch .pf + SRUM/PCA row
    for same path)
  medium: a single execution artifact (prefetch or BAM alone)
  low: ShimCache-only presence — existence proven, execution not
mitre:
- T1204
- T1059
- T1036
- T1106
