caveats:
  - "ShimCache timestamps are the file's $SI M-time — citing them as execution times is a classic report error (13Cubed WE 13)."
  - "Prefetch is disabled by default on Windows Server and on some SSD-optimized installs — empty Prefetch is a coverage gap, not absence."
  - "UserAssist/PCA/MuiCache only see GUI launches — a netcat or python CLI run is invisible to all three."
  - "AmCache file-entry SHA1 is the exe hash at appraisal time — a replaced payload keeps the path but changes the hash."
