- name: theft_sequence
  query: rar OR 7z OR zip OR copy
  look_for: 'Answer "did the attacker steal data" as a SEQUENCE, not a single event: collection (files copied to
    staging) → archive (rar/7z in prefetch + new archive in MFT/USN) → transfer (large outbound flow, browser upload,
    BITS). Missing one stage narrows the claim — archive without transfer may mean interrupted exfil.'
  corroborate: archive creation timestamp vs outbound-flow window vs last file access times
  kind: procedure
  procedure_reason: the theft question is a sequence (collection, archive, transfer) correlated across families;
    each stage has its own search (archive_creation, cloud_upload, large_outbound, bitsadmin_transfer).
negative: No archive creation, staging dirs, or large outbound flows → exfiltration not evident; check for in-place
  destruction (ransomware) instead.
confidence_rules:
  high: archive + staging dir + upload flow to external service
  medium: archive + external connection without confirmed transfer
  low: single cloud-service browse (user activity plausible)
mitre:
- T1041
- T1567
- T1071.004
- T1560.001
caveats:
- Users legitimately upload to cloud storage — check account context and data volume.
- SRUM/network counters are cumulative — a single large number isn't a transfer timestamp.
