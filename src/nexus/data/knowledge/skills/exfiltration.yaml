skill: exfiltration
title: Exfiltration — staging archives, cloud uploads, DNS tunneling
description: Detect data theft — archive creation, staging directories, cloud upload, DNS tunneling, large outbound
  transfers.
trigger:
  families:
  - evtx
  - sysmon
  - browser
  - netstat
  - powershell
  - prefetch
  - mft
  keywords:
  - exfil
  - steal
  - upload
  - archive
  - rar
  - 7z
  - mega
  - dropbox
  - webhook
  techniques:
  - T1041
  - T1567
  - T1071.004
  - T1560.001
steps:
- name: archive_creation
  query: rar.exe OR 7z.exe OR Compress-Archive OR .rar OR .7z
  look_for: Archive tool runs with staging paths; large new archives in mft/usn.
  pivot: CommandLine
  requires:
    families:
    - evtxecmd
    - hayabusa
  es_source:
    bool:
      filter:
      - bool:
          should:
          - bool:
              filter:
              - term:
                  ecs.winlog.channel:
                    value: Microsoft-Windows-Sysmon/Operational
                    case_insensitive: true
              - terms:
                  event_id:
                  - '1'
                  - '11'
          - bool:
              filter:
              - term:
                  ecs.winlog.channel:
                    value: Security
                    case_insensitive: true
              - terms:
                  event_id:
                  - '4688'
          - bool:
              filter:
              - term:
                  ecs.winlog.channel:
                    value: Microsoft-Windows-PowerShell/Operational
                    case_insensitive: true
              - terms:
                  event_id:
                  - '4104'
          minimum_should_match: 1
  source: Sysmon 1, 11; Security 4688; PowerShell/Operational 4104
  search:
    basis:
    - attack:DET0298
    - attack:DET0455
    - manifest
    events:
    - channel: Microsoft-Windows-Sysmon/Operational
      codes:
      - '1'
      - '11'
    - channel: Security
      codes:
      - '4688'
    - channel: Microsoft-Windows-PowerShell/Operational
      codes:
      - '4104'
    any:
    - field: ecs.process.executable
      endswith:
      - \rar.exe
      - \winrar.exe
      - \7z.exe
      - \7za.exe
      - \7zr.exe
      - \makecab.exe
    - field: ecs.process.command_line
      contains:
      - Compress-Archive
    - field: ecs.winlog.event_data.ScriptBlockText
      contains:
      - Compress-Archive
    - field: ecs.file.extension
      is:
      - rar
      - 7z
  es:
    bool:
      filter:
      - bool:
          should:
          - bool:
              filter:
              - term:
                  ecs.winlog.channel:
                    value: Microsoft-Windows-Sysmon/Operational
                    case_insensitive: true
              - terms:
                  event_id:
                  - '1'
                  - '11'
          - bool:
              filter:
              - term:
                  ecs.winlog.channel:
                    value: Security
                    case_insensitive: true
              - terms:
                  event_id:
                  - '4688'
          - bool:
              filter:
              - term:
                  ecs.winlog.channel:
                    value: Microsoft-Windows-PowerShell/Operational
                    case_insensitive: true
              - terms:
                  event_id:
                  - '4104'
          minimum_should_match: 1
      - bool:
          should:
          - bool:
              should:
              - wildcard:
                  ecs.process.executable.wc:
                    value: '*\\rar.exe'
                    case_insensitive: true
              - wildcard:
                  ecs.process.executable.wc:
                    value: '*\\winrar.exe'
                    case_insensitive: true
              - wildcard:
                  ecs.process.executable.wc:
                    value: '*\\7z.exe'
                    case_insensitive: true
              - wildcard:
                  ecs.process.executable.wc:
                    value: '*\\7za.exe'
                    case_insensitive: true
              - wildcard:
                  ecs.process.executable.wc:
                    value: '*\\7zr.exe'
                    case_insensitive: true
              - wildcard:
                  ecs.process.executable.wc:
                    value: '*\\makecab.exe'
                    case_insensitive: true
              minimum_should_match: 1
          - wildcard:
              ecs.process.command_line.wc:
                value: '*Compress-Archive*'
                case_insensitive: true
          - wildcard:
              ecs.winlog.event_data.ScriptBlockText.wc:
                value: '*Compress-Archive*'
                case_insensitive: true
          - bool:
              should:
              - term:
                  ecs.file.extension:
                    value: rar
                    case_insensitive: true
              - term:
                  ecs.file.extension:
                    value: 7z
                    case_insensitive: true
              minimum_should_match: 1
          minimum_should_match: 1
- name: staging_dirs
  query: staging OR exfil OR collect OR loot
  look_for: New directories under %TEMP%/%ProgramData% collecting files.
  pivot: Path
  kind: procedure
  procedure_reason: '"new directories collecting files" is a pattern across rows (a directory created, then many
    files copied into it, then archived), read on the MFT/USN timeline around the archive; no single row states
    it.'
- name: cloud_upload
  query: mega.nz OR dropbox OR drive.google OR pastebin OR transfer.sh
  look_for: Browser hits / netstat flows to upload-friendly services.
  pivot: URL
  requires:
    families:
    - evtxecmd
    - hayabusa
    - sqlecmd
    - hindsight
  es_source:
    bool:
