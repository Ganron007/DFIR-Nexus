              filter:
              - term:
                  ecs.winlog.channel:
                    value: Microsoft-Windows-Sysmon/Operational
                    case_insensitive: true
              - terms:
                  event_id:
                  - '22'
          - terms:
              family:
              - sqlecmd
              - hindsight
          minimum_should_match: 1
  source: Sysmon 22; families sqlecmd, hindsight
  search:
    basis:
    - attack:DET0400
    - attack:DET0027
    events:
    - channel: Microsoft-Windows-Sysmon/Operational
      codes:
      - '22'
    families:
    - sqlecmd
    - hindsight
    any:
    - field: ecs.url.full
      contains:
      - mega.nz
      - dropbox.com
      - drive.google.com
      - pastebin.com
      - transfer.sh
      - wetransfer.com
    - field: fields.url
      contains:
      - mega.nz
      - dropbox.com
      - drive.google.com
      - pastebin.com
      - transfer.sh
      - wetransfer.com
    - field: ecs.dns.question.name
      contains:
      - mega.nz
      - dropbox.com
      - drive.google.com
      - pastebin.com
      - transfer.sh
      - wetransfer.com
  es:
    bool:
      filter:
      - bool:
          should:
          - bool:
              filter:
              - term:
                  ecs.winlog.channel:
                    value: Microsoft-Windows-Sysmon/Operational
                    case_insensitive: true
              - terms:
                  event_id:
                  - '22'
          - terms:
              family:
              - sqlecmd
              - hindsight
          minimum_should_match: 1
      - bool:
          should:
          - bool:
              should:
              - wildcard:
                  ecs.url.full.wc:
                    value: '*mega.nz*'
                    case_insensitive: true
              - wildcard:
                  ecs.url.full.wc:
                    value: '*dropbox.com*'
                    case_insensitive: true
              - wildcard:
                  ecs.url.full.wc:
                    value: '*drive.google.com*'
                    case_insensitive: true
              - wildcard:
                  ecs.url.full.wc:
                    value: '*pastebin.com*'
                    case_insensitive: true
              - wildcard:
                  ecs.url.full.wc:
                    value: '*transfer.sh*'
                    case_insensitive: true
              - wildcard:
                  ecs.url.full.wc:
                    value: '*wetransfer.com*'
                    case_insensitive: true
              minimum_should_match: 1
          - bool:
              should:
              - wildcard:
                  fields.url.kw:
                    value: '*mega.nz*'
                    case_insensitive: true
              - wildcard:
                  fields.url.kw:
                    value: '*dropbox.com*'
                    case_insensitive: true
              - wildcard:
                  fields.url.kw:
                    value: '*drive.google.com*'
                    case_insensitive: true
              - wildcard:
                  fields.url.kw:
                    value: '*pastebin.com*'
                    case_insensitive: true
              - wildcard:
                  fields.url.kw:
                    value: '*transfer.sh*'
                    case_insensitive: true
              - wildcard:
                  fields.url.kw:
                    value: '*wetransfer.com*'
                    case_insensitive: true
              minimum_should_match: 1
          - bool:
              should:
              - wildcard:
                  ecs.dns.question.name.wc:
                    value: '*mega.nz*'
                    case_insensitive: true
              - wildcard:
                  ecs.dns.question.name.wc:
                    value: '*dropbox.com*'
                    case_insensitive: true
              - wildcard:
                  ecs.dns.question.name.wc:
                    value: '*drive.google.com*'
                    case_insensitive: true
              - wildcard:
                  ecs.dns.question.name.wc:
                    value: '*pastebin.com*'
                    case_insensitive: true
              - wildcard:
                  ecs.dns.question.name.wc:
                    value: '*transfer.sh*'
                    case_insensitive: true
              - wildcard:
                  ecs.dns.question.name.wc:
                    value: '*wetransfer.com*'
                    case_insensitive: true
              minimum_should_match: 1
          minimum_should_match: 1
- name: dns_tunneling
  query: nslookup OR dig OR TXT record OR dns
  look_for: High-volume DNS queries with long/random subdomains.
  pivot: QueryName
  requires:
    families:
    - evtxecmd
    - hayabusa
  es_source:
    bool:
      filter:
      - bool:
          filter:
          - term:
              ecs.winlog.channel:
                value: Microsoft-Windows-Sysmon/Operational
                case_insensitive: true
          - terms:
              event_id:
              - '22'
  source: Sysmon 22
  kind: aggregate
  search:
    basis:
    - attack:DET0400
    events:
    - channel: Microsoft-Windows-Sysmon/Operational
      codes:
      - '22'
  aggregate:
    field: ecs.dns.question.name
    size: 100
  es:
    bool:
      filter:
      - bool:
          filter:
          - term:
              ecs.winlog.channel:
                value: Microsoft-Windows-Sysmon/Operational
                case_insensitive: true
          - terms:
              event_id:
              - '22'
  es_aggs:
    by:
      terms:
        field: ecs.dns.question.name
        size: 100
- name: large_outbound
  query: netstat -an OR BytesSent
  look_for: SRUM/netstat showing large BytesSent from unusual processes.
  pivot: AppName
  requires:
    families:
    - srumecmd
  es_source:
    bool:
      filter:
      - terms:
          family:
          - srumecmd
  source: families srumecmd
  kind: aggregate
  search:
    families:
    - srumecmd
    all:
    - field: fields.BytesSent
      exists: true
  aggregate:
    field: fields.ExeInfo
    size: 50
  es:
    bool:
      filter:
      - terms:
          family:
          - srumecmd
      - exists:
          field: fields.BytesSent
  es_aggs:
    by:
      terms:
        field: fields.ExeInfo.kw
        size: 50
