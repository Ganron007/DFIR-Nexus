# kb: EIR (Theft of Data lesson — staging/archive/transfer procedure chain)
# kb: CCD M2 (network analysis — long-duration/large-byte flows, RITA),
#      HTB DefSec (beacon vs bulk-transfer distinction)
skill: exfiltration
title: Exfiltration — staging archives, cloud uploads, DNS tunneling
description: Detect data theft — archive creation, staging directories, cloud upload,
  DNS tunneling, large outbound transfers.
trigger:
  families:
  - evtx
  - sysmon
  - browser
  - netstat
  - powershell
  - prefetch
  - mft
  keywords:
  - exfil
  - steal
  - upload
  - archive
  - rar
  - 7z
  - mega
  - dropbox
  - webhook
  techniques:
  - T1041
  - T1567
  - T1071.004
  - T1560.001
steps:
- name: archive_creation
  query: rar.exe OR 7z.exe OR Compress-Archive OR .rar OR .7z
  look_for: Archive tool runs with staging paths; large new archives in mft/usn.
  pivot: CommandLine
  es:
    bool:
      should:
      - wildcard:
          fields.file_path.kw:
            value: '*rar.exe*'
            case_insensitive: true
      - wildcard:
          fields.file_path.kw:
            value: '*7z.exe*'
            case_insensitive: true
      - wildcard:
          fields.command_line.kw:
            value: '*Compress-Archive*'
            case_insensitive: true
      - wildcard:
          fields.file_path.kw:
            value: '*.rar*'
            case_insensitive: true
      - wildcard:
          fields.file_path.kw:
            value: '*.7z*'
            case_insensitive: true
      minimum_should_match: 1
  requires:
    families: &id001
    - evtx
    - sysmon
    - browser
    - netstat
    - powershell
    - prefetch
    - mft
- name: staging_dirs
  query: staging OR exfil OR collect OR loot
  look_for: New directories under %TEMP%/%ProgramData% collecting files.
  pivot: Path
  es:
    bool:
      should:
      - wildcard:
          fields.path.kw:
            value: '*staging*'
            case_insensitive: true
      - wildcard:
          fields.path.kw:
            value: '*exfil*'
            case_insensitive: true
      - wildcard:
          fields.path.kw:
            value: '*collect*'
            case_insensitive: true
      - wildcard:
          fields.path.kw:
            value: '*loot*'
            case_insensitive: true
      minimum_should_match: 1
  requires:
    families: *id001
- name: cloud_upload
  query: mega.nz OR dropbox OR drive.google OR pastebin OR transfer.sh
  look_for: Browser hits / netstat flows to upload-friendly services.
  pivot: URL
  es:
    bool:
      should:
      - wildcard:
          text.wc:
            value: '*mega.nz*'
            case_insensitive: true
      - wildcard:
          text.wc:
            value: '*dropbox*'
            case_insensitive: true
      - wildcard:
          text.wc:
            value: '*drive.google*'
            case_insensitive: true
      - wildcard:
          text.wc:
            value: '*pastebin*'
            case_insensitive: true
      - wildcard:
          text.wc:
            value: '*transfer.sh*'
            case_insensitive: true
      minimum_should_match: 1
  requires:
    families: *id001
  es_text_only_reason:
  - 'mega.nz: free phrase; the step''s pivot names no registry column'
  - 'dropbox: free phrase; the step''s pivot names no registry column'
  - 'drive.google: free phrase; the step''s pivot names no registry column'
  - 'pastebin: free phrase; the step''s pivot names no registry column'
  - 'transfer.sh: free phrase; the step''s pivot names no registry column'
- name: dns_tunneling
  query: nslookup OR dig OR TXT record OR dns
  look_for: High-volume DNS queries with long/random subdomains.
  pivot: QueryName
  es:
    bool:
      should:
      - wildcard:
          text.wc:
            value: '*nslookup*'
            case_insensitive: true
      - wildcard:
          text.wc:
            value: '*dig*'
            case_insensitive: true
      - wildcard:
          text.wc:
            value: '*TXT record*'
            case_insensitive: true
      - wildcard:
          text.wc:
            value: '*dns*'
            case_insensitive: true
      minimum_should_match: 1
  requires:
    families: *id001
  es_text_only_reason:
  - 'nslookup: free phrase; the step''s pivot names no registry column'
  - 'dig: free phrase; the step''s pivot names no registry column'
  - 'TXT record: free phrase; the step''s pivot names no registry column'
  - 'dns: free phrase; the step''s pivot names no registry column'
- name: large_outbound
  query: netstat -an OR BytesSent
  look_for: SRUM/netstat showing large BytesSent from unusual processes.
  pivot: AppName
  es:
    bool:
      should:
      - wildcard:
          fields.name.kw:
            value: '*netstat -an*'
            case_insensitive: true
      - wildcard:
          fields.name.kw:
            value: '*BytesSent*'
            case_insensitive: true
      minimum_should_match: 1
  requires:
    families: *id001
- name: ftp_exfil
  query: ftp.exe OR sftp OR scp.exe OR pscp
  look_for: FTP/SFTP command-line transfers to external IPs.
  pivot: CommandLine
  es:
    bool:
      should:
      - wildcard:
          fields.file_path.kw:
            value: '*ftp.exe*'
            case_insensitive: true
      - wildcard:
          fields.command_line.kw:
            value: '*sftp*'
            case_insensitive: true
      - wildcard:
          fields.file_path.kw:
            value: '*scp.exe*'
            case_insensitive: true
      - wildcard:
          fields.command_line.kw:
            value: '*pscp*'
            case_insensitive: true
      minimum_should_match: 1
  requires:
    families: *id001
- name: bitsadmin_transfer
  query: bitsadmin OR Start-BitsTransfer
  look_for: BITS transfers to external URLs — living-off-the-land exfil that bypasses
    many proxy controls and survives reboots.
  pivot: CommandLine
  es:
    bool:
      should:
      - wildcard:
          fields.command_line.kw:
            value: '*bitsadmin*'
            case_insensitive: true
      - wildcard:
          fields.command_line.kw:
            value: '*Start-BitsTransfer*'
            case_insensitive: true
      minimum_should_match: 1
  requires:
    families: *id001
- name: theft_sequence
  query: rar OR 7z OR zip OR copy
  look_for: 'Answer "did the attacker steal data" as a SEQUENCE, not a single event:
    collection (files copied to staging) → archive (rar/7z in prefetch + new archive
    in MFT/USN) → transfer (large outbound flow, browser upload, BITS). Missing one
    stage narrows the claim — archive without transfer may mean interrupted exfil.'
  corroborate: archive creation timestamp vs outbound-flow window vs last file access
    times
  es:
    bool:
      should:
      - wildcard:
          text.wc:
            value: '*rar*'
            case_insensitive: true
      - wildcard:
          text.wc:
            value: '*7z*'
            case_insensitive: true
      - wildcard:
          text.wc:
            value: '*zip*'
            case_insensitive: true
      - wildcard:
          text.wc:
            value: '*copy*'
            case_insensitive: true
      minimum_should_match: 1
  requires:
    families: *id001
  es_text_only_reason:
  - 'rar: free phrase; the step''s pivot names no registry column'
  - '7z: free phrase; the step''s pivot names no registry column'
  - 'zip: free phrase; the step''s pivot names no registry column'
  - 'copy: free phrase; the step''s pivot names no registry column'
negative: No archive creation, staging dirs, or large outbound flows → exfiltration
  not evident; check for in-place destruction (ransomware) instead.
confidence_rules:
  high: archive + staging dir + upload flow to external service
  medium: archive + external connection without confirmed transfer
  low: single cloud-service browse (user activity plausible)
mitre:
- T1041
- T1567
- T1071.004
- T1560.001
