caveats:
- Safety and availability outrank evidence — never actively query/mount a PLC in a
  running process; passive capture and offline analysis only.
- ICS protocols are often unauthenticated (Modbus/DNP3) — any host on the conduit
  can write; authoritative validation is program/firmware hash vs baseline.
- Device clocks drift and may lack NTP — normalise timestamps across IT/OT zones before
  building a sequence.
- Legitimate engineering/maintenance windows produce writes — verify against the change-management
  record before flagging (FD-004).
