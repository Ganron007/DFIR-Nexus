# kb: d_29a06b6cb1aa:c0052 (SANS ICS515 Book 1 — turning raw collection into
#      information; a network tap collects pcaps, an analyst reviewing Modbus
#      TCP extracts process information; asset/zone model)
# kb: SANS/SANS 515 v2022 Books 1-5 + Workbook (ICS/OT IR lifecycle, Purdue
#      model, control-system protocols, PLC/HMI/historian evidence)
skill: ics_ot_forensics
title: ICS/OT investigation — Modbus/DNP3 traffic, PLC/HMI/historian evidence
description: 'Investigate an industrial control system incident: establish the zone/conduit
  model and asset inventory, analyse control-protocol traffic (Modbus/DNP3/ S7/OPC)
  for unauthorized writes, and collect evidence from PLCs, HMIs, engineering workstations,
  and historians — where availability and safety outrank forensic completeness.'
trigger:
  families:
  - wireshark
  - zeek
  - suricata
  - syslog
  - firewall
  keywords:
  - modbus
  - dnp3
  - plc
  - hmi
  - scada
  - ics
  - ot
  - opc
  - historian
  - purdue
  - laddder
  techniques:
  - T0816
  - T0836
  - T0855
  - T0882
  - T0803
  - T0828
steps:
- name: asset_and_zone_inventory
  query: Modbus OR DNP3 OR SCADA OR PLC OR historian OR Purdue
  look_for: 'Build the asset/zone model before touching devices: which hosts are PLCs
    (Level 1), HMIs/supervisory (Level 2), historians/site ops (Level 3), and IT (Level
    4-5). Identify normal conversations per zone — control traffic crossing zone boundaries
    (IT→PLC) is the anomaly to hunt.'
  pivot: DestinationIp
  corroborate: a new IT-side host talks directly to a PLC on the control port
  es:
    bool:
      should:
      - wildcard:
          fields.dest_ip.kw:
            value: '*Modbus*'
            case_insensitive: true
      - wildcard:
          fields.dest_ip.kw:
            value: '*DNP3*'
            case_insensitive: true
      - wildcard:
          fields.dest_ip.kw:
            value: '*SCADA*'
            case_insensitive: true
      - wildcard:
          fields.dest_ip.kw:
            value: '*PLC*'
            case_insensitive: true
      - wildcard:
          fields.dest_ip.kw:
            value: '*historian*'
            case_insensitive: true
      - wildcard:
          fields.dest_ip.kw:
            value: '*Purdue*'
            case_insensitive: true
      minimum_should_match: 1
  requires:
    families: &id001
    - wireshark
    - zeek
    - suricata
    - syslog
    - firewall
- name: control_protocol_analysis
  query: Modbus OR function code OR write coil OR DNP3 OR S7comm
  look_for: 'In the pcap, decode control protocols and look for WRITE operations:
    Modbus function codes (5 write coil, 6/16 write registers — setpoint changes),
    DNP3 control operations (operate/direct-operate), S7comm download (program modification).
    Unauthorized writes to coils/registers are the ICS equivalent of lateral movement.'
  pivot: function_code
  corroborate: the write coincides with a physical process anomaly or operator alarm
  es:
    bool:
      should:
      - wildcard:
          text.wc:
            value: '*Modbus*'
            case_insensitive: true
      - wildcard:
          text.wc:
            value: '*function code*'
            case_insensitive: true
      - wildcard:
          text.wc:
            value: '*write coil*'
            case_insensitive: true
      - wildcard:
          text.wc:
            value: '*DNP3*'
            case_insensitive: true
      - wildcard:
          text.wc:
            value: '*S7comm*'
            case_insensitive: true
      minimum_should_match: 1
  requires:
    families: *id001
  es_text_only_reason:
  - 'Modbus: free phrase; the step''s pivot names no registry column'
  - 'function code: free phrase; the step''s pivot names no registry column'
  - 'write coil: free phrase; the step''s pivot names no registry column'
  - 'DNP3: free phrase; the step''s pivot names no registry column'
  - 'S7comm: free phrase; the step''s pivot names no registry column'
- name: engineering_workstation
  query: engineering workstation OR project file OR plc program OR download
  look_for: 'The engineering workstation is the crown jewel: project files, PLC program
    logic, and the download path to controllers. Check for unauthorized program downloads,
    new/tampered project files, USB use, and remote access (VPN/RDP) into the OT network.'
  pivot: FileName
  es:
    bool:
      should:
      - wildcard:
          fields.file_path.kw:
            value: '*engineering workstation*'
            case_insensitive: true
      - wildcard:
          fields.file_path.kw:
            value: '*project file*'
            case_insensitive: true
      - wildcard:
          fields.file_path.kw:
            value: '*plc program*'
            case_insensitive: true
      - wildcard:
          fields.file_path.kw:
            value: '*download*'
            case_insensitive: true
      minimum_should_match: 1
  requires:
    families: *id001
- name: plc_hmi_evidence
  query: PLC log OR HMI event OR alarm OR controller OR firmware
  look_for: 'Collect from devices where possible: PLC program/hash and diagnostic
    buffer, HMI alarm and operator-action logs, firmware version vs baseline, and
    configuration backups. Note that some PLCs retain limited history — capture quickly
    and document what is not recoverable.'
  pivot: device
  es:
    bool:
      should:
      - wildcard:
          fields.host.kw:
            value: '*PLC log*'
            case_insensitive: true
      - wildcard:
          fields.host.kw:
            value: '*HMI event*'
            case_insensitive: true
      - wildcard:
          fields.host.kw:
            value: '*alarm*'
            case_insensitive: true
      - wildcard:
          fields.host.kw:
            value: '*controller*'
            case_insensitive: true
      - wildcard:
          fields.host.kw:
            value: '*firmware*'
            case_insensitive: true
      minimum_should_match: 1
  requires:
    families: *id001
- name: historian_and_reports
  query: historian OR process data OR trend OR setpoint OR alarm history
  look_for: The historian holds process data (setpoints, valve states, alarms) that
    timestamps a process manipulation independent of the IT logs. Compare historian
    trends against the protocol writes and physical reports.
  pivot: tag
  es:
    bool:
      should:
      - wildcard:
          fields.tags.kw:
            value: '*historian*'
            case_insensitive: true
      - wildcard:
          fields.tags.kw:
            value: '*process data*'
            case_insensitive: true
      - wildcard:
          fields.tags.kw:
            value: '*trend*'
            case_insensitive: true
      - wildcard:
          fields.tags.kw:
            value: '*setpoint*'
            case_insensitive: true
      - wildcard:
          fields.tags.kw:
            value: '*alarm history*'
            case_insensitive: true
      minimum_should_match: 1
  requires:
    families: *id001
negative: No unauthorized control writes, no new assets across zones, PLC program
  hashes match baseline, and historian shows no manipulated setpoints → no control-system
  manipulation in the captured window. Passive capture misses encrypted/segmented
  traffic, so state the monitoring coverage and any unmonitored conduits.
confidence_rules:
  high: unauthorized Modbus/DNP3 write to operational tags + PLC program hash mismatch
    + historian process change
  medium: cross-zone control traffic or anomalous writes without confirmed physical
    effect
  low: an unusual but sanctioned engineering maintenance session (verify change tickets,
    FD-004)
mitre:
- T0816
- T0836
- T0855
- T0882
- T0803
