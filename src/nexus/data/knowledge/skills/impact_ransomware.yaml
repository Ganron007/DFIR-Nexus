skill: impact_ransomware
title: Impact — ransomware, backup destruction, disk encryption
description: Detect ransomware and destructive impact — shadow deletion, backup removal, mass file encryption, ransom
  notes.
trigger:
  families:
  - evtx
  - sysmon
  - mft
  - usn
  - prefetch
  - services
  keywords:
  - ransom
  - encrypt
  - vssadmin
  - bcdedit
  - backup
  - shadow
  - wannacry
  - lockbit
  techniques:
  - T1490
  - T1486
  - T1489
  - T1491
steps:
- name: shadow_delete
  query: vssadmin delete shadows OR vssadmin resize shadowstorage OR wmic shadowcopy delete
  look_for: Shadow-copy deletion — the canonical ransomware anti-recovery move.
  pivot: CommandLine
  requires:
    families:
    - evtxecmd
    - hayabusa
  es_source:
    bool:
      filter:
      - bool:
          should:
          - bool:
              filter:
              - term:
                  ecs.winlog.channel:
                    value: Microsoft-Windows-Sysmon/Operational
                    case_insensitive: true
              - terms:
                  event_id:
                  - '1'
          - bool:
              filter:
              - term:
                  ecs.winlog.channel:
                    value: Security
                    case_insensitive: true
              - terms:
                  event_id:
                  - '4688'
          minimum_should_match: 1
  source: Sysmon 1; Security 4688
  search:
    basis:
    - attack:DET0329
    - manifest
    - evtx-map
    events:
    - channel: Microsoft-Windows-Sysmon/Operational
      codes:
      - '1'
    - channel: Security
      codes:
      - '4688'
    all:
    - field: ecs.process.command_line
      contains:
      - delete
      - resize
    any:
    - field: ecs.process.command_line
      contains:
      - vssadmin
      - shadowcopy
      - shadowstorage
  es:
    bool:
      filter:
      - bool:
          should:
          - bool:
              filter:
              - term:
                  ecs.winlog.channel:
                    value: Microsoft-Windows-Sysmon/Operational
                    case_insensitive: true
              - terms:
                  event_id:
                  - '1'
          - bool:
              filter:
              - term:
                  ecs.winlog.channel:
                    value: Security
                    case_insensitive: true
              - terms:
                  event_id:
                  - '4688'
          minimum_should_match: 1
      - bool:
          should:
          - wildcard:
              ecs.process.command_line.wc:
                value: '*delete*'
                case_insensitive: true
          - wildcard:
              ecs.process.command_line.wc:
                value: '*resize*'
                case_insensitive: true
          minimum_should_match: 1
      - bool:
          should:
          - wildcard:
              ecs.process.command_line.wc:
                value: '*vssadmin*'
                case_insensitive: true
          - wildcard:
              ecs.process.command_line.wc:
                value: '*shadowcopy*'
                case_insensitive: true
          - wildcard:
              ecs.process.command_line.wc:
                value: '*shadowstorage*'
                case_insensitive: true
          minimum_should_match: 1
- name: bcdedit_recovery
  query: bcdedit /set OR bootstatuspolicy OR recoveryenabled no
  look_for: bcdedit disabling recovery/bootstatus — prevents safe-mode recovery.
  pivot: CommandLine
  requires:
    families:
    - evtxecmd
    - hayabusa
  es_source:
    bool:
      filter:
      - bool:
          should:
          - bool:
              filter:
              - term:
                  ecs.winlog.channel:
                    value: Microsoft-Windows-Sysmon/Operational
                    case_insensitive: true
              - terms:
