# kb: d_ae743ea2444d:c0082 / d_40fd028860ee:c0360 (FOR528 — ransomware
#      "backward analysis": start from ransomed/highest-activity hosts and
#      work back to initial access; dominant IAB vectors = exposed RDP,
#      border-device exploit, phishing, purchased access)
# kb: SANS ransomware poster (detonation phases), CCD M5 (artifact evidence)
skill: impact_ransomware
title: Impact — ransomware, backup destruction, disk encryption
description: Detect ransomware and destructive impact — shadow deletion, backup removal,
  mass file encryption, ransom notes.
trigger:
  families:
  - evtx
  - sysmon
  - mft
  - usn
  - prefetch
  - services
  keywords:
  - ransom
  - encrypt
  - vssadmin
  - bcdedit
  - backup
  - shadow
  - wannacry
  - lockbit
  techniques:
  - T1490
  - T1486
  - T1489
  - T1491
steps:
- name: shadow_delete
  query: vssadmin delete shadows OR vssadmin resize shadowstorage OR wmic shadowcopy
    delete
  look_for: Shadow-copy deletion — the canonical ransomware anti-recovery move.
  pivot: CommandLine
  es:
    bool:
      should:
      - wildcard:
          fields.command_line.kw:
            value: '*vssadmin delete shadows*'
            case_insensitive: true
      - wildcard:
          fields.command_line.kw:
            value: '*vssadmin resize shadowstorage*'
            case_insensitive: true
      - wildcard:
          fields.command_line.kw:
            value: '*wmic shadowcopy delete*'
            case_insensitive: true
      minimum_should_match: 1
  requires:
    families: &id001
    - evtx
    - sysmon
    - mft
    - usn
    - prefetch
    - services
- name: bcdedit_recovery
  query: bcdedit /set OR bootstatuspolicy OR recoveryenabled no
  look_for: bcdedit disabling recovery/bootstatus — prevents safe-mode recovery.
  pivot: CommandLine
  es:
    bool:
      should:
      - wildcard:
          fields.command_line.kw:
            value: '*bcdedit /set*'
            case_insensitive: true
      - wildcard:
          fields.command_line.kw:
            value: '*bootstatuspolicy*'
            case_insensitive: true
      - wildcard:
          fields.command_line.kw:
            value: '*recoveryenabled no*'
            case_insensitive: true
      minimum_should_match: 1
  requires:
    families: *id001
- name: backup_kill
  query: wbadmin delete catalog OR backup delete
  look_for: wbadmin catalog deletion — removes backup inventory.
  pivot: CommandLine
  es:
    bool:
      should:
      - wildcard:
          fields.command_line.kw:
            value: '*wbadmin delete catalog*'
            case_insensitive: true
      - wildcard:
          fields.command_line.kw:
            value: '*backup delete*'
            case_insensitive: true
      minimum_should_match: 1
  requires:
    families: *id001
- name: mass_encryption
  query: .encrypted OR .locked OR .crypt OR readme OR ransom
  look_for: Mass file renames to ransom extensions; readme/ransom-note files in mft/usn
    with high write rates.
  pivot: FileName
  es:
    bool:
      should:
      - wildcard:
          fields.file_path.kw:
            value: '*.encrypted*'
            case_insensitive: true
      - wildcard:
          fields.file_path.kw:
            value: '*.locked*'
            case_insensitive: true
      - wildcard:
          fields.file_path.kw:
            value: '*.crypt*'
            case_insensitive: true
      - wildcard:
          fields.file_path.kw:
            value: '*readme*'
            case_insensitive: true
      - wildcard:
          fields.file_path.kw:
            value: '*ransom*'
            case_insensitive: true
      minimum_should_match: 1
  requires:
    families: *id001
- name: service_stop
  query: sc stop OR net stop OR service stop
  look_for: Mass service stops (database, backup, AV) before encryption.
  pivot: ServiceName
  es:
    bool:
      should:
      - wildcard:
          fields.PayloadData4.kw:
            value: '*sc stop*'
            case_insensitive: true
      - wildcard:
          fields.PayloadData4.kw:
            value: '*net stop*'
            case_insensitive: true
      - wildcard:
          fields.PayloadData4.kw:
            value: '*service stop*'
            case_insensitive: true
      minimum_should_match: 1
  requires:
    families: *id001
- name: crypto_process
  query: cipher /w OR diskcryptor OR vboxdrv
  look_for: Disk-encryption tool execution or crypto-loop patterns.
  pivot: ProcessName
  es:
    bool:
      should:
      - wildcard:
          text.wc:
            value: '*cipher /w*'
            case_insensitive: true
      - wildcard:
          fields.process_name.kw:
            value: '*diskcryptor*'
            case_insensitive: true
      - wildcard:
          fields.process_name.kw:
            value: '*vboxdrv*'
            case_insensitive: true
      minimum_should_match: 1
  requires:
    families: *id001
  es_text_only_reason:
  - 'cipher /w: value of the wrong kind for process_name; searched in text'
- name: backward_analysis
  query: rdp OR 4624 OR msiexec OR phish
  look_for: 'Work BACKWARD from impact: ransomware investigations begin at the ransomed/highest-activity
    hosts, then trace back to entry. Most common IAB vectors to hunt: exposed internet-facing
    RDP (the most common ransomware entry — hunt illegitimate external RDP), border-
    device exploit, phishing, purchased credentials/access.'
  corroborate: first ransom-note write time → work backward through lateral movement
    → initial access on the earliest-affected host
  pivot: IpAddress
  requires:
    families: *id001
  kind: procedure
  procedure_reason: 'R0'' defect: this step''s look_for is an investigation ORDER
    (do X, then Y), not evidence to search. It is shown to agents as a procedure and
    never executed, so it cannot fire on noise and cannot count as coverage.'
  es_dropped:
  - term: sha256
    reason: 'procedure verb, not evidence: hashing is what the examiner does, not
      what is searched for'
  - term: md5
    reason: procedure verb, not evidence
  - term: hash
    reason: procedure verb, not evidence
  - term: kape
    reason: names a tool the examiner runs, not a field value to search for
  - term: triage
    reason: procedure verb, not evidence
  - term: bitlocker
    reason: a pre-acquisition decision, not a search over indexed evidence
  - term: encryption
    reason: procedure verb, not evidence
  - term: encrypted
    reason: procedure verb, not evidence
  - term: rdp
    reason: an entry vector named in the procedure, not a column value
  - term: phish
    reason: an entry vector named in the procedure
  - term: msiexec
    reason: an entry vector named in the procedure, not a column value
  - term: event_id 4624
    reason: a real clue, but this step is the order of investigation, not a search
      for it
negative: No shadow deletion, recovery disable, or mass-encryption artifacts → impact
  phase not reached or aborted.
confidence_rules:
  high: vss delete + bcdedit recovery-off + mass rename/encrypt + ransom note
  medium: shadow deletion + backup kill without confirmed encryption
  low: isolated vssadmin (admin maintenance possible)
mitre:
- T1490
- T1486
- T1489
