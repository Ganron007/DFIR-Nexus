                  - '1'
          - bool:
              filter:
              - term:
                  ecs.winlog.channel:
                    value: Security
                    case_insensitive: true
              - terms:
                  event_id:
                  - '4688'
          minimum_should_match: 1
  source: Sysmon 1; Security 4688
  search:
    basis:
    - attack:DET0329
    - manifest
    - evtx-map
    events:
    - channel: Microsoft-Windows-Sysmon/Operational
      codes:
      - '1'
    - channel: Security
      codes:
      - '4688'
    all:
    - field: ecs.process.executable
      endswith:
      - \bcdedit.exe
    - field: ecs.process.command_line
      contains:
      - recoveryenabled
      - bootstatuspolicy
      - safeboot
  es:
    bool:
      filter:
      - bool:
          should:
          - bool:
              filter:
              - term:
                  ecs.winlog.channel:
                    value: Microsoft-Windows-Sysmon/Operational
                    case_insensitive: true
              - terms:
                  event_id:
                  - '1'
          - bool:
              filter:
              - term:
                  ecs.winlog.channel:
                    value: Security
                    case_insensitive: true
              - terms:
                  event_id:
                  - '4688'
          minimum_should_match: 1
      - wildcard:
          ecs.process.executable.wc:
            value: '*\\bcdedit.exe'
            case_insensitive: true
      - bool:
          should:
          - wildcard:
              ecs.process.command_line.wc:
                value: '*recoveryenabled*'
                case_insensitive: true
          - wildcard:
              ecs.process.command_line.wc:
                value: '*bootstatuspolicy*'
                case_insensitive: true
          - wildcard:
              ecs.process.command_line.wc:
                value: '*safeboot*'
                case_insensitive: true
          minimum_should_match: 1
