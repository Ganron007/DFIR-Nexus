- name: mass_encryption
  query: .encrypted OR .locked OR .crypt OR readme OR ransom
  look_for: Mass file renames to ransom extensions; readme/ransom-note files in mft/usn with high write rates.
  pivot: FileName
  requires:
    families:
    - mftecmd
  es_source:
    bool:
      filter:
      - terms:
          family:
          - mftecmd
  source: families mftecmd
  kind: aggregate
  search:
    families:
    - mftecmd
    all:
    - field: fields.UpdateReasons
      contains:
      - RenameNewName
  aggregate:
    field: ecs.file.extension
    size: 30
  es:
    bool:
      filter:
      - terms:
          family:
          - mftecmd
      - wildcard:
          fields.UpdateReasons.kw:
            value: '*RenameNewName*'
            case_insensitive: true
  es_aggs:
    by:
      terms:
        field: ecs.file.extension
        size: 30
