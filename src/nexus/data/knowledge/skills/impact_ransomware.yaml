- name: backward_analysis
  query: rdp OR 4624 OR msiexec OR phish
  look_for: 'Work BACKWARD from impact: ransomware investigations begin at the ransomed/highest-activity hosts,
    then trace back to entry. Most common IAB vectors to hunt: exposed internet-facing RDP (the most common ransomware
    entry — hunt illegitimate external RDP), border- device exploit, phishing, purchased credentials/access.'
  corroborate: first ransom-note write time → work backward through lateral movement → initial access on the earliest-affected
    host
  pivot: IpAddress
  kind: procedure
  procedure_reason: 'R0'' defect: this step''s look_for is an investigation ORDER (do X, then Y), not evidence to
    search. It is shown to agents as a procedure and never executed, so it cannot fire on noise and cannot count
    as coverage.'
negative: No shadow deletion, recovery disable, or mass-encryption artifacts → impact phase not reached or aborted.
confidence_rules:
  high: vss delete + bcdedit recovery-off + mass rename/encrypt + ransom note
  medium: shadow deletion + backup kill without confirmed encryption
  low: isolated vssadmin (admin maintenance possible)
mitre:
- T1490
- T1486
- T1489
caveats:
- Backup software legitimately manages shadows — check the account and schedule context.
- Some ransomware skips vss delete if it can encrypt directly — check for mass file writes instead.
