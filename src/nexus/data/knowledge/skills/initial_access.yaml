- name: iab_vector_check
  query: rdp OR 4625 OR edge OR vpn OR exchange
  look_for: 'If no user-execution artifact explains entry, check the four dominant IAB vectors: exposed internet-facing
    RDP (most common ransomware/ intrusion entry — external 4624 type-10), border-device/VPN exploit, phishing delivery,
    and purchased credentials (valid-account logon with no payload artifact at all).'
  corroborate: external-IP logon preceding first malicious activity by hours/days
  kind: procedure
  procedure_reason: an order of method (when no user-execution artefact explains entry, test the four access vectors
    in turn); each vector has its own search (rdp_sessions, remote_logons, the email and browser steps).
negative: No LNK/MSI/CHM artifacts and no office-spawn chains → initial access likely arrived through a different
  vector (exposed service, creds, drive-by).
confidence_rules:
  high: downloaded artifact (Zone.Identifier) + exec artifact (prefetch/amcache) + child-process chain
  medium: payload exec artifact without clear delivery vector
  low: single unsigned exec — corroborate delivery + persistence
mitre:
- T1204
- T1566.001
- T1204.001
- T1204.002
caveats:
- Users legitimately run MSIs and macros — the delivery chain (download → MOTW → exec) is what matters.
- LNK files are everywhere; focus on recent ones in download/desktop/temp paths.
