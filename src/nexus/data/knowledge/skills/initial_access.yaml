skill: initial_access
title: Initial access — LNK / MSI / CHM / HTML smuggling / macro
description: Detect user-execution initial-access payloads — shortcut files, MSI installers, compiled help files,
  HTML smuggling, office macros.
trigger:
  families:
  - lnk
  - mft
  - usn
  - prefetch
  - evtx
  - amcache
  - jumplist
  - browser
  keywords:
  - lnk
  - msi
  - chm
  - iso
  - smuggl
  - macro
  - invoice
  - attachment
  - download
  techniques:
  - T1204.001
  - T1204.002
  - T1204
  - T1566.001
steps:
- name: lnk_artifacts
  query: .lnk invoice document shortcut
  look_for: LNK files in Downloads/Desktop/Temp with recent creation; check the LNK target (cmd/powershell/mshta/rundll32
    children).
  pivot: LocalPath
  requires:
    families:
    - lecmd
    - jlecmd
  es_source:
    bool:
      filter:
      - terms:
          family:
          - lecmd
          - jlecmd
  source: families lecmd, jlecmd
  search:
    basis: []
    families:
    - lecmd
    - jlecmd
    any:
    - field: ecs.file.path
      endswith:
      - \cmd.exe
      - \powershell.exe
      - \mshta.exe
      - \rundll32.exe
      - \wscript.exe
      - \cscript.exe
      - \regsvr32.exe
  es:
    bool:
      filter:
      - terms:
          family:
          - lecmd
          - jlecmd
      - bool:
          should:
          - wildcard:
              ecs.file.path.wc:
                value: '*\\cmd.exe'
                case_insensitive: true
          - wildcard:
              ecs.file.path.wc:
                value: '*\\powershell.exe'
                case_insensitive: true
          - wildcard:
              ecs.file.path.wc:
                value: '*\\mshta.exe'
                case_insensitive: true
          - wildcard:
              ecs.file.path.wc:
                value: '*\\rundll32.exe'
                case_insensitive: true
          - wildcard:
              ecs.file.path.wc:
                value: '*\\wscript.exe'
                case_insensitive: true
          - wildcard:
              ecs.file.path.wc:
                value: '*\\cscript.exe'
                case_insensitive: true
          - wildcard:
              ecs.file.path.wc:
                value: '*\\regsvr32.exe'
                case_insensitive: true
          minimum_should_match: 1
- name: msi_execution
  query: msiexec /i OR .msi MsiInstaller
  look_for: msiexec executions of unsigned/downloaded MSIs; MsiInstaller events 11707 (install success) near the
    suspected window.
  pivot: CommandLine
  requires:
    families:
    - kind:evtx
  es_source:
    bool:
      filter:
      - bool:
          should:
          - bool:
              filter:
              - term:
                  ecs.winlog.channel:
                    value: Microsoft-Windows-Sysmon/Operational
                    case_insensitive: true
              - terms:
                  event_id:
                  - '1'
          - bool:
              filter:
              - term:
                  ecs.winlog.channel:
                    value: Security
                    case_insensitive: true
              - terms:
                  event_id:
                  - '4688'
          - bool:
              filter:
              - term:
                  ecs.winlog.channel:
                    value: Application
                    case_insensitive: true
              - terms:
                  event_id:
                  - '11707'
                  - '1033'
          minimum_should_match: 1
  source: Sysmon 1; Security 4688; Application 11707, 1033
  search:
    basis:
    - attack:DET0158
    - evtx-map
    events:
    - channel: Microsoft-Windows-Sysmon/Operational
      codes:
      - '1'
    - channel: Security
      codes:
      - '4688'
    - channel: Application
      codes:
      - '11707'
      - '1033'
    any:
    - field: event_id
      is:
      - '11707'
      - '1033'
    - field: ecs.process.command_line
      contains:
      - /i http
      - /i "http
      - /q http
      - /i \\
  es:
    bool:
      filter:
      - bool:
          should:
          - bool:
              filter:
              - term:
                  ecs.winlog.channel:
                    value: Microsoft-Windows-Sysmon/Operational
                    case_insensitive: true
              - terms:
                  event_id:
                  - '1'
          - bool:
              filter:
              - term:
                  ecs.winlog.channel:
                    value: Security
                    case_insensitive: true
              - terms:
                  event_id:
                  - '4688'
          - bool:
              filter:
              - term:
                  ecs.winlog.channel:
                    value: Application
                    case_insensitive: true
              - terms:
                  event_id:
                  - '11707'
                  - '1033'
          minimum_should_match: 1
      - bool:
          should:
          - bool:
              should:
              - term:
                  event_id: '11707'
              - term:
                  event_id: '1033'
              minimum_should_match: 1
          - bool:
              should:
              - wildcard:
                  ecs.process.command_line.wc:
                    value: '*/i http*'
                    case_insensitive: true
              - wildcard:
                  ecs.process.command_line.wc:
                    value: '*/i "http*'
                    case_insensitive: true
              - wildcard:
                  ecs.process.command_line.wc:
                    value: '*/q http*'
                    case_insensitive: true
              - wildcard:
                  ecs.process.command_line.wc:
                    value: '*/i \\\\*'
                    case_insensitive: true
              minimum_should_match: 1
          minimum_should_match: 1
