- name: html_smuggling_download
  query: '.html blob: download FromCache OR browser'
  look_for: Browser download of an HTML file followed by a new .exe/.dll write.
  pivot: URL
  requires:
    families:
    - sqlecmd
    - hindsight
  es_source:
    bool:
      filter:
      - terms:
          family:
          - sqlecmd
          - hindsight
  source: families sqlecmd, hindsight
  search:
    families:
    - sqlecmd
    - hindsight
    any:
    - field: fields.TargetPath
      endswith:
      - .html
      - .htm
      - .hta
      - .svg
    - field: fields.url
      endswith:
      - .html
      - .htm
      - .hta
  es:
    bool:
      filter:
      - terms:
          family:
          - sqlecmd
          - hindsight
      - bool:
          should:
          - bool:
              should:
              - wildcard:
                  fields.TargetPath.kw:
                    value: '*.html'
                    case_insensitive: true
              - wildcard:
                  fields.TargetPath.kw:
                    value: '*.htm'
                    case_insensitive: true
              - wildcard:
                  fields.TargetPath.kw:
                    value: '*.hta'
                    case_insensitive: true
              - wildcard:
                  fields.TargetPath.kw:
                    value: '*.svg'
                    case_insensitive: true
              minimum_should_match: 1
          - bool:
              should:
              - wildcard:
                  fields.url.kw:
                    value: '*.html'
                    case_insensitive: true
              - wildcard:
                  fields.url.kw:
                    value: '*.htm'
                    case_insensitive: true
              - wildcard:
                  fields.url.kw:
                    value: '*.hta'
                    case_insensitive: true
              minimum_should_match: 1
          minimum_should_match: 1
- name: motw_mark
  query: Zone.Identifier Mark-of-the-Web OR ZoneId=3
  look_for: Zone.Identifier ADS on downloaded files (ZoneId=3 = internet).
  pivot: FileName
  requires:
    families:
    - kind:evtx
    - mftecmd
  es_source:
    bool:
      filter:
      - bool:
          should:
          - bool:
              filter:
              - term:
                  ecs.winlog.channel:
                    value: Microsoft-Windows-Sysmon/Operational
                    case_insensitive: true
              - terms:
                  event_id:
                  - '15'
          - terms:
              family:
              - mftecmd
          minimum_should_match: 1
  source: Sysmon 15; families mftecmd
  search:
    basis:
    - attack:DET0294
    events:
    - channel: Microsoft-Windows-Sysmon/Operational
      codes:
      - '15'
    families:
    - mftecmd
    any:
    - field: ecs.file.name
      endswith:
      - :Zone.Identifier
    - field: ecs.winlog.event_data.TargetFilename
      endswith:
      - :Zone.Identifier
    - field: fields.ZoneIdContents
      contains:
      - ZoneId=3
  es:
    bool:
      filter:
      - bool:
          should:
          - bool:
              filter:
              - term:
                  ecs.winlog.channel:
                    value: Microsoft-Windows-Sysmon/Operational
                    case_insensitive: true
              - terms:
                  event_id:
                  - '15'
          - terms:
              family:
              - mftecmd
          minimum_should_match: 1
      - bool:
          should:
          - wildcard:
              ecs.file.name.wc:
                value: '*:Zone.Identifier'
                case_insensitive: true
          - wildcard:
              ecs.winlog.event_data.TargetFilename.wc:
                value: '*:Zone.Identifier'
                case_insensitive: true
          - wildcard:
              fields.ZoneIdContents.kw:
                value: '*ZoneId=3*'
                case_insensitive: true
          minimum_should_match: 1
