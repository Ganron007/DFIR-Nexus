# kb: d_ae743ea2444d:c0082 (FOR528 — dominant IAB vectors: exposed RDP,
#      border-device exploit, phishing, purchased access/creds)
# kb: EIR CH4-2 (LNK interactive artifacts), FOR500 (LNK/MOTW parsing),
#      CCD M5 (execution-artifact corroboration chain)
skill: initial_access
title: Initial access — LNK / MSI / CHM / HTML smuggling / macro
description: Detect user-execution initial-access payloads — shortcut files, MSI installers,
  compiled help files, HTML smuggling, office macros.
trigger:
  families:
  - lnk
  - mft
  - usn
  - prefetch
  - evtx
  - sysmon
  - amcache
  - jumplist
  - browser
  keywords:
  - lnk
  - msi
  - chm
  - iso
  - smuggl
  - macro
  - invoice
  - attachment
  - download
  techniques:
  - T1204.001
  - T1204.002
  - T1204
  - T1566.001
steps:
- name: lnk_artifacts
  query: .lnk invoice document shortcut
  look_for: LNK files in Downloads/Desktop/Temp with recent creation; check the LNK
    target (cmd/powershell/mshta/rundll32 children).
  pivot: LocalPath
  es:
    bool:
      must:
      - wildcard:
          fields.file_path.kw:
            value: '*.lnk*'
            case_insensitive: true
      - wildcard:
          fields.LocalPath.kw:
            value: '*invoice document shortcut*'
            case_insensitive: true
  requires:
    families: &id001
    - lnk
    - mft
    - usn
    - prefetch
    - evtx
    - sysmon
    - amcache
    - jumplist
    - browser
- name: msi_execution
  query: msiexec /i OR .msi MsiInstaller
  look_for: msiexec executions of unsigned/downloaded MSIs; MsiInstaller events 11707
    (install success) near the suspected window.
  pivot: CommandLine
  es:
    bool:
      should:
      - wildcard:
          text.wc:
            value: '*msiexec /i*'
            case_insensitive: true
      - bool:
          must:
          - wildcard:
              fields.file_path.kw:
                value: '*.msi*'
                case_insensitive: true
          - wildcard:
              text.wc:
                value: '*MsiInstaller*'
                case_insensitive: true
      minimum_should_match: 1
  requires:
    families: *id001
  es_text_only_reason:
  - 'msiexec /i: free phrase; the step''s pivot names no registry column'
  - 'MsiInstaller: free phrase; the step''s pivot names no registry column'
- name: chm_execution
  query: hh.exe OR .chm
  look_for: hh.exe spawning cmd/powershell — CHM Shortcut-object abuse.
  pivot: ParentImage
  es:
    bool:
      should:
      - wildcard:
          fields.file_path.kw:
            value: '*hh.exe*'
            case_insensitive: true
      - wildcard:
          text.wc:
            value: '*.chm*'
            case_insensitive: true
      minimum_should_match: 1
  requires:
    families: *id001
  es_text_only_reason:
  - '.chm: free phrase; the step''s pivot names no registry column'
- name: html_smuggling_download
  query: '.html blob: download FromCache OR browser'
  look_for: Browser download of an HTML file followed by a new .exe/.dll write.
  pivot: URL
  es:
    bool:
      should:
      - wildcard:
          text.wc:
            value: '*.html download FromCache*'
            case_insensitive: true
      - wildcard:
          text.wc:
            value: '*browser*'
            case_insensitive: true
      minimum_should_match: 1
  requires:
    families: *id001
  es_text_only_reason:
  - '.html download FromCache: free phrase; the step''s pivot names no registry column'
  - 'browser: free phrase; the step''s pivot names no registry column'
  es_dropped:
  - term: 'blob:'
    reason: field filter with no value
- name: motw_mark
  query: Zone.Identifier Mark-of-the-Web OR ZoneId=3
  look_for: Zone.Identifier ADS on downloaded files (ZoneId=3 = internet).
  pivot: FileName
  es:
    bool:
      should:
      - wildcard:
          fields.file_path.kw:
            value: '*Zone.Identifier Mark-of-the-Web*'
            case_insensitive: true
      - wildcard:
          fields.file_path.kw:
            value: '*ZoneId=3*'
            case_insensitive: true
      minimum_should_match: 1
  requires:
    families: *id001
- name: office_spawns
  query: winword.exe OR excel.exe OR powerpnt.exe cmd.exe powershell.exe
  look_for: Office binaries spawning script interpreters — macro execution.
  pivot: ParentImage
  es:
    bool:
      should:
      - wildcard:
          fields.file_path.kw:
            value: '*winword.exe*'
            case_insensitive: true
      - wildcard:
          fields.file_path.kw:
            value: '*excel.exe*'
            case_insensitive: true
      - bool:
          must:
          - wildcard:
              fields.file_path.kw:
                value: '*powerpnt.exe*'
                case_insensitive: true
          - wildcard:
              fields.file_path.kw:
                value: '*cmd.exe*'
                case_insensitive: true
          - wildcard:
              fields.file_path.kw:
                value: '*powershell.exe*'
                case_insensitive: true
      minimum_should_match: 1
  requires:
    families: *id001
- name: child_process_anomaly
  query: explorer.exe cmd.exe OR explorer.exe powershell.exe OR explorer.exe mshta.exe
  look_for: Script interpreters parented by explorer.exe near payload arrival.
  pivot: CommandLine
  es:
    bool:
      should:
      - bool:
          must:
          - wildcard:
              fields.file_path.kw:
                value: '*explorer.exe*'
                case_insensitive: true
          - wildcard:
              fields.file_path.kw:
                value: '*cmd.exe*'
                case_insensitive: true
      - bool:
          must:
          - wildcard:
              fields.file_path.kw:
                value: '*explorer.exe*'
                case_insensitive: true
          - wildcard:
              fields.file_path.kw:
                value: '*powershell.exe*'
                case_insensitive: true
      - bool:
          must:
          - wildcard:
              fields.file_path.kw:
                value: '*explorer.exe*'
                case_insensitive: true
          - wildcard:
              fields.file_path.kw:
                value: '*mshta.exe*'
                case_insensitive: true
      minimum_should_match: 1
  requires:
    families: *id001
- name: iab_vector_check
  query: rdp OR 4625 OR edge OR vpn OR exchange
  look_for: 'If no user-execution artifact explains entry, check the four dominant
    IAB vectors: exposed internet-facing RDP (most common ransomware/ intrusion entry
    — external 4624 type-10), border-device/VPN exploit, phishing delivery, and purchased
    credentials (valid-account logon with no payload artifact at all).'
  corroborate: external-IP logon preceding first malicious activity by hours/days
  es:
    bool:
      should:
      - wildcard:
          text.wc:
            value: '*rdp*'
            case_insensitive: true
      - term:
          event_id: '4625'
      - wildcard:
          text.wc:
            value: '*edge*'
            case_insensitive: true
      - wildcard:
          text.wc:
            value: '*vpn*'
            case_insensitive: true
      - wildcard:
          text.wc:
            value: '*exchange*'
            case_insensitive: true
      minimum_should_match: 1
  requires:
    families: *id001
  es_text_only_reason:
  - 'rdp: free phrase; the step''s pivot names no registry column'
  - 'edge: free phrase; the step''s pivot names no registry column'
  - 'vpn: free phrase; the step''s pivot names no registry column'
  - 'exchange: free phrase; the step''s pivot names no registry column'
negative: No LNK/MSI/CHM artifacts and no office-spawn chains → initial access likely
  arrived through a different vector (exposed service, creds, drive-by).
confidence_rules:
  high: downloaded artifact (Zone.Identifier) + exec artifact (prefetch/amcache) +
    child-process chain
  medium: payload exec artifact without clear delivery vector
  low: single unsigned exec — corroborate delivery + persistence
mitre:
- T1204
- T1566.001
- T1204.001
- T1204.002
