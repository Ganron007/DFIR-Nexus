caveats:
- File-server and admin activity legitimately produces 4624 type-3 — corroborate with
  share/service/task artifacts.
- psexesvc can be renamed — look for unsigned/random service names, not just the literal
  string.
- UAL is server-only (2012+) and role-granular — it names the role accessed, not the
  command run; absent UAL data is not absent movement.
- Cleared Security.evtx does not erase interactive-access artifacts — check profile
  creation, LNKs, and registry MRU before calling 'no hands-on'.
