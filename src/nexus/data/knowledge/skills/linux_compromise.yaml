caveats:
- Shell history is unreliable by design — flushed only on shell exit, easily cleared,
  ordering not guaranteed. Never claim 'no commands ran' from empty history.
- utmp/wtmp/btmp are binary databases — strings/grep corrupts interpretation; use
  last/lastb/utmpdump.
- systemd .timer + .service pairs must be checked TOGETHER — a benign-looking service
  gains schedule from its timer.
- Containers/VMs may forward logs to syslog/journald remotely — check local AND forwarded
  stores before calling gaps.
