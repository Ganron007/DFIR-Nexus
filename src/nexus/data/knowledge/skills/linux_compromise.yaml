# kb: d_8081577ff5db (SANS Linux IR poster — auth.log/secure/utmp/wtmp/btmp,
#      $HISTFILE limits: live-system only, written on shell exit, order
#      unreliable; /etc/passwd, resolv.conf checks)
# kb: d_ff8a3b9b0042 (13C Linux 6 — systemd timer/service persistence:
#      OnCalendar=hourly, one-shot ExecStart exfil service)
# kb: 13C Linux Devices (pslist/MalFind on Linux memory, live response)
skill: linux_compromise
title: Linux compromise — auth logs, persistence, history, systemd
platform: linux
description: 'Investigate a Linux host: authentication logs (auth.log/secure, binary
  utmp/wtmp/btmp), shell-history forensics with its documented limits, systemd/cron
  persistence, unexpected accounts, and memory-resident malware via Linux.MalFind.'
trigger:
  families:
  - linux
  - syslog
  - authlog
  - journal
  - bash
  - memory
  keywords:
  - linux
  - ssh
  - auth.log
  - cron
  - systemd
  - bash_history
  - persistence
  - root
  - sudo
  - wtmp
  techniques:
  - T1053.003
  - T1543.002
  - T1078
  - T1059.004
  - T1070.002
steps:
- name: auth_log_analysis
  query: auth.log OR secure OR Failed password OR Accepted
  look_for: 'Authentication logs first: auth.log/secure for failed→accepted sequences
    (brute-force then success), logins at odd hours/from foreign IPs, sudo usage.
    utmp/wtmp/btmp are BINARY — parse with last/lastb, don''t grep them.'
  pivot: user
  corroborate: failed-login burst from IP X followed by accepted login = credential
    attack path
  es:
    bool:
      should:
      - wildcard:
          text.wc:
            value: '*auth.log*'
            case_insensitive: true
      - wildcard:
          text.wc:
            value: '*secure*'
            case_insensitive: true
      - wildcard:
          text.wc:
            value: '*Failed password*'
            case_insensitive: true
      - wildcard:
          text.wc:
            value: '*Accepted*'
            case_insensitive: true
      minimum_should_match: 1
  requires:
    families: &id001
    - linux
    - syslog
    - authlog
    - journal
    - bash
    - memory
  es_text_only_reason:
  - 'auth.log: a file name token; the value-shape file_path route is removed (WO-CS1
    moves it to ecs.file.path), searched in text'
  - 'secure: free phrase; the step''s pivot is an identity column'
  - 'Failed password: free phrase; the step''s pivot is an identity column'
  - 'Accepted: free phrase; the step''s pivot is an identity column'
- name: shell_history
  query: history OR .bash_history OR $HISTFILE
  look_for: 'Shell history shows intent — but know its documented limits: $HISTFILE
    only exists on a live system, is written only on shell EXIT (attackers'' sessions
    may never flush), ordering is unreliable, and attackers clear it. Absence of history
    ≠ absence of commands.'
  pivot: FileName
  corroborate: history entries ↔ auth.log session ↔ file-timestamp corroboration
  es:
    bool:
      should:
      - wildcard:
          text.wc:
            value: '*history*'
            case_insensitive: true
      - wildcard:
          text.wc:
            value: '*.bash_history*'
            case_insensitive: true
      - wildcard:
          text.wc:
            value: '*$HISTFILE*'
            case_insensitive: true
      minimum_should_match: 1
  requires:
    families: *id001
  es_text_only_reason:
  - 'history: file-path pivot; the value-shape route is removed (WO-CS1 moves it to
    ecs.file.path), searched in text'
  - '.bash_history: file-path pivot; the value-shape route is removed (WO-CS1 moves
    it to ecs.file.path), searched in text'
  - '$HISTFILE: file-path pivot; the value-shape route is removed (WO-CS1 moves it
    to ecs.file.path), searched in text'
- name: persistence_mechanisms
  query: cron OR systemd OR .timer OR ExecStart
  look_for: 'Linux persistence: crontab files (per-user spool + /etc/cron.*), systemd
    services AND TIMERS (OnCalendar= — 13C example: a ''one-shot'' ExecStart exfil
    service fired hourly by its .timer), rc.local, bashrc/profile hooks, SSH authorized_keys
    additions.'
  pivot: FileName
  es:
    bool:
      should:
      - wildcard:
          text.wc:
            value: '*cron*'
            case_insensitive: true
      - wildcard:
          text.wc:
            value: '*systemd*'
            case_insensitive: true
      - wildcard:
          text.wc:
            value: '*.timer*'
            case_insensitive: true
      - wildcard:
          text.wc:
            value: '*ExecStart*'
            case_insensitive: true
      minimum_should_match: 1
  requires:
    families: *id001
  es_text_only_reason:
  - 'cron: file-path pivot; the value-shape route is removed (WO-CS1 moves it to ecs.file.path),
    searched in text'
  - 'systemd: file-path pivot; the value-shape route is removed (WO-CS1 moves it to
    ecs.file.path), searched in text'
  - '.timer: file-path pivot; the value-shape route is removed (WO-CS1 moves it to
    ecs.file.path), searched in text'
  - 'ExecStart: file-path pivot; the value-shape route is removed (WO-CS1 moves it
    to ecs.file.path), searched in text'
- name: account_anomalies
  query: passwd OR /etc/passwd OR sudoers OR useradd
  look_for: /etc/passwd for unexpected accounts (UID 0 backdoor users), sudoers modifications,
    authorized_keys additions — account artifacts persist after the attacker's session
    ends.
  pivot: user
  es:
    bool:
      should:
      - wildcard:
          text.wc:
            value: '*passwd*'
            case_insensitive: true
      - wildcard:
          text.wc:
            value: '*/etc/passwd*'
            case_insensitive: true
      - wildcard:
          text.wc:
            value: '*sudoers*'
            case_insensitive: true
      - wildcard:
          text.wc:
            value: '*useradd*'
            case_insensitive: true
      minimum_should_match: 1
  requires:
    families: *id001
  es_text_only_reason:
  - 'passwd: free phrase; the step''s pivot is an identity column'
  - '/etc/passwd: free phrase; the step''s pivot is an identity column'
  - 'sudoers: free phrase; the step''s pivot is an identity column'
  - 'useradd: free phrase; the step''s pivot is an identity column'
- name: process_memory_check
  query: pslist OR malfind OR /proc OR kmem
  look_for: 'Linux memory analysis: Linux.PsList/Linux.MalFind for process enumeration
    and injected/executable-anonymous memory — fileless Linux malware lives in /dev/shm,
    memfd, or injected regions.'
  pivot: ProcessName
  es:
    bool:
      should:
      - wildcard:
          text.wc:
            value: '*pslist*'
            case_insensitive: true
      - wildcard:
          text.wc:
            value: '*malfind*'
            case_insensitive: true
      - wildcard:
          text.wc:
            value: '*/proc*'
            case_insensitive: true
      - wildcard:
          text.wc:
            value: '*kmem*'
            case_insensitive: true
      minimum_should_match: 1
  requires:
    families: *id001
  es_text_only_reason:
  - 'pslist: value of the wrong kind for process_name; searched in text'
  - 'malfind: value of the wrong kind for process_name; searched in text'
  - '/proc: value of the wrong kind for process_name; searched in text'
  - 'kmem: value of the wrong kind for process_name; searched in text'
- name: log_integrity
  query: log cleared OR journald OR syslog OR auditd
  look_for: 'Anti-forensics on Linux: truncated log files, journald vacuumed, auditd
    rules removed, syslog forwarded-then-deleted. Check for gaps in sequential log
    numbering and journal integrity.'
  corroborate: gap between last-clean and first-new log entries
  es:
    bool:
      should:
      - wildcard:
          text.wc:
            value: '*log cleared*'
            case_insensitive: true
      - wildcard:
          text.wc:
            value: '*journald*'
            case_insensitive: true
      - wildcard:
          text.wc:
            value: '*syslog*'
            case_insensitive: true
      - wildcard:
          text.wc:
            value: '*auditd*'
            case_insensitive: true
      minimum_should_match: 1
  requires:
    families: *id001
  es_text_only_reason:
  - 'log cleared: free phrase; the step''s pivot names no registry column'
  - 'journald: free phrase; the step''s pivot names no registry column'
  - 'syslog: free phrase; the step''s pivot names no registry column'
  - 'auditd: free phrase; the step''s pivot names no registry column'
negative: 'No auth anomalies, persistence artifacts, or history evidence → Linux compromise
  not evident in collected telemetry. Note: minimal installs and containers ship sparse
  logging — absence may be configuration, not cleanliness.'
confidence_rules:
  high: brute-force→success + persistence artifact + exec corroboration (history/persistence
    contents)
  medium: suspicious auth + one persistence mechanism without exec proof
  low: single odd login (legitimate remote admin plausible)
mitre:
- T1053.003
- T1543.002
- T1078
- T1059.004
