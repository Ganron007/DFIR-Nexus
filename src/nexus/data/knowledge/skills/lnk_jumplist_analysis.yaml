caveats:
- LNK creation is user-driven — files opened by services, tasks, or scripts leave
  no LNK; absence proves nothing about machine actions.
- A LNK proves the file was OPENED at least once — not that it was created on this
  host nor that it still exists.
- Jumplist AppID names are hash-derived — resolve the AppID to the application before
  attributing usage.
- Deleting a file does NOT delete its LNKs — stale LNKs pointing at long-gone paths
  are normal; use timestamps.
