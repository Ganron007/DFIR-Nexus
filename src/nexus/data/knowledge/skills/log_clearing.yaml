caveats:
- Some SOCs clear logs during maintenance — check SubjectUserName against admin accounts
  and change windows.
- A missing Sysmon sequence may mean the service was never running — check install
  state before claiming tamper.
- Anti-forensics effectiveness is a race against response time — months-old intrusions
  may be fully covered; hours-old rarely are. Check residual artifact stores before
  concluding 'wiped clean'.
