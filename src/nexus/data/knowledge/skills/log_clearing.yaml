# kb: d_a1d3c2f01b9b:c0004 (FOR508.5 — anti-forensics limits: cannot fully
#      destroy all references; single surviving artifact still proves
#      compromise; response-time vs destruction-time race)
# kb: CCD M5 T-EventLogs (1102/104 analysis, gap profiling)
skill: log_clearing
title: Event log clearing and audit tampering
description: Detect clearing of Security/System/Application logs, audit-policy changes,
  and Sysmon service tampering — anti-forensics.
trigger:
  families:
  - evtx
  - sysmon
  - security
  - hayabusa
  - services
  keywords:
  - clear
  - wevtutil
  - auditpol
  - tamper
  - anti-forensic
  - sysmon
  techniques:
  - T1070.001
  - T1070
  - T1562.002
steps:
- name: security_log_cleared
  query: '1102'
  look_for: Security EventID 1102 (audit log cleared) — check SubjectUserName and
    the gap in preceding events.
  pivot: SubjectUserName
  es:
    term:
      event_id: '1102'
  requires:
    families: &id001
    - evtx
    - sysmon
    - security
    - hayabusa
    - services
- name: system_log_cleared
  query: '104'
  look_for: System EventID 104 (event log cleared) by an interactive user.
  pivot: SubjectUserName
  es:
    wildcard:
      text.wc:
        value: '*104*'
        case_insensitive: true
  requires:
    families: *id001
  es_text_only_reason:
  - '104: free phrase; the step''s pivot is an identity column'
- name: wevtutil_execution
  query: wevtutil cl OR wevtutil clear-log
  look_for: wevtutil cl <log> executions in process creation / prefetch.
  pivot: CommandLine
  es:
    bool:
      should:
      - wildcard:
          fields.command_line.kw:
            value: '*wevtutil cl*'
            case_insensitive: true
      - wildcard:
          fields.command_line.kw:
            value: '*wevtutil clear-log*'
            case_insensitive: true
      minimum_should_match: 1
  requires:
    families: *id001
- name: audit_policy_change
  query: auditpol /clear OR auditpol /set OR 4719
  look_for: auditpol clearing or 4719 audit-policy change events.
  pivot: CommandLine
  es:
    bool:
      should:
      - wildcard:
          fields.command_line.kw:
            value: '*auditpol /clear*'
            case_insensitive: true
      - wildcard:
          fields.command_line.kw:
            value: '*auditpol /set*'
            case_insensitive: true
      - term:
          event_id: '4719'
      minimum_should_match: 1
  requires:
    families: *id001
- name: sysmon_tamper
  query: Sysmon service stopped OR sysmon.exe delete OR sc stop sysmon
  look_for: Sysmon service stop/delete — blinds telemetry collection.
  corroborate: gap in Sysmon event sequence
  es:
    bool:
      should:
      - wildcard:
          text.wc:
            value: '*Sysmon service stopped*'
            case_insensitive: true
      - bool:
          must:
          - wildcard:
              text.wc:
                value: '*sysmon.exe*'
                case_insensitive: true
          - wildcard:
              text.wc:
                value: '*delete*'
                case_insensitive: true
      - wildcard:
          text.wc:
            value: '*sc stop sysmon*'
            case_insensitive: true
      minimum_should_match: 1
  requires:
    families: *id001
  es_text_only_reason:
  - 'Sysmon service stopped: free phrase; the step''s pivot names no registry column'
  - 'sysmon.exe: a file name token; the value-shape file_path route is removed (WO-CS1
    moves it to ecs.file.path), searched in text'
  - 'delete: free phrase; the step''s pivot names no registry column'
  - 'sc stop sysmon: free phrase; the step''s pivot names no registry column'
- name: usn_journal_delete
  query: fsutil usn deletejournal OR usn delete
  look_for: USN journal deletion (destroys file-change history).
  es:
    bool:
      should:
      - wildcard:
          text.wc:
            value: '*fsutil usn deletejournal*'
            case_insensitive: true
      - wildcard:
          text.wc:
            value: '*usn delete*'
            case_insensitive: true
      minimum_should_match: 1
  requires:
    families: *id001
  es_text_only_reason:
  - 'fsutil usn deletejournal: free phrase; the step''s pivot names no registry column'
  - 'usn delete: free phrase; the step''s pivot names no registry column'
- name: surviving_artifacts
  query: prefetch OR shimcache OR amcache OR $LogFile
  look_for: Anti-forensics cannot fully destroy all references — after a log clear,
    execution evidence survives in prefetch, ShimCache, AmCache, BAM, $LogFile/$UsnJrnl
    residue, SRUM, and memory. A single surviving artifact still proves the compromise
    happened.
  corroborate: activity window visible in surviving artifacts but absent from cleared
    logs = targeted clearing
  pivot: FileName
  es:
    bool:
      should:
      - wildcard:
          text.wc:
            value: '*prefetch*'
            case_insensitive: true
      - wildcard:
          text.wc:
            value: '*shimcache*'
            case_insensitive: true
      - wildcard:
          text.wc:
            value: '*amcache*'
            case_insensitive: true
      - wildcard:
          text.wc:
            value: '*$LogFile*'
            case_insensitive: true
      minimum_should_match: 1
  requires:
    families: *id001
  es_text_only_reason:
  - 'prefetch: file-path pivot; the value-shape route is removed (WO-CS1 moves it
    to ecs.file.path), searched in text'
  - 'shimcache: file-path pivot; the value-shape route is removed (WO-CS1 moves it
    to ecs.file.path), searched in text'
  - 'amcache: file-path pivot; the value-shape route is removed (WO-CS1 moves it to
    ecs.file.path), searched in text'
  - '$LogFile: file-path pivot; the value-shape route is removed (WO-CS1 moves it
    to ecs.file.path), searched in text'
negative: No 1102/104 events and no wevtutil/auditpol execution → logs were not cleared
  on this host; look for logging-gap explanations instead (service stop, forwarding
  failure).
confidence_rules:
  high: 1102 + wevtutil cl execution + preceding log gap
  medium: single log-clear event with non-system subject
  low: auditpol /set during patch windows (check maintenance context)
mitre:
- T1070.001
- T1562.002
