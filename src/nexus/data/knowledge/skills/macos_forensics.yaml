caveats:
- Unified log retention is limited (days-to-weeks and rotates) — if the window predates
  retention, that is a coverage gap; say so rather than implying clean.
- macOS ships many legitimate launch daemons and app agents — verify the signer and
  path (user-writable/temp is the tell), not merely the presence of a plist (FD-004).
- APFS snapshots can preserve pre-cleanup state, but they also age out; capture them
  at acquisition before they are thinned.
- TCC.db is protected (SIP/TCC) — read it from an image or with appropriate privileges;
  a modified/unreadable TCC.db is itself worth noting.
