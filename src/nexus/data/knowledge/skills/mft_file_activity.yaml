caveats:
- MFT record reuse destroys the old record — cite $I30 slack and $LogFile for what
  the MFT itself no longer shows.
- USN journal rolls over by size, not time — short retention on busy volumes; note
  the covered window before claiming gaps.
- FN timestamps update on rename/move — a moved-but-original file re-timestamps FN;
  compare against SI and siblings, not in isolation.
- Zone.Identifier survives copy operations but not all write paths — absence of MOTW
  does not prove the file was local.
