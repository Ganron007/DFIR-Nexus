skill: mft_file_activity
title: NTFS file-system activity — $MFT, $UsnJrnl, $I30 slack, ADS, timestomp
description: 'Reconstruct file-system truth: the MFT''s per-record timestamps and attributes, the USN journal''s
  change reasons, $I30 slack''s deleted-file residue, and SI-vs-FN timestamp comparison for timestomp detection.
  This is the ground layer the timeline is built on.'
trigger:
  families:
  - mftecmd
  - mft
  - usn
  - fls
  - log2timeline
  - plaso
  - mftecmd-i30
  - mftecmd-usn
  - mftecmd-logfile
  keywords:
  - mft
  - usn
  - journal
  - timestomp
  - $i30
  - ntfs
  - ads
  - zone.identifier
  - deleted
  techniques:
  - T1070.006
  - T1036
  - T1564.004
steps:
- name: mft_records
  query: file:mft
  look_for: MFTEcmd rows carry Entry+Sequence numbers (the file reference), parent path, and the SI/FN timestamp
    sets. Sequential MFT entries created in close succession mark write bursts — e.g. a cluster of records around
    prefetch .pf files acts as a backup creation timestamp (FOR508.5).
  pivot: FileName
  requires:
    families:
    - mftecmd
  es_source:
    bool:
      filter:
      - terms:
          family:
          - mftecmd
  source: families mftecmd
  kind: aggregate
  search:
    families:
    - mftecmd
    all:
    - field: fields.EntryNumber
      exists: true
  aggregate:
    field: ecs.file.extension
    size: 50
  es:
    bool:
      filter:
      - terms:
          family:
          - mftecmd
      - exists:
          field: fields.EntryNumber
  es_aggs:
    by:
      terms:
        field: ecs.file.extension
        size: 50
- name: usn_change_reasons
  query: file:usn
  look_for: $UsnJrnl\$Extend\$J records per-change reasons — FileCreate, DataExtend, RenameOldName/RenameNewName,
    Close, Delete — each with the file reference number. This is the per-file event ledger for days of activity
    on a busy volume.
  pivot: FileName
  corroborate: rename chains (OldName→NewName) expose extension-swap staging
  requires:
    families:
    - mftecmd
  es_source:
    bool:
      filter:
      - terms:
          family:
          - mftecmd
  source: families mftecmd
  kind: aggregate
  search:
    families:
    - mftecmd
    all:
    - field: fields.UpdateReasons
      exists: true
  aggregate:
    field: fields.UpdateReasons
    size: 30
  es:
    bool:
      filter:
      - terms:
          family:
          - mftecmd
      - exists:
          field: fields.UpdateReasons
  es_aggs:
    by:
      terms:
        field: fields.UpdateReasons.kw
        size: 30
- name: i30_slack_residue
  query: file:i30 OR $i30
  look_for: $I30 index slack — B-tree rebalancing leaves entries for files that no longer exist; each residue still
    carries filename, size, and a full timestamp set. The primary proof a file once existed in a directory after
    the MFT record itself was reused.
  pivot: FileName
  corroborate: residue timestamp + USN delete reason pins the deletion window
  requires:
    families:
    - mftecmd
  es_source:
    bool:
      filter:
      - terms:
          family:
          - mftecmd
  source: families mftecmd
  search:
    families:
    - mftecmd
    all:
    - field: fields.FromSlack
      is:
      - 'True'
  es:
    bool:
      filter:
      - terms:
          family:
          - mftecmd
      - term:
          fields.FromSlack.kw:
            value: 'True'
            case_insensitive: true
- name: alternate_data_streams
  query: zone.identifier OR file:ads OR \:$
  look_for: ADS on records — Zone.Identifier marks files downloaded from the internet/email (MOTW); attacker tools
    hide payloads in :stream names. ZoneId 3+ on an exe = internet-sourced code executed on the host.
  pivot: ZoneId
  requires:
    families:
    - mftecmd
  es_source:
    bool:
      filter:
      - terms:
          family:
          - mftecmd
  source: families mftecmd
  search:
    families:
    - mftecmd
    all:
    - field: fields.IsAds
      is:
      - 'True'
    none:
    - field: ecs.file.name
      endswith:
      - :Zone.Identifier
      - :SmartScreen
      - :$DATA
  es:
    bool:
      filter:
      - terms:
          family:
          - mftecmd
      - term:
          fields.IsAds.kw:
            value: 'True'
            case_insensitive: true
      must_not:
      - bool:
          should:
          - wildcard:
              ecs.file.name.wc:
                value: '*:Zone.Identifier'
                case_insensitive: true
          - wildcard:
              ecs.file.name.wc:
                value: '*:SmartScreen'
                case_insensitive: true
          - wildcard:
              ecs.file.name.wc:
                value: '*:$DATA'
                case_insensitive: true
          minimum_should_match: 1
- name: timestomp_si_fn
  query: file:mft .exe OR .dll OR .ps1
  look_for: >-
    Compare the same record's $SI Created0x10 and $FN Created0x30 values. MFTECmd's SI<FN flag means the $SI
    creation time precedes the $FN creation time; treat that parser flag as a lead, not a verdict or file-age
    proof. uSecZeros only checks whether the $SI creation or last-modified Millisecond component is zero, and
    Copied means $SI ContentModifiedOn precedes $SI CreatedOn. Neither flag alone establishes malicious activity
    or clears it. Preserve the claimed $SI date separately from independent later observations.
  pivot: FileName
  corroborate: compare MFT timestamps with USN/$LogFile chronology and independent execution evidence such as
    AppCompatCache; do not treat a claimed $SI creation date as proof of when the file executed
  origin: authored
  source_fact_ids:
  - mftecmd.si_fn
  - mftecmd.usec_zeros
  - mftecmd.copied
  requires:
    families:
    - mftecmd
  es_source:
    bool:
      filter:
      - terms:
          family:
          - mftecmd
  source: families mftecmd
  search:
    basis:
    - attack:DET0591
    families:
    - mftecmd
    all:
    - field: fields.SI<FN
      is:
      - 'True'
    - field: fields.uSecZeros
      is:
      - 'True'
    - field: ecs.file.extension
      is:
      - exe
      - dll
      - sys
      - ps1
      - bat
      - vbs
      - js
      - scr
      - hta
    none:
    - field: ecs.file.path
      contains:
      - \Windows\WinSxS\
      - \Windows\servicing\
      - \Windows\SoftwareDistribution\
  es:
    bool:
      filter:
      - terms:
          family:
          - mftecmd
      - term:
          fields.SI<FN.kw:
            value: 'True'
            case_insensitive: true
      - term:
          fields.uSecZeros.kw:
            value: 'True'
            case_insensitive: true
      - bool:
          should:
          - term:
              ecs.file.extension:
                value: exe
                case_insensitive: true
          - term:
              ecs.file.extension:
                value: dll
                case_insensitive: true
          - term:
              ecs.file.extension:
                value: sys
                case_insensitive: true
          - term:
              ecs.file.extension:
                value: ps1
                case_insensitive: true
          - term:
              ecs.file.extension:
                value: bat
                case_insensitive: true
          - term:
              ecs.file.extension:
                value: vbs
                case_insensitive: true
          - term:
              ecs.file.extension:
                value: js
                case_insensitive: true
          - term:
              ecs.file.extension:
                value: scr
                case_insensitive: true
          - term:
              ecs.file.extension:
                value: hta
                case_insensitive: true
          minimum_should_match: 1
      must_not:
      - bool:
          should:
          - wildcard:
              ecs.file.path.wc:
                value: '*\\Windows\\WinSxS\\*'
                case_insensitive: true
          - wildcard:
              ecs.file.path.wc:
                value: '*\\Windows\\servicing\\*'
                case_insensitive: true
          - wildcard:
              ecs.file.path.wc:
                value: '*\\Windows\\SoftwareDistribution\\*'
                case_insensitive: true
          minimum_should_match: 1
- name: logfile_detail
  query: file:logfile
  look_for: $LogFile — lowest-level NTFS transaction log (hours to ~1 day). Fills the gap between USN reasons and
    raw writes. These are LogFileParser rows, which come only from an examiner's import; the lane's own $LogFile rows
    are MFTECmd's (step logfile_operations).
  pivot: FileName
  requires:
    families:
    - logfileparser
  es_source:
    bool:
      filter:
      - terms:
          family:
          - logfileparser
  source: families logfileparser
  kind: aggregate
  search:
    families:
    - logfileparser
  aggregate:
    field: fields.lf_RedoOperation
    size: 30
  es:
    bool:
      filter:
      - terms:
          family:
          - logfileparser
  es_aggs:
    by:
      terms:
        field: fields.lf_RedoOperation.kw
        size: 30
- name: logfile_operations
  query: file:mftecmd RedoOperation
  look_for: 'The $LogFile parsed by MFTECmd, one row per log record ordered by LSN (pinned MFTECmd README at 2919ded,
    "$LogFile"). RedoOperation is the change and UndoOperation what was there before; TransactionFirstLsn tells
    transactions apart. With -m, TargetPath is the path of the file the operation changes. Details holds what was
    decoded with the previous values from the undo data, including $STANDARD_INFORMATION timestamp updates (such as a
    time stomp). A log record has no time of its own: CreatedOn..LastAccessedOn are file times the record holds, so
    order by Lsn, not by those columns.'
  pivot: TargetPath
  requires:
    families:
    - mftecmd
  es_source:
    bool:
      filter:
      - terms:
          family:
          - mftecmd
      - exists:
          field: fields.RedoOperation
  source: families mftecmd ($LogFile rows); pinned MFTECmd README 2919ded
  kind: aggregate
  search:
    families:
    - mftecmd
  aggregate:
    field: fields.RedoOperation
    size: 30
  es:
    bool:
      filter:
      - terms:
          family:
          - mftecmd
      - exists:
          field: fields.RedoOperation
  es_aggs:
    by:
      terms:
        field: fields.RedoOperation.kw
        size: 30
- name: deleted_metafiles
  query: file:mft .pf OR .evtx OR .lnk
  look_for: MFT records for metafiles (.pf, .evtx, .lnk, .pf) — their own timestamps tell when an artifact was born/copied;
    a .pf record deleted but still in MFT proves prefetch existed and was removed.
  requires:
    families:
    - mftecmd
  es_source:
    bool:
      filter:
      - terms:
          family:
          - mftecmd
  source: families mftecmd
  search:
    families:
    - mftecmd
    all:
    - field: fields.InUse
      is:
      - 'False'
    - field: ecs.file.extension
      is:
      - pf
      - evtx
      - lnk
  es:
    bool:
      filter:
      - terms:
          family:
          - mftecmd
      - term:
          fields.InUse.kw:
            value: 'False'
            case_insensitive: true
      - bool:
          should:
          - term:
              ecs.file.extension:
                value: pf
                case_insensitive: true
          - term:
              ecs.file.extension:
                value: evtx
                case_insensitive: true
          - term:
              ecs.file.extension:
                value: lnk
                case_insensitive: true
          minimum_should_match: 1
negative: Empty MFT/USN output means the metafiles were not parsed or not collected — file-system-layer absence
  is almost always a collection gap, never proof a file did not exist. Fall back to fls/TIMELINE bodyfiles and LNK
  residue.
confidence_rules:
  high: SI/FN anomaly or $I30 residue + matching USN delete reason for the same record
  medium: rename/create journal chain without surviving content
  low: single MFT row anomalies with plausible sync/AV explanation
mitre:
- T1070.006
- T1036
- T1564.004
caveats:
- MFT record reuse destroys the old record — cite $I30 slack and $LogFile for what the MFT itself no longer shows.
- USN journal rolls over by size, not time — short retention on busy volumes; note the covered window before claiming
  gaps.
- FN timestamps update on rename/move — a moved-but-original file re-timestamps FN; compare against SI and siblings,
  not in isolation.
- Zone.Identifier survives copy operations but not all write paths — absence of MOTW does not prove the file was
  local.
