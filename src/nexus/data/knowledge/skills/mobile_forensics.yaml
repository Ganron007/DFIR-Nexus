caveats:
- 'Acquisition method caps the evidence: a logical/iTunes/ADB backup does not capture
  deleted data or unallocated space — never present it as complete (FD-004).'
- Encrypted iOS backups and some Android app data require decryption keys/passcodes
  — a locked or un-decrypted backup is a documented gap.
- Cloud copies may diverge from the handset (deleted locally, still in cloud, or vice
  versa) — reconcile both and state which, and when, each was captured.
- Mobile OS and app updates change database schemas and retention — record OS/app
  versions with the artifact or a later analyst cannot reproduce it.
