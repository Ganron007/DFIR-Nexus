# kb: d_641ebbbd7339:c0124 (SANS FOR585 — Android file-system structures,
#      logical vs file-system acquisition; what each method captures)
# kb: d_2987c0399e6c:c0098 (SANS FOR585 — Google cloud extractions; a logical
#      acquisition does not capture deleted data in unallocated areas)
# kb: d_f841fdaaa378:c0043 (SANS FOR518/FOR585 — iOS backup decryption;
#      Manifest.plist IsEncrypted, backup tooling)
# kb: d_493c2342db56:c0041 (SANS FOR518 — Manifest.plist fields: IsEncrypted,
#      Date, WasPasscodeSet; backup metadata)
skill: mobile_forensics
title: Mobile device investigation — Android/iOS acquisition and app artifacts
platform: mobile
description: 'Investigate a mobile device (Android or iOS): choose and validate the
  acquisition method (logical vs file-system), decrypt and parse iOS backups, enumerate
  app databases for communications/location/accounts, and recover deleted records
  within retention limits — always with hash-verified, tool-documented acquisition.'
trigger:
  families:
  - csv
  - jsonl
  - sqlite
  - syslog
  keywords:
  - android
  - ios
  - mobile
  - adb
  - apk
  - backup
  - imei
  - sqlite
  - imessage
  - whatsapp
  - handset
  techniques:
  - T1533
  - T1636
  - T1430
  - T1005
  - T1552
steps:
- name: acquisition_and_integrity
  query: adb OR backup OR AFU OR logical OR filesystem OR full file system
  look_for: 'Document the acquisition tier: manual, logical (ADB/iTunes backup — no
    deleted data), file-system (AFU/checkm8/rooted — app data + some deleted), or
    full file-system/physical (unallocated + deleted). The tier bounds what conclusions
    are possible. Hash the extraction and record tool + version.'
  pivot: device
  corroborate: acquisition tier is sufficient for the specific question being asked
  es:
    bool:
      should:
      - wildcard:
          fields.host.kw:
            value: '*adb*'
            case_insensitive: true
      - wildcard:
          fields.host.kw:
            value: '*backup*'
            case_insensitive: true
      - wildcard:
          fields.host.kw:
            value: '*AFU*'
            case_insensitive: true
      - wildcard:
          fields.host.kw:
            value: '*logical*'
            case_insensitive: true
      - wildcard:
          fields.host.kw:
            value: '*filesystem*'
            case_insensitive: true
      - wildcard:
          fields.host.kw:
            value: '*full file system*'
            case_insensitive: true
      minimum_should_match: 1
  requires:
    families: &id001
    - csv
    - jsonl
    - sqlite
    - syslog
- name: ios_backup_parse
  query: Manifest.plist OR Manifest.db OR IsEncrypted OR Info.plist
  look_for: 'iOS backup: Manifest.plist records IsEncrypted, Date, WasPasscodeSet;
    Manifest.db maps domain → relative path → file hashes (including deleted-file
    entries). An encrypted backup must be decrypted before parsing; the Manifest.db
    hash list can reveal files deleted from the device but still present in the backup.'
  pivot: relativePath
  corroborate: a Manifest.db entry with no on-device file = deleted data
  es:
    bool:
      should:
      - wildcard:
          text.wc:
            value: '*Manifest.plist*'
            case_insensitive: true
      - wildcard:
          fields.file_path.kw:
            value: '*Manifest.db*'
            case_insensitive: true
      - wildcard:
          text.wc:
            value: '*IsEncrypted*'
            case_insensitive: true
      - wildcard:
          text.wc:
            value: '*Info.plist*'
            case_insensitive: true
      minimum_should_match: 1
  requires:
    families: *id001
  es_text_only_reason:
  - 'Manifest.plist: free phrase; the step''s pivot names no registry column'
  - 'IsEncrypted: free phrase; the step''s pivot names no registry column'
  - 'Info.plist: free phrase; the step''s pivot names no registry column'
- name: app_databases
  query: sqlite3 OR sms.db OR CallHistory OR WhatsApp OR location OR cookies
  look_for: 'App SQLite databases are the evidence: SMS/MMS (sms.db), call history,
    WhatsApp/Telegram/Signal, contacts, calendar, browser history, and location (cache_encrypted
    / locationd). Query each for the investigation window; deleted rows may survive
    in SQLite free pages/WAL.'
  pivot: ZPHONE or value
  corroborate: a message/contact also appears in a second app or the cloud backup
  es:
    bool:
      should:
      - wildcard:
          text.wc:
            value: '*sqlite3*'
            case_insensitive: true
      - wildcard:
          fields.file_path.kw:
            value: '*sms.db*'
            case_insensitive: true
      - wildcard:
          text.wc:
            value: '*CallHistory*'
            case_insensitive: true
      - wildcard:
          text.wc:
            value: '*WhatsApp*'
            case_insensitive: true
      - wildcard:
          text.wc:
            value: '*location*'
            case_insensitive: true
      - wildcard:
          text.wc:
            value: '*cookies*'
            case_insensitive: true
      minimum_should_match: 1
  requires:
    families: *id001
  es_text_only_reason:
  - 'sqlite3: free phrase; the step''s pivot names no registry column'
  - 'CallHistory: free phrase; the step''s pivot names no registry column'
  - 'WhatsApp: free phrase; the step''s pivot names no registry column'
  - 'location: free phrase; the step''s pivot names no registry column'
  - 'cookies: free phrase; the step''s pivot names no registry column'
- name: androidx_and_artifacts
  query: ANDROID_MEDIA OR /data/data OR shared_prefs OR apk OR package
  look_for: 'Android: /data/data/<package>/ holds app databases and shared_prefs;
    /data/system/ holds accounts, packages, and usage stats; media and downloads hold
    payloads. Installed-app inventory dates installs, and third-party APKs (sideloaded)
    are high-signal.'
  pivot: package_name
  es:
    bool:
      should:
      - wildcard:
          text.wc:
            value: '*ANDROID_MEDIA*'
            case_insensitive: true
      - wildcard:
          text.wc:
            value: '*/data/data*'
            case_insensitive: true
      - wildcard:
          text.wc:
            value: '*shared_prefs*'
            case_insensitive: true
      - wildcard:
          text.wc:
            value: '*apk*'
            case_insensitive: true
      - wildcard:
          text.wc:
            value: '*package*'
            case_insensitive: true
      minimum_should_match: 1
  requires:
    families: *id001
  es_text_only_reason:
  - 'ANDROID_MEDIA: free phrase; the step''s pivot names no registry column'
  - '/data/data: free phrase; the step''s pivot names no registry column'
  - 'shared_prefs: free phrase; the step''s pivot names no registry column'
  - 'apk: free phrase; the step''s pivot names no registry column'
  - 'package: free phrase; the step''s pivot names no registry column'
- name: deleted_and_cloud
  query: deleted OR free pages OR WAL OR cloud backup OR iCloud OR Drive
  look_for: 'Recover deleted records from SQLite free pages/WAL (mobile forensic tools)
    and check cloud sync/beta: iCloud backup, Google Drive/Photos, and app-level cloud
    (WhatsApp backup) can hold data deleted on the handset. Document retention so
    absence is not overstated.'
  pivot: record
  es:
    bool:
      should:
      - wildcard:
          text.wc:
            value: '*deleted*'
            case_insensitive: true
      - wildcard:
          text.wc:
            value: '*free pages*'
            case_insensitive: true
      - wildcard:
          text.wc:
            value: '*WAL*'
            case_insensitive: true
      - wildcard:
          text.wc:
            value: '*cloud backup*'
            case_insensitive: true
      - wildcard:
          text.wc:
            value: '*iCloud*'
            case_insensitive: true
      - wildcard:
          text.wc:
            value: '*Drive*'
            case_insensitive: true
      minimum_should_match: 1
  requires:
    families: *id001
  es_text_only_reason:
  - 'deleted: free phrase; the step''s pivot names no registry column'
  - 'free pages: free phrase; the step''s pivot names no registry column'
  - 'WAL: free phrase; the step''s pivot names no registry column'
  - 'cloud backup: free phrase; the step''s pivot names no registry column'
  - 'iCloud: free phrase; the step''s pivot names no registry column'
  - 'Drive: free phrase; the step''s pivot names no registry column'
negative: No relevant app data, no deleted records recovered, and no cloud sync for
  the window → the device shows no evidence for the question. This is bounded by the
  acquisition tier and app retention — a logical/backup acquisition cannot see deleted
  data, so state the tier before concluding.
confidence_rules:
  high: extracted message/record tied to the incident + corroborated by a second app
    or cloud artifact + hash-verified acquisition
  medium: relevant app artifact present but not corroborated or within a non-full
    acquisition
  low: an app artifact consistent with the question from a backup-tier acquisition
    (limited completeness)
