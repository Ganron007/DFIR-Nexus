caveats:
- Netflow/conn logs show metadata not content — a 'clean' flow record says nothing
  about what was inside it.
- NAT and proxies collapse source attribution — resolve the true client via load-balancer/proxy
  logs before blaming a host.
- Legitimate backup/sync/replication produces large asymmetric flows — check schedule
  and destination ownership first.
- Jittered beacons defeat interval-only detection — use variance analysis and byte-size
  uniformity together.
