# kb: CCD M7 (network forensics — Wireshark packet analysis, filtering,
#      stream following), Malicious Packet Analysis (session profiling)
# kb: d_db0d91434fd6 (HTB — beacon interval analysis), SEC530 Zeek/conn.log
# kb: EIR (network evidence in investigation flow)
skill: network_session_analysis
title: Network session analysis — flows, byte asymmetry, session profiling
description: 'Analyze network telemetry like an examiner: profile sessions by duration,
  byte asymmetry, port/protocol congruence, and periodicity — separating interactive
  attacker sessions from beacon callbacks and bulk transfers.'
trigger:
  families:
  - netstat
  - zeek
  - conn
  - dns
  - pcap
  - firewall
  - proxy
  - nfdump
  - tshark-flows
  keywords:
  - connection
  - session
  - flow
  - conn.log
  - zeek
  - bytes
  - duration
  - port
  - tcp
  - udp
  techniques:
  - T1071
  - T1041
  - T1571
  - T1021
steps:
- name: session_inventory
  query: ESTABLISHED OR conn.log OR netstat
  look_for: 'Build the session inventory first: external destinations, internal lateral
    flows, listening services. Zeek conn.log fields that matter: duration, orig_bytes/resp_bytes,
    conn_state, service label.'
  pivot: RemoteAddress
  es:
    bool:
      should:
      - wildcard:
          fields.source_ip.kw:
            value: '*ESTABLISHED*'
            case_insensitive: true
      - wildcard:
          fields.file_path.kw:
            value: '*conn.log*'
            case_insensitive: true
      - wildcard:
          fields.source_ip.kw:
            value: '*netstat*'
            case_insensitive: true
      minimum_should_match: 1
  requires:
    families: &id001
    - netstat
    - zeek
    - conn
    - dns
    - pcap
    - firewall
    - proxy
- name: byte_asymmetry
  query: bytes OR orig_bytes OR resp_bytes OR sent
  look_for: 'Byte asymmetry classifies the session: big-send/small-recv = exfil or
    upload; small-send/big-recv = download/staging; uniform small-both-ways at intervals
    = beacon; balanced interactive sizes = hands-on session.'
  pivot: RemoteAddress
  corroborate: byte profile + destination + interval = session class
  es:
    bool:
      should:
      - wildcard:
          fields.source_ip.kw:
            value: '*bytes*'
            case_insensitive: true
      - wildcard:
          fields.source_ip.kw:
            value: '*orig_bytes*'
            case_insensitive: true
      - wildcard:
          fields.source_ip.kw:
            value: '*resp_bytes*'
            case_insensitive: true
      - wildcard:
          fields.source_ip.kw:
            value: '*sent*'
            case_insensitive: true
      minimum_should_match: 1
  requires:
    families: *id001
- name: long_duration_sessions
  query: duration OR long OR persistent
  look_for: Long-lived sessions to external IPs — interactive C2/webshell/ tunnel
    sessions stay open; normal client traffic churns. Sort by duration and filter
    to rare destinations.
  pivot: RemoteAddress
  es:
    bool:
      should:
      - wildcard:
          fields.source_ip.kw:
            value: '*duration*'
            case_insensitive: true
      - wildcard:
          fields.source_ip.kw:
            value: '*long*'
            case_insensitive: true
      - wildcard:
          fields.source_ip.kw:
            value: '*persistent*'
            case_insensitive: true
      minimum_should_match: 1
  requires:
    families: *id001
- name: port_protocol_mismatch
  query: 443 OR 80 OR 53 OR 3389
  look_for: 'Protocol/port incongruence: HTTP-shaped traffic on 443 that''s really
    a tunnel, DNS on non-53, RDP on unusual ports, cleartext creds on 80. Zeek service
    labels vs port reveal the lie.'
  pivot: RemotePort
  es:
    bool:
      should:
      - wildcard:
          text.wc:
            value: '*443*'
            case_insensitive: true
      - wildcard:
          text.wc:
            value: '*80*'
            case_insensitive: true
      - wildcard:
          text.wc:
            value: '*53*'
            case_insensitive: true
      - term:
          event_id: '3389'
      minimum_should_match: 1
  requires:
    families: *id001
  es_text_only_reason:
  - '443: free phrase; the step''s pivot names no registry column'
  - '80: free phrase; the step''s pivot names no registry column'
  - '53: free phrase; the step''s pivot names no registry column'
- name: dns_tunnel_volume
  query: dns OR query OR TXT OR NULL
  look_for: 'DNS tunneling profile: query VOLUME per host (tunnels need thousands),
    long/encoded subdomains, TXT/NULL record types, rare resolver use. Compare per-host
    query counts — tunnels are statistical outliers.'
  pivot: QueryName
  es:
    bool:
      should:
      - wildcard:
          text.wc:
            value: '*dns*'
            case_insensitive: true
      - wildcard:
          text.wc:
            value: '*query*'
            case_insensitive: true
      - wildcard:
          text.wc:
            value: '*TXT*'
            case_insensitive: true
      - wildcard:
          text.wc:
            value: '*NULL*'
            case_insensitive: true
      minimum_should_match: 1
  requires:
    families: *id001
  es_text_only_reason:
  - 'dns: free phrase; the step''s pivot names no registry column'
  - 'query: free phrase; the step''s pivot names no registry column'
  - 'TXT: free phrase; the step''s pivot names no registry column'
  - 'NULL: free phrase; the step''s pivot names no registry column'
- name: lateral_flows
  query: 445 OR 3389 OR 5985 OR 135 OR 22
  look_for: 'Internal lateral flows: SMB 445, RDP 3389, WinRM 5985/5986, RPC 135,
    SSH 22 between workstation-class hosts — workstations rarely talk to workstations
    on admin ports.'
  pivot: DestIp
  corroborate: matching 4624 type-3/10 on the destination host
  es:
    bool:
      should:
      - wildcard:
          fields.dest_ip.kw:
            value: '*445*'
            case_insensitive: true
      - term:
          event_id: '3389'
      - term:
          event_id: '5985'
      - wildcard:
          fields.dest_ip.kw:
            value: '*135*'
            case_insensitive: true
      - wildcard:
          fields.dest_ip.kw:
            value: '*22*'
            case_insensitive: true
      minimum_should_match: 1
  requires:
    families: *id001
negative: No anomalous sessions, asymmetric flows, or beacon patterns → network C2/exfil
  not evident. Encrypted channels still hide content — volume and timing analysis
  survives encryption, content inspection does not.
confidence_rules:
  high: beacon intervals OR asymmetric exfil flow + matching endpoint artifact
  medium: anomalous sessions without endpoint corroboration
  low: rare external connections (could be legitimate SaaS)
mitre:
- T1071
- T1041
- T1571
