# kb: d_3edf38e74d31:c0082 (FOR508.2 — DLL hijack classes; SUNSPOT scheduled-
#      task persistence from the SolarWinds investigation; Autoruns)
# kb: d_0d8eeaa8ab62:c0396-0398 (SANS SEC699 — WMI persistence: EventFilter +
#      CommandLineEventConsumer bound via __FilterToConsumerBinding; Sysmon
#      WMI events 19/20/21 as the detection surface)
# kb: CCD M5 (registry/service/task artifact procedures), EIR persistence
skill: persistence
title: Persistence — registry run keys, services, scheduled tasks, WMI
description: Detect mechanisms that survive reboot — autostart registry keys, new
  services, scheduled tasks, WMI event subscriptions.
# WO-R0F item 5 (KL2e): a single-source scheduled_tasks case must select this skill.
primary_families:
- scheduled_tasks
trigger:
  families:
  - registry
  - evtx
  - sysmon
  - services
  - scheduled_tasks
  - security
  keywords:
  - persist
  - autostart
  - schtasks
  - subscription
  - runkey
  - reg add
  - startup
  techniques:
  - T1547.001
  - T1543.003
  - T1053.005
  - T1546.003
steps:
- name: run_keys
  query: \Run OR \RunOnce OR \RunOnceEx CurrentVersion\Run
  look_for: Writes to HKLM/HKCU Run/RunOnce keys, especially values pointing into
    user-writable or temp paths.
  pivot: ValueName
  es:
    bool:
      should:
      - wildcard:
          fields.ValueName.kw:
            value: '*\Run*'
            case_insensitive: true
      - wildcard:
          fields.ValueName.kw:
            value: '*\RunOnce*'
            case_insensitive: true
      - wildcard:
          fields.ValueName.kw:
            value: '*\RunOnceEx CurrentVersion\Run*'
            case_insensitive: true
      minimum_should_match: 1
  requires:
    families: &id001
    - registry
    - evtx
    - sysmon
    - services
    - scheduled_tasks
    - security
- name: new_services
  query: 7045 OR sc create OR sc.exe create
  look_for: Service installs with ImagePath under %TEMP%, %APPDATA%, %ProgramData%,
    or with non-standard binaries.
  pivot: ImagePath
  es:
    bool:
      should:
      - term:
          event_id: '7045'
      - wildcard:
          text.wc:
            value: '*sc create*'
            case_insensitive: true
      - bool:
          must:
          - wildcard:
              text.wc:
                value: '*sc.exe*'
                case_insensitive: true
          - wildcard:
              text.wc:
                value: '*create*'
                case_insensitive: true
      minimum_should_match: 1
  requires:
    families: *id001
  es_text_only_reason:
  - 'sc create: free phrase; the step''s pivot names no registry column'
  - 'sc.exe: a file name token; the value-shape file_path route is removed (WO-CS1
    moves it to ecs.file.path), searched in text'
  - 'create: free phrase; the step''s pivot names no registry column'
- name: scheduled_tasks
  query: schtasks /create OR 106 OR TaskScheduler
  look_for: Task registrations running as SYSTEM or on logon, especially with remote
    or hidden actions.
  pivot: TaskName
  es:
    bool:
      should:
      - wildcard:
          text.wc:
            value: '*schtasks /create*'
            case_insensitive: true
      - wildcard:
          text.wc:
            value: '*106*'
            case_insensitive: true
      - wildcard:
          text.wc:
            value: '*TaskScheduler*'
            case_insensitive: true
      minimum_should_match: 1
  requires:
    families: *id001
  es_text_only_reason:
  - 'schtasks /create: free phrase; the step''s pivot names no registry column'
  - '106: free phrase; the step''s pivot names no registry column'
  - 'TaskScheduler: free phrase; the step''s pivot names no registry column'
- name: wmi_subscription
  query: EventFilter CommandLineEventConsumer wmi
  look_for: 'WMI permanent event subscriptions: a __EventFilter + a consumer class
    bound by __FilterToConsumerBinding. The consumer is the payload — CommandLineEventConsumer
    runs a command, ActiveScriptEventConsumer runs script, and both fire on the filter''s
    trigger (often a timer or logon). Sysmon Events 19/20/21 (WmiEventFilter/WmiEventConsumer/
    WmiEventConsumerToFilter) and the case''s WMI-subscription artifacts capture the
    chain; Autoruns'' WMI tab shows it in one view.'
  pivot: CommandLine
  corroborate: the consumer's command/script path also appears in prefetch/MFT or
    Sysmon process-create
  es:
    wildcard:
      fields.command_line.kw:
        value: '*EventFilter CommandLineEventConsumer wmi*'
        case_insensitive: true
  requires:
    families: *id001
- name: image_file_execution_options
  query: Image File Execution Options OR IFEO OR SilentProcessExit
  look_for: Debugger hijacks on common binaries (sethc, utilman, osk).
  pivot: KeyPath
  es:
    bool:
      should:
      - wildcard:
          fields.KeyPath.kw:
            value: '*Image File Execution Options*'
            case_insensitive: true
      - wildcard:
          fields.KeyPath.kw:
            value: '*IFEO*'
            case_insensitive: true
      - wildcard:
          fields.KeyPath.kw:
            value: '*SilentProcessExit*'
            case_insensitive: true
      minimum_should_match: 1
  requires:
    families: *id001
- name: startup_folder_lnk
  query: Startup OR Start Menu\Programs\Startup .lnk
  look_for: LNK files dropped into Startup folders (lnk family + mft/usn).
  pivot: FileName
  es:
    bool:
      should:
      - wildcard:
          text.wc:
            value: '*Startup*'
            case_insensitive: true
      - bool:
          must:
          - wildcard:
              text.wc:
                value: '*.lnk*'
                case_insensitive: true
          - wildcard:
              text.wc:
                value: '*Start Menu\Programs\Startup*'
                case_insensitive: true
      minimum_should_match: 1
  requires:
    families: *id001
  es_text_only_reason:
  - 'Startup: file-path pivot; the value-shape route is removed (WO-CS1 moves it to
    ecs.file.path), searched in text'
  - '.lnk: a file name token; the value-shape file_path route is removed (WO-CS1 moves
    it to ecs.file.path), searched in text'
  - 'Start Menu\Programs\Startup: file-path pivot; the value-shape route is removed
    (WO-CS1 moves it to ecs.file.path), searched in text'
- name: dll_hijack
  query: fxsst.dll OR ntshrui.dll OR side-loading OR WinSxS
  look_for: 'DLL-hijack persistence classes: search-order hijack (malicious DLL ahead
    in load order — classic ntshrui.dll beside explorer.exe); phantom DLL (app loads
    a name that doesn''t exist — e.g. Fax Service fxsst.dll); side-loading via WinSxS
    (PlugX, NetTraveler, Sakula, Poison Ivy); relative-path hijack (susceptible exe
    + bad dll copied together to an attacker-chosen dir).'
  pivot: ImagePath
  corroborate: unsigned DLL beside a signed exe, or exe+dll pair in a non-standard
    dir
  es:
    bool:
      should:
      - wildcard:
          text.wc:
            value: '*fxsst.dll*'
            case_insensitive: true
      - wildcard:
          text.wc:
            value: '*ntshrui.dll*'
            case_insensitive: true
      - wildcard:
          text.wc:
            value: '*side-loading*'
            case_insensitive: true
      - wildcard:
          text.wc:
            value: '*WinSxS*'
            case_insensitive: true
      minimum_should_match: 1
  requires:
    families: *id001
  es_text_only_reason:
  - 'fxsst.dll: a file name token; the value-shape file_path route is removed (WO-CS1
    moves it to ecs.file.path), searched in text'
  - 'ntshrui.dll: a file name token; the value-shape file_path route is removed (WO-CS1
    moves it to ecs.file.path), searched in text'
  - 'side-loading: free phrase; the step''s pivot names no registry column'
  - 'WinSxS: free phrase; the step''s pivot names no registry column'
- name: task_persistence_case
  query: schtasks OR at.exe OR TaskScheduler
  look_for: Scheduled-task persistence stays dominant even in advanced intrusions
    — SolarWinds SUNSPOT ran via a boot-time scheduled task. Autoruns-class enumeration
    + TaskScheduler operational logs catch what registry-only sweeps miss.
  pivot: TaskName
  es:
    bool:
      should:
      - wildcard:
          text.wc:
            value: '*schtasks*'
            case_insensitive: true
      - wildcard:
          text.wc:
            value: '*at.exe*'
            case_insensitive: true
      - wildcard:
          text.wc:
            value: '*TaskScheduler*'
            case_insensitive: true
      minimum_should_match: 1
  requires:
    families: *id001
  es_text_only_reason:
  - 'schtasks: free phrase; the step''s pivot names no registry column'
  - 'at.exe: a file name token; the value-shape file_path route is removed (WO-CS1
    moves it to ecs.file.path), searched in text'
  - 'TaskScheduler: free phrase; the step''s pivot names no registry column'
negative: No autostart writes, service installs, or task registrations → the attacker
  may rely on existing persistence or volatile-only presence.
confidence_rules:
  high: new autostart entry + the referenced binary present in prefetch/mft
  medium: autostart write without execution artifact (may be pre-trigger)
  low: legitimate installer service creations (signed, Program Files path)
mitre:
- T1547.001
- T1543.003
- T1053.005
- T1546.003
- T1053
