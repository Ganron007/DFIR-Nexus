# kb: SpecterOps (offensive PowerShell tradecraft → detection inversion),
#      13C WE (PowerShell logging/transcription artifacts),
#      EIR (PowerShell abuse in investigation scenarios)
skill: powershell_abuse
title: PowerShell abuse — encoded commands, download cradles, script blocks
description: Detect malicious PowerShell — encoded commands, download cradles, AMSI
  bypass, suspicious script blocks, and shell profiles.
trigger:
  families:
  - powershell
  - evtx
  - sysmon
  - prefetch
  - hayabusa
  keywords:
  - powershell
  - encoded
  - downloadstring
  - iex
  - amsi
  - bypass
  - scriptblock
  techniques:
  - T1059.001
  - T1059
  - T1027
steps:
- name: encoded_commands
  query: -enc OR -encodedcommand OR FromBase64String
  look_for: powershell -enc/-e payloads — decode candidate; check for very long base64
    strings in CommandLine.
  pivot: CommandLine
  es:
    bool:
      should:
      - wildcard:
          text.wc:
            value: '*-enc*'
            case_insensitive: true
      - wildcard:
          text.wc:
            value: '*-encodedcommand*'
            case_insensitive: true
      - wildcard:
          text.wc:
            value: '*FromBase64String*'
            case_insensitive: true
      minimum_should_match: 1
  requires:
    families: &id001
    - powershell
    - evtx
    - sysmon
    - prefetch
    - hayabusa
  es_text_only_reason:
  - '-enc: free phrase; the step''s pivot names no registry column'
  - '-encodedcommand: free phrase; the step''s pivot names no registry column'
  - 'FromBase64String: free phrase; the step''s pivot names no registry column'
- name: download_cradles
  query: DownloadString OR DownloadFile OR Invoke-WebRequest OR iwr OR curl.exe OR
    wget
  look_for: Net.WebClient DownloadString / IEX cradle patterns.
  pivot: CommandLine
  es:
    bool:
      should:
      - wildcard:
          text.wc:
            value: '*DownloadString*'
            case_insensitive: true
      - wildcard:
          text.wc:
            value: '*DownloadFile*'
            case_insensitive: true
      - wildcard:
          text.wc:
            value: '*Invoke-WebRequest*'
            case_insensitive: true
      - wildcard:
          text.wc:
            value: '*iwr*'
            case_insensitive: true
      - wildcard:
          text.wc:
            value: '*curl.exe*'
            case_insensitive: true
      - wildcard:
          text.wc:
            value: '*wget*'
            case_insensitive: true
      minimum_should_match: 1
  requires:
    families: *id001
  es_text_only_reason:
  - 'DownloadString: free phrase; the step''s pivot names no registry column'
  - 'DownloadFile: free phrase; the step''s pivot names no registry column'
  - 'Invoke-WebRequest: free phrase; the step''s pivot names no registry column'
  - 'iwr: free phrase; the step''s pivot names no registry column'
  - 'curl.exe: a file name token; the value-shape file_path route is removed (WO-CS1
    moves it to ecs.file.path), searched in text'
  - 'wget: free phrase; the step''s pivot names no registry column'
- name: script_block_4104
  query: '4104'
  look_for: PowerShell 4104 script-block logging — suspicious code content (invoke,
    credential, bypass, amsi strings).
  pivot: ScriptBlockText
  es:
    term:
      event_id: '4104'
  requires:
    families: *id001
- name: amsi_bypass
  query: amsiInitFailed OR amsi.dll OR AmsiUtils
  look_for: AMSI patch/bypass strings in script blocks or command lines.
  corroborate: subsequent suspicious 4104 content
  es:
    bool:
      should:
      - wildcard:
          text.wc:
            value: '*amsiInitFailed*'
            case_insensitive: true
      - wildcard:
          text.wc:
            value: '*amsi.dll*'
            case_insensitive: true
      - wildcard:
          text.wc:
            value: '*AmsiUtils*'
            case_insensitive: true
      minimum_should_match: 1
  requires:
    families: *id001
  es_text_only_reason:
  - 'amsiInitFailed: free phrase; the step''s pivot names no registry column'
  - 'amsi.dll: a file name token; the value-shape file_path route is removed (WO-CS1
    moves it to ecs.file.path), searched in text'
  - 'AmsiUtils: free phrase; the step''s pivot names no registry column'
- name: powershell_downgrade
  query: powershell -version 2 OR -Version 2.0
  look_for: -Version 2 downgrade (bypasses script-block logging).
  pivot: CommandLine
  es:
    bool:
      should:
      - wildcard:
          text.wc:
            value: '*powershell -version 2*'
            case_insensitive: true
      - wildcard:
          text.wc:
            value: '*-Version 2.0*'
            case_insensitive: true
      minimum_should_match: 1
  requires:
    families: *id001
  es_text_only_reason:
  - 'powershell -version 2: free phrase; the step''s pivot names no registry column'
  - '-Version 2.0: free phrase; the step''s pivot names no registry column'
- name: suspicious_modules
  query: Invoke-Mimikatz OR PowerSploit OR PowerView OR Invoke-Expression
  look_for: Offensive framework/module names in script blocks or args.
  es:
    bool:
      should:
      - wildcard:
          text.wc:
            value: '*Invoke-Mimikatz*'
            case_insensitive: true
      - wildcard:
          text.wc:
            value: '*PowerSploit*'
            case_insensitive: true
      - wildcard:
          text.wc:
            value: '*PowerView*'
            case_insensitive: true
      - wildcard:
          text.wc:
            value: '*Invoke-Expression*'
            case_insensitive: true
      minimum_should_match: 1
  requires:
    families: *id001
  es_text_only_reason:
  - 'Invoke-Mimikatz: free phrase; the step''s pivot names no registry column'
  - 'PowerSploit: free phrase; the step''s pivot names no registry column'
  - 'PowerView: free phrase; the step''s pivot names no registry column'
  - 'Invoke-Expression: free phrase; the step''s pivot names no registry column'
- name: transcription_artifacts
  query: transcript OR Start-Transcript OR .ps1
  look_for: PowerShell transcription/console-history artifacts — ConsoleHost_history.txt
    per user records interactive commands even when script-block logging is off; transcript
    output files in user dirs capture full sessions.
  pivot: FileName
  corroborate: history file content vs 4104 script blocks — gaps indicate disabled
    logging
  es:
    bool:
      should:
      - wildcard:
          text.wc:
            value: '*transcript*'
            case_insensitive: true
      - wildcard:
          text.wc:
            value: '*Start-Transcript*'
            case_insensitive: true
      - wildcard:
          text.wc:
            value: '*.ps1*'
            case_insensitive: true
      minimum_should_match: 1
  requires:
    families: *id001
  es_text_only_reason:
  - 'transcript: file-path pivot; the value-shape route is removed (WO-CS1 moves it
    to ecs.file.path), searched in text'
  - 'Start-Transcript: file-path pivot; the value-shape route is removed (WO-CS1 moves
    it to ecs.file.path), searched in text'
  - '.ps1: a file name token; the value-shape file_path route is removed (WO-CS1 moves
    it to ecs.file.path), searched in text'
negative: No encoded commands, cradles, or suspicious script blocks → PowerShell abuse
  unlikely; check cmd/wscript/mshta/python instead.
confidence_rules:
  high: encoded command + 4104 content showing download/exec + network artifact
  medium: suspicious script block without matching network evidence
  low: admin script with bypass flags (may be legit tooling)
mitre:
- T1059.001
- T1027
