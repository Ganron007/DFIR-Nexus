- name: transcription_artifacts
  query: transcript OR Start-Transcript OR .ps1
  look_for: PowerShell transcription/console-history artifacts — ConsoleHost_history.txt per user records interactive
    commands even when script-block logging is off; transcript output files in user dirs capture full sessions.
  pivot: FileName
  corroborate: history file content vs 4104 script blocks — gaps indicate disabled logging
  requires:
    families:
    - mftecmd
  es_source:
    bool:
      filter:
      - terms:
          family:
          - mftecmd
  source: families mftecmd
  search:
    families:
    - mftecmd
    any:
    - field: ecs.file.name
      is:
      - ConsoleHost_history.txt
    - field: ecs.file.name
      startswith:
      - PowerShell_transcript.
  es:
    bool:
      filter:
      - terms:
          family:
          - mftecmd
      - bool:
          should:
          - term:
              ecs.file.name:
                value: ConsoleHost_history.txt
                case_insensitive: true
          - wildcard:
              ecs.file.name.wc:
                value: PowerShell_transcript.*
                case_insensitive: true
          minimum_should_match: 1
negative: No encoded commands, cradles, or suspicious script blocks → PowerShell abuse unlikely; check cmd/wscript/mshta/python
  instead.
confidence_rules:
  high: encoded command + 4104 content showing download/exec + network artifact
  medium: suspicious script block without matching network evidence
  low: admin script with bypass flags (may be legit tooling)
mitre:
- T1059.001
- T1027
caveats:
- Legitimate admin scripts use -enc for credentials — decode before judging.
- 4104 volume is huge — filter by HostName/Path of the script block, not just keyword.
