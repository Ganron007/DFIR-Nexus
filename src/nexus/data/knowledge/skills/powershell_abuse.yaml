skill: powershell_abuse
title: PowerShell abuse — encoded commands, download cradles, script blocks
description: Detect malicious PowerShell — encoded commands, download cradles, AMSI bypass, suspicious script blocks,
  and shell profiles.
trigger:
  families:
  - powershell
  - evtx
  - prefetch
  - hayabusa
  keywords:
  - powershell
  - encoded
  - downloadstring
  - iex
  - amsi
  - bypass
  - scriptblock
  techniques:
  - T1059.001
  - T1059
  - T1027
steps:
- name: encoded_commands
  query: -enc OR -encodedcommand OR FromBase64String
  look_for: powershell -enc/-e payloads — decode candidate; check for very long base64 strings in CommandLine.
  pivot: CommandLine
  requires:
    families:
    - kind:evtx
  es_source:
    bool:
      filter:
      - bool:
          should:
          - bool:
              filter:
              - term:
                  ecs.winlog.channel:
                    value: Microsoft-Windows-Sysmon/Operational
                    case_insensitive: true
              - terms:
                  event_id:
                  - '1'
          - bool:
              filter:
              - term:
                  ecs.winlog.channel:
                    value: Security
                    case_insensitive: true
              - terms:
                  event_id:
                  - '4688'
          - bool:
              filter:
              - term:
                  ecs.winlog.channel:
                    value: Microsoft-Windows-PowerShell/Operational
                    case_insensitive: true
              - terms:
                  event_id:
                  - '4104'
          minimum_should_match: 1
  source: Sysmon 1; Security 4688; PowerShell/Operational 4104
  search:
    basis:
    - attack:DET0455
    - attack:DET0378
    - manifest
    events:
    - channel: Microsoft-Windows-Sysmon/Operational
      codes:
      - '1'
    - channel: Security
      codes:
      - '4688'
    - channel: Microsoft-Windows-PowerShell/Operational
      codes:
      - '4104'
    any:
    - field: ecs.process.command_line
      contains:
      - ' -enc'
      - ' -e '
      - ' -ec '
      - -EncodedCommand
      - FromBase64String
    - field: ecs.winlog.event_data.ScriptBlockText
      contains:
      - FromBase64String
  es:
    bool:
      filter:
      - bool:
          should:
          - bool:
              filter:
              - term:
                  ecs.winlog.channel:
                    value: Microsoft-Windows-Sysmon/Operational
                    case_insensitive: true
              - terms:
                  event_id:
                  - '1'
          - bool:
              filter:
              - term:
                  ecs.winlog.channel:
                    value: Security
                    case_insensitive: true
              - terms:
                  event_id:
                  - '4688'
          - bool:
              filter:
              - term:
                  ecs.winlog.channel:
                    value: Microsoft-Windows-PowerShell/Operational
                    case_insensitive: true
              - terms:
                  event_id:
                  - '4104'
          minimum_should_match: 1
      - bool:
          should:
          - bool:
              should:
              - wildcard:
                  ecs.process.command_line.wc:
                    value: '* -enc*'
                    case_insensitive: true
              - wildcard:
                  ecs.process.command_line.wc:
                    value: '* -e *'
                    case_insensitive: true
              - wildcard:
                  ecs.process.command_line.wc:
                    value: '* -ec *'
                    case_insensitive: true
              - wildcard:
                  ecs.process.command_line.wc:
                    value: '*-EncodedCommand*'
                    case_insensitive: true
              - wildcard:
                  ecs.process.command_line.wc:
                    value: '*FromBase64String*'
                    case_insensitive: true
              minimum_should_match: 1
          - wildcard:
              ecs.winlog.event_data.ScriptBlockText.wc:
                value: '*FromBase64String*'
                case_insensitive: true
          minimum_should_match: 1
