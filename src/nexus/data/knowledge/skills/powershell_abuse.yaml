- name: powershell_downgrade
  query: powershell -version 2 OR -Version 2.0
  look_for: -Version 2 downgrade (bypasses script-block logging).
  pivot: CommandLine
  requires:
    families:
    - kind:evtx
  es_source:
    bool:
      filter:
      - bool:
          filter:
          - term:
              ecs.winlog.channel:
                value: Windows PowerShell
                case_insensitive: true
          - terms:
              event_id:
              - '400'
  source: Windows PowerShell 400
  search:
    basis:
    - attack:DET0455
    events:
    - channel: Windows PowerShell
      codes:
      - '400'
    all:
    - field: text
      contains:
      - EngineVersion=2.
  es:
    bool:
      filter:
      - bool:
          filter:
          - term:
              ecs.winlog.channel:
                value: Windows PowerShell
                case_insensitive: true
          - terms:
              event_id:
              - '400'
      - wildcard:
          text.wc:
            value: '*EngineVersion=2.*'
            case_insensitive: true
