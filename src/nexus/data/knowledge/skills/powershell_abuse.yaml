- name: script_block_4104
  query: '4104'
  look_for: PowerShell 4104 script-block logging — suspicious code content (invoke, credential, bypass, amsi strings).
  pivot: ScriptBlockText
  requires:
    families:
    - kind:evtx
  es_source:
    bool:
      filter:
      - bool:
          filter:
          - term:
              ecs.winlog.channel:
                value: Microsoft-Windows-PowerShell/Operational
                case_insensitive: true
          - terms:
              event_id:
              - '4104'
  source: PowerShell/Operational 4104
  kind: aggregate
  search:
    basis:
    - attack:DET0455
    events:
    - channel: Microsoft-Windows-PowerShell/Operational
      codes:
      - '4104'
  aggregate:
    field: ecs.winlog.event_data.Path
    size: 50
  es:
    bool:
      filter:
      - bool:
          filter:
          - term:
              ecs.winlog.channel:
                value: Microsoft-Windows-PowerShell/Operational
                case_insensitive: true
          - terms:
              event_id:
              - '4104'
  es_aggs:
    by:
      terms:
        field: ecs.winlog.event_data.Path
        size: 50
