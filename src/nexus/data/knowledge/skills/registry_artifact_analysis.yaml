# kb: d_183bb6de66c9 (CCD M5 T1 Registry) | d_e1fcbdf969e6 (CCD M5 T6 ShellBags)
# kb: d_254169eb2052 (CCD M5 T6 MRULists) | d_346b1e448071 (13C Registry cheat sheet)
# kb: d_ebe960efd5d4 (13C WE 7 NTUSER) | d_4a6fccf5183f (13C WE 8 UsrClass/ShellBags)
# kb: FOR500 Book 3 + Registry Analysis Guides (d_770cab5a1915)
skill: registry_artifact_analysis
title: Registry-hive analysis — NTUSER/UsrClass/SYSTEM/SOFTWARE user + OS activity
kind: methodology
description: 'The registry answers two questions most artifacts cannot: what the USER
  did (Explorer MRUs, ShellBags, UserAssist, searches) and how the OS is configured
  (services, USB devices, installed software). Work per-hive: SYSTEM for machine state,
  NTUSER/UsrClass per-user for behavior.'
trigger:
  families:
  - recmd
  - registry
  - sbecmd
  keywords:
  - registry
  - hive
  - ntuser
  - usrclass
  - shellbag
  - bagmru
  - mru
  - recentdocs
  - runkey
  - userassist
  techniques:
  - T1112
  - T1547.001
  - T1078
steps:
- name: hive_inventory
  query: file:ntuser OR file:usrclass OR file:system OR file:software OR file:sam
    OR file:security
  look_for: Map which hives were parsed. SYSTEM = machine config/services/devices;
    SOFTWARE = installed programs/policies; SAM/SECURITY = local accounts; NTUSER/UsrClass
    = per-user behavior. Missing hives bound what the registry can answer.
  pivot: KeyPath
  es:
    bool:
      should:
      - wildcard:
          file:
            value: '*ntuser*'
            case_insensitive: true
      - wildcard:
          file:
            value: '*usrclass*'
            case_insensitive: true
      - wildcard:
          file:
            value: '*system*'
            case_insensitive: true
      - wildcard:
          file:
            value: '*software*'
            case_insensitive: true
      - wildcard:
          file:
            value: '*sam*'
            case_insensitive: true
      - wildcard:
          file:
            value: '*security*'
            case_insensitive: true
      minimum_should_match: 1
  requires:
    families: &id001
    - recmd
    - registry
- name: shellbags_folder_views
  query: bagmru OR file:shellbag
  look_for: ShellBags (BagMRU + Bags in NTUSER\Software\Microsoft\Windows\Shell* and
    USRCLASS\Local Settings\Software\Microsoft\Windows\Shell*) record every folder
    the user viewed in Explorer — proof a user browsed a path even if it is now deleted
    or on a detached USB volume. NodeSlot order reconstructs the navigation sequence.
  pivot: AbsolutePath
  corroborate: a shellbag for a staging dir before payload mtime shows recon-before-drop
  es:
    bool:
      should:
      - wildcard:
          text.wc:
            value: '*bagmru*'
            case_insensitive: true
      - wildcard:
          file:
            value: '*shellbag*'
            case_insensitive: true
      minimum_should_match: 1
  requires:
    families: *id001
  es_text_only_reason:
  - 'bagmru: free phrase; the step''s pivot names no registry column'
- name: comdlg32_mru
  query: opensavepidlmru OR lastvisitedpidlmru OR comdlg32
  look_for: ComDlg32 OpenSavePidlMRU (files via open/save dialogs) and LastVisitedPidlMRU
    (apps used to open/save) — which files the user touched through the GUI and with
    what application.
  pivot: ValueName
  es:
    bool:
      should:
      - wildcard:
          fields.ValueName.kw:
            value: '*opensavepidlmru*'
            case_insensitive: true
      - wildcard:
          fields.ValueName.kw:
            value: '*lastvisitedpidlmru*'
            case_insensitive: true
      - wildcard:
          fields.ValueName.kw:
            value: '*comdlg32*'
            case_insensitive: true
      minimum_should_match: 1
  requires:
    families: *id001
- name: recent_and_typed
  query: recentdocs OR runmru OR typedpaths OR wordwheelquery
  look_for: RecentDocs (recent file interaction), RunMRU (Start>Run history), TypedPaths
    (paths typed into the Explorer bar), WordWheelQuery (Explorer search terms) —
    intent-bearing user actions; a TypedPath or search for a staging directory is
    hard to attribute to automation.
  pivot: ValueName
  es:
    bool:
      should:
      - wildcard:
          fields.ValueName.kw:
            value: '*recentdocs*'
            case_insensitive: true
      - wildcard:
          fields.ValueName.kw:
            value: '*runmru*'
            case_insensitive: true
      - wildcard:
          fields.ValueName.kw:
            value: '*typedpaths*'
            case_insensitive: true
      - wildcard:
          fields.ValueName.kw:
            value: '*wordwheelquery*'
            case_insensitive: true
      minimum_should_match: 1
  requires:
    families: *id001
- name: services_and_drivers
  query: file:system services OR currentcontrolset\services
  look_for: SYSTEM\CurrentControlSet\Services — installed services/drivers with ImagePath,
    Start type (2=auto), and last-write time. Unsigned or user-writable ImagePaths
    starting auto = persistence-shaped.
  pivot: ImagePath
  corroborate: service last-write ≈ intrusion window + matching Security 7045
  es:
    bool:
      should:
      - bool:
          must:
          - wildcard:
              file:
                value: '*system*'
                case_insensitive: true
          - wildcard:
              text.wc:
                value: '*services*'
                case_insensitive: true
      - wildcard:
          text.wc:
            value: '*currentcontrolset\services*'
            case_insensitive: true
      minimum_should_match: 1
  requires:
    families: *id001
  es_text_only_reason:
  - 'services: free phrase; the step''s pivot names no registry column'
  - 'currentcontrolset\services: free phrase; the step''s pivot names no registry
    column'
- name: run_and_autostart
  query: currentversion\run OR runonce
  look_for: HKLM/HKCU Run, RunOnce, RunOnceEx, Policies\Explorer\Run — autostart values
    pointing to user-writable or temp paths; check both hives.
  pivot: ValueName
  es:
    bool:
      should:
      - wildcard:
          fields.ValueName.kw:
            value: '*currentversion\run*'
            case_insensitive: true
      - wildcard:
          fields.ValueName.kw:
            value: '*runonce*'
            case_insensitive: true
      minimum_should_match: 1
  requires:
    families: *id001
- name: installed_software
  query: file:software uninstall OR microsoft\windows\currentversion\uninstall
  look_for: SOFTWARE\...\Uninstall inventory — what is legitimately installed; attacker
    tools appearing here (or conspicuously absent) frame what "normal" software looks
    like on this host.
  es:
    bool:
      should:
      - bool:
          must:
          - wildcard:
              file:
                value: '*software*'
                case_insensitive: true
          - wildcard:
              text.wc:
                value: '*uninstall*'
                case_insensitive: true
      - wildcard:
          text.wc:
            value: '*microsoft\windows\currentversion\uninstall*'
            case_insensitive: true
      minimum_should_match: 1
  requires:
    families: *id001
  es_text_only_reason:
  - 'uninstall: free phrase; the step''s pivot names no registry column'
  - 'microsoft\windows\currentversion\uninstall: free phrase; the step''s pivot names
    no registry column'
- name: sam_local_accounts
  query: file:sam
  look_for: SAM domains/users — local account RIDs, creation times, group membership;
    attacker-created local admins survive in SAM even if never used interactively.
  pivot: RelativeID
  es:
    wildcard:
      file:
        value: '*sam*'
        case_insensitive: true
  requires:
    families: *id001
negative: Absent user-behavior keys (no ShellBags/MRU for a profile) means either
  a service/system account context or hive collection gaps — check which hives were
  actually parsed before concluding the account was not user-driven.
confidence_rules:
  high: user-behavior artifact (shellbag/MRU/typedpath) + corroborating file-system
    evidence for the same path
  medium: registry value exists but the on-disk target is gone (still probative of
    existence)
  low: autostart/uninstall entries matching known-good software
mitre:
- T1112
- T1547.001
- T1078
