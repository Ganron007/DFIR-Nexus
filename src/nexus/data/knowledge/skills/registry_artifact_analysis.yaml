caveats:
- 'Check ControlSet selection: use SYSTEM\Select\Current — LastKnownGood copies duplicate
  stale values across ControlSet00N trees (13Cubed WE 9).'
- Key last-write is the key's, not the value's — a new value inside an old key keeps
  the old timestamp.
- ShellBags prove folder VIEWING, not file access — combine with LNK/jumplists to
  show a file was opened.
- NTUSER/UsrClass load per user session — artifacts under a SID belong to that user
  only; map SID before attributing.
