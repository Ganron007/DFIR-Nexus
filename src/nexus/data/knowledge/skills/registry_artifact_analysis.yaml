skill: registry_artifact_analysis
title: Registry-hive analysis — NTUSER/UsrClass/SYSTEM/SOFTWARE user + OS activity
kind: methodology
description: 'The registry answers two questions most artifacts cannot: what the USER did (Explorer MRUs, ShellBags,
  UserAssist, searches) and how the OS is configured (services, USB devices, installed software). Work per-hive:
  SYSTEM for machine state, NTUSER/UsrClass per-user for behavior.'
trigger:
  families:
  - recmd
  - registry
  - sbecmd
  keywords:
  - registry
  - hive
  - ntuser
  - usrclass
  - shellbag
  - bagmru
  - mru
  - recentdocs
  - runkey
  - userassist
  techniques:
  - T1112
  - T1547.001
  - T1078
steps:
- name: hive_inventory
  query: file:ntuser OR file:usrclass OR file:system OR file:software OR file:sam OR file:security
  look_for: Map which hives were parsed. SYSTEM = machine config/services/devices; SOFTWARE = installed programs/policies;
    SAM/SECURITY = local accounts; NTUSER/UsrClass = per-user behavior. Missing hives bound what the registry can
    answer.
  pivot: KeyPath
  requires:
    families:
    - recmd
  es_source:
    bool:
      filter:
      - terms:
          family:
          - recmd
  source: families recmd
  kind: aggregate
  search:
    families:
    - recmd
  aggregate:
    field: fields.HiveType
    size: 20
  es:
    bool:
      filter:
      - terms:
          family:
          - recmd
  es_aggs:
    by:
      terms:
        field: fields.HiveType.kw
        size: 20
- name: shellbags_folder_views
  query: bagmru OR file:shellbag
  look_for: ShellBags (BagMRU + Bags in NTUSER\Software\Microsoft\Windows\Shell* and USRCLASS\Local Settings\Software\Microsoft\Windows\Shell*)
    record every folder the user viewed in Explorer — proof a user browsed a path even if it is now deleted or on
    a detached USB volume. NodeSlot order reconstructs the navigation sequence.
  pivot: AbsolutePath
  corroborate: a shellbag for a staging dir before payload mtime shows recon-before-drop
  requires:
    families:
    - sbecmd
  es_source:
    bool:
      filter:
      - terms:
          family:
          - sbecmd
  source: families sbecmd
  kind: aggregate
  search:
    families:
    - sbecmd
  aggregate:
    field: ecs.file.path
    size: 200
  es:
    bool:
      filter:
      - terms:
          family:
          - sbecmd
  es_aggs:
    by:
      terms:
        field: ecs.file.path
        size: 200
- name: comdlg32_mru
  query: opensavepidlmru OR lastvisitedpidlmru OR comdlg32
  look_for: ComDlg32 OpenSavePidlMRU (files via open/save dialogs) and LastVisitedPidlMRU (apps used to open/save)
    — which files the user touched through the GUI and with what application.
  pivot: ValueName
  requires:
    families:
    - recmd
  es_source:
    bool:
      filter:
      - terms:
          family:
          - recmd
  source: families recmd
  search:
    families:
    - recmd
    all:
    - field: ecs.registry.path
      contains:
      - \Explorer\ComDlg32\
  es:
    bool:
      filter:
      - terms:
          family:
          - recmd
      - wildcard:
          ecs.registry.path.wc:
            value: '*\\Explorer\\ComDlg32\\*'
            case_insensitive: true
- name: recent_and_typed
  query: recentdocs OR runmru OR typedpaths OR wordwheelquery
  look_for: RecentDocs (recent file interaction), RunMRU (Start>Run history), TypedPaths (paths typed into the Explorer
    bar), WordWheelQuery (Explorer search terms) — intent-bearing user actions; a TypedPath or search for a staging
    directory is hard to attribute to automation.
  pivot: ValueName
  requires:
    families:
    - recmd
  es_source:
    bool:
      filter:
      - terms:
          family:
          - recmd
  source: families recmd
  search:
    families:
    - recmd
    any:
    - field: ecs.registry.path
      contains:
      - \Explorer\RecentDocs
      - \Explorer\RunMRU
      - \Explorer\TypedPaths
      - \Explorer\WordWheelQuery
  es:
    bool:
      filter:
      - terms:
          family:
          - recmd
      - bool:
          should:
          - wildcard:
              ecs.registry.path.wc:
                value: '*\\Explorer\\RecentDocs*'
                case_insensitive: true
          - wildcard:
              ecs.registry.path.wc:
                value: '*\\Explorer\\RunMRU*'
                case_insensitive: true
          - wildcard:
              ecs.registry.path.wc:
                value: '*\\Explorer\\TypedPaths*'
                case_insensitive: true
          - wildcard:
              ecs.registry.path.wc:
                value: '*\\Explorer\\WordWheelQuery*'
                case_insensitive: true
          minimum_should_match: 1
- name: services_and_drivers
  query: file:system services OR currentcontrolset\services
  look_for: SYSTEM\CurrentControlSet\Services — installed services/drivers with ImagePath, Start type (2=auto),
    and last-write time. Unsigned or user-writable ImagePaths starting auto = persistence-shaped.
  pivot: ImagePath
  corroborate: service last-write ≈ intrusion window + matching Security 7045
  requires:
    families:
    - recmd
  es_source:
    bool:
      filter:
      - terms:
          family:
          - recmd
  source: families recmd
  search:
    families:
    - recmd
    all:
    - field: fields.Category
      is:
      - Services
  es:
    bool:
      filter:
      - terms:
          family:
          - recmd
      - term:
          fields.Category.kw:
            value: Services
            case_insensitive: true
- name: run_and_autostart
  query: currentversion\run OR runonce
  look_for: HKLM/HKCU Run, RunOnce, RunOnceEx, Policies\Explorer\Run — autostart values pointing to user-writable
    or temp paths; check both hives.
  pivot: ValueName
  requires:
    families:
    - recmd
  es_source:
    bool:
      filter:
      - terms:
          family:
          - recmd
  source: families recmd
  search:
    families:
    - recmd
    any:
    - field: ecs.registry.path
      contains:
      - \CurrentVersion\Run
      - \Policies\Explorer\Run
  es:
    bool:
      filter:
      - terms:
          family:
          - recmd
      - bool:
          should:
          - wildcard:
              ecs.registry.path.wc:
                value: '*\\CurrentVersion\\Run*'
                case_insensitive: true
          - wildcard:
              ecs.registry.path.wc:
                value: '*\\Policies\\Explorer\\Run*'
                case_insensitive: true
          minimum_should_match: 1
- name: installed_software
  query: file:software uninstall OR microsoft\windows\currentversion\uninstall
  look_for: SOFTWARE\...\Uninstall inventory — what is legitimately installed; attacker tools appearing here (or
    conspicuously absent) frame what "normal" software looks like on this host.
  requires:
    families:
    - recmd
  es_source:
    bool:
      filter:
      - terms:
          family:
          - recmd
  source: families recmd
  search:
    families:
    - recmd
    all:
    - field: ecs.registry.path
      contains:
      - \CurrentVersion\Uninstall
  es:
    bool:
      filter:
      - terms:
          family:
          - recmd
      - wildcard:
          ecs.registry.path.wc:
            value: '*\\CurrentVersion\\Uninstall*'
            case_insensitive: true
- name: sam_local_accounts
  query: file:sam
  look_for: SAM domains/users — local account RIDs, creation times, group membership; attacker-created local admins
    survive in SAM even if never used interactively.
  pivot: RelativeID
  requires:
    families:
    - recmd
  es_source:
    bool:
      filter:
      - terms:
          family:
          - recmd
  source: families recmd
  search:
    families:
    - recmd
    all:
    - field: fields.HiveType
      is:
      - Sam
  es:
    bool:
      filter:
      - terms:
          family:
          - recmd
      - term:
          fields.HiveType.kw:
            value: Sam
            case_insensitive: true
negative: Absent user-behavior keys (no ShellBags/MRU for a profile) means either a service/system account context
  or hive collection gaps — check which hives were actually parsed before concluding the account was not user-driven.
confidence_rules:
  high: user-behavior artifact (shellbag/MRU/typedpath) + corroborating file-system evidence for the same path
  medium: registry value exists but the on-disk target is gone (still probative of existence)
  low: autostart/uninstall entries matching known-good software
mitre:
- T1112
- T1547.001
- T1078
caveats:
- 'Check ControlSet selection: use SYSTEM\Select\Current — LastKnownGood copies duplicate stale values across ControlSet00N
  trees (13Cubed WE 9).'
- Key last-write is the key's, not the value's — a new value inside an old key keeps the old timestamp.
- ShellBags prove folder VIEWING, not file access — combine with LNK/jumplists to show a file was opened.
- NTUSER/UsrClass load per user session — artifacts under a SID belong to that user only; map SID before attributing.
