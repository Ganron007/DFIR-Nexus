caveats:
- Normalize EVERYTHING to UTC before merging — setupapi is local-time, browsers are
  µs-epochs, evtx is UTC; mixed zones silently corrupt sequence.
- A timestamp is only as meaningful as its type — file-created vs file-modified vs
  entry-created mean different things; read the 'type'/'desc' columns, not just the
  time.
- Filtering is reduction, not deletion — always record the filter applied so another
  examiner can reproduce the view.
- Filesystem timeline ≠ super timeline — the bodyfile has no event-log/registry/browser
  content; don't claim 'the timeline shows no logons' from a filestat-only stream.
