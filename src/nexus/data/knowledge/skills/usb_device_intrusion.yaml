caveats:
- setupapi.dev.log timestamps are LOCAL time — merge them into a UTC timeline or your
  insert-time will drift by the zone offset.
- Event 20001 fires only on FIRST connect per device — a reused attacker's own USB
  won't re-log; rely on MountPoints2/USN for repeat use.
- Phone/Media devices (MTP/WPD) use different keys than USBSTOR mass-storage — check
  WPDBUSENUM for non-drive devices.
- Virtual machines report virtual USB/disk devices (VMware tools) — exclude VID 0e0f-style
  virtual hardware before flagging.
