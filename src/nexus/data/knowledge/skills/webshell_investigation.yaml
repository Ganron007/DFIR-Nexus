negative: 'Clean worker-process trees + no rogue-page POSTs + no webroot writes → webshell unlikely on this server.
  Caveat: memory-only webshells and framework-integrated backdoors (evil IIS modules, ISAPI filters) leave no page-file
  artifact — check module/config artifacts too.'
confidence_rules:
  high: w3wp exec chain + matching POST-to-page + webroot write in the window
  medium: exec chain without confirmed page (in-memory shell) or page without exec
  low: single suspicious POST (scanner/probe noise)
mitre:
- T1505.003
- T1106
caveats:
- IIS logs can lag or be disabled — missing access-log evidence doesn't clear the exec chain evidence.
- Some admin tools and health checks POST to endpoints — verify the page path isn't a legitimate handler.
- A cleaned webroot doesn't mean no webshell — check USN journal + memory for the deleted file.
- China Chopper-class shells are single-line eval stubs — size-based hunting misses them; behavioral (exec chain)
  hunting catches them.
