caveats:
- Shadow copies age out or are deleted (vssadmin delete shadows is a common ransom
  tactic) — their absence is a gap, and a deleted shadow store is itself suspicious.
- Zone.Identifier ADS is created by every browser download — benign ADSton; require
  a hidden payload, not the marker alone (FD-004).
- Recycle Bin $R content is recoverable only while the bin is not purged; a SID with
  $I entries but no $R means content is gone.
- MFT time fields can be corrupted by legitimate tools (e.g. robocopy /copy:T) — a
  single odd timestamp is weak; look for a pattern.
