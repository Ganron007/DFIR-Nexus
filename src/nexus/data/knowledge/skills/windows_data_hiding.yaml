# kb: d_5313a9a6ca8d:c0363 (EBOOKS — Applied Incident Response Ch9: volume
#      shadow copies as differential block backups at the volume root;
#      restoration/recovery for deleted evidence)
# kb: d_8beaf108808f:c0318 (EBOOKS — Evasive Malware Ch16: NTFS Alternate
#      Data Streams to hide files/data; anti-forensic use)
# kb: d_dc3b13fade46:c0055 (SANS FOR508.5 — $DATA attributes must be named;
#      resident vs non-resident ADS in the MFT record)
# kb: d_03c2a24fc8ff:c0071 (SANS FOR500.1 — data recovery: VSS, metadata,
#      file/stream carving, string searching)
skill: windows_data_hiding
title: Hidden/deleted data on NTFS — shadow copies, ADS, recycle bin, timestomp
description: >-
  Find data an attacker tried to hide or destroy on an NTFS volume: enumerate
  and mount Volume Shadow Copies to recover pre-deletion state, detect
  Alternate Data Streams, parse the Recycle Bin ($I/$R), and catch timestomping
  by comparing $STANDARD_INFORMATION against $FILE_NAME timestamps.
trigger:
  families: [mftecmd, mft, fls, registry, evtx, usn]
  keywords: [shadow, ads, alternate data stream, recycle, $i, timestomp, usn, vss, deleted, carving]
  techniques: [T1070.004, T1070.006, T1564.004, T1485, T1490]
steps:
  - name: shadow_copy_enumeration
    query: "vssadmin OR shadowcopy OR vsc OR \\\\?\\GLOBALROOT OR plaso"
    look_for: >-
      Enumerate Volume Shadow Copies (vssadmin list shadows / vshadowinfo /
      VSS artifacts under System Volume Information). Shadow copies are
      point-in-time differential backups — mounting one recovers files deleted
      or encrypted AFTER the snapshot, including ransomware pre-encryption
      state. Record each shadow's creation time.
    pivot: FileName
    corroborate: a file present in a VSS snapshot but absent from the live volume proves deletion
  - name: shadow_copy_restore
    query: "GLOBALROOT OR HarddiskVolumeShadowCopy OR shadow copy mount"
    look_for: >-
      Mount read-only via \\?\GLOBALROOT\Device\HarddiskVolumeShadowCopyN and
      compare against the live volume: files deleted, modified, or encrypted
      between the snapshot and now. This is the single highest-value recovery
      step on a compromised NTFS host.
    pivot: FileName
  - name: alternate_data_streams
    query: "Alternate Data Stream OR :Zone.Identifier OR $DATA OR stream"
    look_for: >-
      ADS hide data beside a file: `dir /r` and MFTECmd show named $DATA
      attributes (e.g. file.txt:evil.exe). Malware stashes payloads in ADS and
      Zone.Identifier marks downloads. Non-resident named $DATA attributes in
      the MFT record are the forensic trace.
    pivot: FileName
    corroborate: the ADS content hash matches a known payload on disk or in memory
  - name: recycle_bin_artifacts
    query: "$I OR $R OR RECYCLE.BIN OR recycle"
    look_for: >-
      The Recycle Bin stores $I<id> (original path + deletion time + size) and
      $R<id> (content) per user SID. Parse both: $I proves what was deleted and
      when; $R recovers the content. Per-user SID ties deletion to an account.
    pivot: FileName
    corroborate: the deleted file's hash matches a payload found in prefetch/Sysmon
  - name: timestomp_detection
    query: "$SI OR $FN OR $STANDARD_INFORMATION OR 0x10 OR 0x30"
    look_for: >-
      Timestomping: $STANDARD_INFORMATION ($SI, modifiable) earlier than or
      wildly inconsistent with $FILE_NAME ($FN, only set at creation). A $SI
      time predating the volume format, or nanosecond precision lost in $SI but
      present in $FN, is the classic tell.
    pivot: FileName
    corroborate: USN journal or $LogFile shows the file was written after its claimed $SI time
  - name: usn_and_journal_gaps
    query: "$UsnJrnl OR USN OR $LogFile OR journal"
    look_for: >-
      USN journal ($UsnJrnl:$J) records create/delete/rename/data-change — gaps
      or truncation indicate journal clearing or overwrite; correlate remaining
      records against the MFT. This dates activity and exposes cleanup.
    pivot: FileName
negative: >-
  No shadow copies, no ADS, empty/absent Recycle Bin, consistent $SI/$FN
  timestamps, and an intact USN journal → no evidence of hidden or destroyed
  data on this volume for the retained window. A missing USN journal or absent
  shadow copies is itself a gap — note it rather than reading clean.
confidence_rules:
  high: file recovered from shadow copy that is absent/encrypted live + timestomp tell on the same file
  medium: ADS or deleted-$I artifact consistent with the intrusion without the recovered payload
  low: a lone ADS (Zone.Identifier from normal downloads) or a benign deletion (FD-004)
mitre: [T1070.004, T1070.006, T1564.004, T1485, T1490]
source:
  - "d_5313a9a6ca8d:c0363"
  - "d_8beaf108808f:c0318"
  - "d_dc3b13fade46:c0055"
  - "d_03c2a24fc8ff:c0071"
caveats:
  - "Shadow copies age out or are deleted (vssadmin delete shadows is a common ransom tactic) — their absence is a gap, and a deleted shadow store is itself suspicious."
  - "Zone.Identifier ADS is created by every browser download — benign ADSton; require a hidden payload, not the marker alone (FD-004)."
  - "Recycle Bin $R content is recoverable only while the bin is not purged; a SID with $I entries but no $R means content is gone."
  - "MFT time fields can be corrupted by legitimate tools (e.g. robocopy /copy:T) — a single odd timestamp is weak; look for a pattern."
