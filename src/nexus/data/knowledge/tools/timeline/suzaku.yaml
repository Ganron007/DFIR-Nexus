name: Suzaku
category: timeline
description: "Yamato Suzaku - cloud-log DFIR timelines and Sigma-based threat detection (AWS CloudTrail / Azure)"
platform: [windows, linux]
artifacts_parsed: []
caveats:
  - "Suzaku 2.x is cloud-only: AWS CloudTrail (gz/json/parquet) and Azure activity logs - it no longer parses local EVTX (that is Hayabusa's job)"
  - "Rules are CWD-relative (./rules) and the AWS profile config is CWD-relative (./config) - run from the Suzaku install dir or pass -r <rules>"
  - "Rule coverage differs from Hayabusa/Sigma; compare hits rather than treating either as complete"
output_notes:
  format: csv_or_jsonl
  key_fields: [Timestamp, RuleTitle, RuleAuthor, Level, EventName, AWS-Region, SrcIP, UserName, RuleID]
quick_start: "suzaku aws-ct-timeline -d <CloudTrail-dir> -r rules -o timeline.csv -t csv  (run from the Suzaku install dir)"
advisories:
  - "Azure mode: suzaku azure-timeline -f azure-activity.json -r rules -o azure-timeline.csv -t csv"
  - "Use in the cloud wave (ingest) - not the EVTX lane; local EVTX analysis stays with Hayabusa/EvtxECmd"
references:
  - "https://github.com/Yamato-Security/suzaku"
