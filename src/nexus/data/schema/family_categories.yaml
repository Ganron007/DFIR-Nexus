# D112 (2026-10-13): the category of an evidence row that the pinned table (event_categories.yaml) does not name.
#
# A row is classified only when it names the subject its category needs: a file path for a file category, a
# registry path for a registry category, the program for a process category. Those columns are mapped in
# ecs_map.yaml (family_columns) and subject.FAMILY_SUBJECT_COLUMNS. A family whose rows name no such subject
# stays `other`: its rows are unclassified and are not compared across modes. They are not given the host as
# their subject, because a host subject would match every claim about that host.
#
# A rule names a family and, optionally, a glob on the row's file (case-insensitive; `*` crosses folders). A
# rule with a glob is tried before the family's own rule. Every category must be a key of
# subject.GROUP_OF_CATEGORY (tests/test_family_categories.py checks this).
version: 1
rules:
  # a file path the row names (ecs.file.path)
  - {family: mftecmd, glob: "mftecmd/*", category: file_event}
  - {family: lecmd, category: file_event}
  - {family: jlecmd, category: file_event}
  # the shellbag rows only: the messages file in the same family names no path
  - {family: sbecmd, glob: "*shellbags*", category: file_event}
  - {family: rbcmd, category: file_delete}
  # a registry key the row names (ecs.registry.path, or the RECmd batch key)
  - {family: recmd, category: registry_event}
  # the program the row names (ecs.process.executable, or subject.FAMILY_SUBJECT_COLUMNS)
  - {family: pecmd, category: process_creation}
  - {family: prefetch, category: process_creation}
  - {family: appcompat, category: process_creation}
  - {family: wxtcmd, glob: "*_Activity.csv", category: process_creation}
  - {family: srumecmd, glob: "*AppResourceUseInfo*", category: process_creation}
  - {family: srumecmd, glob: "*NetworkUsages*", category: network_connection}
